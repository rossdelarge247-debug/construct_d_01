name: coverage-threshold-ratchet
on:
  pull_request:
  push:

jobs:
  ratchet:
    name: Coverage threshold ratchet (F5c)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run coverage-threshold ratchet
        run: scripts/coverage-threshold-ratchet.sh origin/main
