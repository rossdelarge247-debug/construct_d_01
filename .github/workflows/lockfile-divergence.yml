name: Lockfile divergence guard

on:
  pull_request:
    paths:
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'scripts/lockfile-divergence-check.sh'
      - '.github/workflows/lockfile-divergence.yml'
  push:
    branches: [main]

jobs:
  check:
    name: Lockfile divergence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure pyyaml available
        run: python3 -c "import yaml" || pip3 install pyyaml
      - name: Run divergence check
        run: bash scripts/lockfile-divergence-check.sh
