name: spec-citation-quote (CI mirror)

# Author-time advisory at .claude/hooks/spec-citation-quote.sh runs at write/edit
# time; this workflow is the merge-time gate that additionally fuzzy-matches
# the local quoted text against the cited spec file. Fabricated quotes fail here.

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'docs/slices/S-*/**.md'
      - 'docs/workspace-spec/*.md'
      - 'scripts/spec-citation-quote-check.sh'
      - 'scripts/spec-citation-patterns.sh'
      - '.github/workflows/spec-citation-quote.yml'
  push:
    branches: [main]
    paths:
      - 'docs/slices/S-*/**.md'
      - 'docs/workspace-spec/*.md'
      - 'scripts/spec-citation-quote-check.sh'
      - 'scripts/spec-citation-patterns.sh'
      - '.github/workflows/spec-citation-quote.yml'

permissions:
  contents: read

jobs:
  check:
    name: spec-citation-quote-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Determine base ref
        id: base
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          fi
      - name: Run spec-citation-quote-check on newly-added files only
        # Pragmatic scope: gate fires on Added (`A`) files, not Modified (`M`).
        # Pre-existing per-cite citations across the corpus would block every
        # spec-modifying PR otherwise. Future improvement: line-level diff
        # filtering for modified files. Tracked in slice's verification.md.
        run: |
          ADDED=$(git diff --name-status "${{ steps.base.outputs.sha }}"..HEAD -- 'docs/slices/S-*/*.md' 'docs/workspace-spec/*.md' | awk '$1 == "A" { for (i=2; i<=NF; i++) printf "%s%s", $i, (i==NF ? "\n" : " ") }')
          if [ -z "$ADDED" ]; then
            echo "No newly-added slice or workspace-spec files; skipping (modified files grandfathered at this gate version)."
            exit 0
          fi
          echo "Newly-added files:"
          echo "$ADDED"
          # shellcheck disable=SC2086
          bash scripts/spec-citation-quote-check.sh $ADDED
