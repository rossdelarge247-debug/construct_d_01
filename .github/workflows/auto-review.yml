name: auto-review (multi-agent · 3 specialists)

# Per docs/slices/S-INFRA-persona-suite-v2-multi-agent/acceptance.md AC-1:
# orchestrator fans out to 3 specialist subagents in parallel (matrix
# strategy across `security · correctness · style` per
# spec 72c §3-§4), collects per-specialist envelopes, aggregates via
# `scripts/spawn-multi-reviewer.sh aggregate` (k=1 default + shadow
# k=2/k=3 monitor per spec 72c §5), posts a unified check-run +
# findings comment.
#
# Replaces the prior single-agent persona invocation. Degraded mode
# (≥1 specialist inconclusive) reported in the
# aggregator output; no fallback to a single-agent re-run per
# AC-1 verification 3 + spec 72c §3.
#
# Out: integration with branch-protection (defer to v3c per spec 72c §9).
# This workflow is mostly informational at v3b ship — `approve` →
# `success`, `request-changes`/`nit-only` → `neutral` (advisory only).
# Two failure modes gate the merge button: `block` verdict → `failure`;
# `parse-failed` (all 3 specialist outputs unparseable) → `failure`;
# pipeline-crash (`if: failure()` fallback) → `failure`.
# Skip on missing `ANTHROPIC_API_KEY` stays `neutral` so fork PRs
# aren't gated by a secret they can't access.
#
# Secret precondition: ANTHROPIC_API_KEY must be set as a repo secret.

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - 'docs/design-source/**'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  brief:
    name: auto-review · compose briefs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.secret-check.outputs.skip }}
      dimensions: ${{ steps.compose.outputs.dimensions }}
    steps:
      - name: Check ANTHROPIC_API_KEY presence
        id: secret-check
        env:
          KEY_PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$KEY_PRESENT" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY not configured — auto-review will skip with neutral verdict."
          fi

      - uses: actions/checkout@v4
        if: steps.secret-check.outputs.skip == 'false'
        with:
          fetch-depth: 0

      - name: Compose per-specialist briefs (diff + slice AC + coding-conduct)
        id: compose
        if: steps.secret-check.outputs.skip == 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/briefs

          # Diff (file under review for each persona; spec 72b Option C
          # inline-file pattern when >300L). Exclude docs/design-source/**
          # — large standalone HTML / zip artefacts crash specialist parsers
          # without contributing reviewable code (the design canvas is
          # consulted at slice AC-freeze, not per-PR diff review).
          git diff "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude)docs/design-source' > /tmp/pr-diff.txt

          SLICE_AC=$(scripts/auto-review-slice-resolve.sh "$BRANCH" "$PR_BODY")

          # Spec 76 §2 slice-category detection (dual-resolution: explicit
          # acceptance.md override > path default). Determines specialist
          # dimensions per spec 76 §3 substitute pattern: prototype slices
          # swap reviewer-correctness for reviewer-prototype-readiness.
          CATEGORY="production"
          OVERRIDE=""
          if [ -n "$SLICE_AC" ] && [ -f "$SLICE_AC" ]; then
            OVERRIDE=$(grep -E '^\*\*Category:\*\*[[:space:]]+(prototype|production|infrastructure)$' "$SLICE_AC" | head -1 || true)
            if [ -n "$OVERRIDE" ]; then
              CATEGORY=$(printf '%s' "$OVERRIDE" | sed -E 's/^\*\*Category:\*\*[[:space:]]+//; s/[[:space:]]*$//')
            fi
          fi
          if [ -z "$OVERRIDE" ]; then
            # Path-default: any diff entry under literal-slug prototype path.
            PROTO_HIT=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null \
              | grep -E '^src/app/dev/proto/[^/[]+/.+\.(ts|tsx)$' | head -1 || true)
            if [ -n "$PROTO_HIT" ]; then
              CATEGORY="prototype"
            fi
          fi
          case "$CATEGORY" in
            prototype) DIMS_JSON='["security","prototype-readiness","style"]' ;;
            *)         DIMS_JSON='["security","correctness","style"]' ;;
          esac

          # Canvas-fidelity dimension (additive, conditional): when prototype
          # slice's acceptance.md carries `**Linked canvas:** <path1> <path2> ...`,
          # fan out a 4th specialist comparing diff against the named canvas
          # files. Field-absent OR non-prototype keeps DIMS_JSON unchanged.
          # Workflow header still says "3 specialists" — kept for branch-
          # protection / required-status-check stability.
          CANVAS_PATHS=""
          if [ "$CATEGORY" = "prototype" ] && [ -n "$SLICE_AC" ] && [ -f "$SLICE_AC" ]; then
            CANVAS_LINE=$(grep -E '^\*\*Linked canvas:\*\*[[:space:]]+' "$SLICE_AC" | head -1 || true)
            if [ -n "$CANVAS_LINE" ]; then
              CANVAS_PATHS=$(printf '%s' "$CANVAS_LINE" | sed -E 's/^\*\*Linked canvas:\*\*[[:space:]]+//; s/[[:space:]]+$//')
              DIMS_JSON='["security","prototype-readiness","style","canvas-fidelity"]'
            fi
          fi

          echo "Resolved slice category: $CATEGORY"
          echo "Specialist dimensions: $DIMS_JSON"
          echo "dimensions=$DIMS_JSON" >> "$GITHUB_OUTPUT"

          # Author filter (`.user.login == "github-actions[bot]"`) prevents
          # a malicious PR commenter from injecting a crafted prior-findings
          # block into the trusted `<prior-findings-NONCE>` fence, bypassing
          # the verdict-coercion guard (which only discards claims in PR
          # body / diff comments). SHA hex-shape guard prevents argument-
          # injection into git subprocesses below.
          DIFFERENTIAL=false
          PRIOR_HEAD_SHA=""
          MARKER='<!-- auto-review-comment:multi-agent -->'
          PRIOR_JSON=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${MARKER}\"))) | .body" \
            | scripts/auto-review-extract-prior.sh || true)
          if [ -n "${PRIOR_JSON:-}" ]; then
            PRIOR_HEAD_SHA=$(printf '%s' "$PRIOR_JSON" | jq -r '.head_sha')
            if [[ "$PRIOR_HEAD_SHA" =~ ^[0-9a-f]{40,64}$ ]] && git cat-file -e "${PRIOR_HEAD_SHA}^{commit}" 2>/dev/null; then
              DIFFERENTIAL=true
              printf '%s' "$PRIOR_JSON" > /tmp/prior-findings.json
              git diff "$PRIOR_HEAD_SHA" "$HEAD_SHA" -- . ':(exclude)docs/design-source' > /tmp/fix-up-diff.txt
            fi
          fi
          echo "differential-mode: $DIFFERENTIAL (prior-head=${PRIOR_HEAD_SHA:-none})"

          # Compose one brief per dimension. Each persona file already
          # carries its own rubric + JSON output schema + verdict-coercion
          # guard (per AC-2). Brief shape mirrors the prior single-agent
          # composition: persona body + nonce + fenced inputs.
          for DIM in $(printf '%s' "$DIMS_JSON" | jq -r '.[]'); do
            NONCE=$(openssl rand -hex 16)
            {
              cat ".claude/agents/reviewer-${DIM}.md"
              echo
              echo "Your per-invocation nonce: $NONCE"
              echo
              printf '<pr-diff-%s>\n' "$NONCE"
              cat /tmp/pr-diff.txt
              printf '</pr-diff-%s>\n\n' "$NONCE"
              if [ "$DIFFERENTIAL" = "true" ]; then
                printf '<fix-up-diff-%s>\n' "$NONCE"
                cat /tmp/fix-up-diff.txt
                printf '</fix-up-diff-%s>\n\n' "$NONCE"
                printf '<prior-findings-%s>\n' "$NONCE"
                scripts/auto-review-filter-prior.sh "$DIM" < /tmp/prior-findings.json
                printf '</prior-findings-%s>\n\n' "$NONCE"
              fi
              if [ -n "$SLICE_AC" ] && [ -f "$SLICE_AC" ]; then
                printf '<slice-ac-%s>\n' "$NONCE"
                cat "$SLICE_AC"
                printf '</slice-ac-%s>\n\n' "$NONCE"
              fi
              if [ "$DIM" = "canvas-fidelity" ] && [ -n "$CANVAS_PATHS" ]; then
                printf '<linked-canvas-%s>\n' "$NONCE"
                for CANVAS_PATH in $CANVAS_PATHS; do
                  if [ -f "$CANVAS_PATH" ]; then
                    printf -- '--- BEGIN %s %s ---\n' "$CANVAS_PATH" "$NONCE"
                    cat "$CANVAS_PATH"
                    printf -- '\n--- END %s %s ---\n' "$CANVAS_PATH" "$NONCE"
                  fi
                done
                printf '</linked-canvas-%s>\n\n' "$NONCE"
              fi
              printf '<coding-conduct-%s>\n' "$NONCE"
              # Drop trailing `## Engineering conventions` header that
              # awk's range pattern includes.
              awk '/^## Coding conduct/,/^## Engineering conventions/' CLAUDE.md | head -n -1
              printf '</coding-conduct-%s>\n' "$NONCE"
            } > "/tmp/briefs/${DIM}.txt"
          done

      - name: Upload briefs artifact
        if: steps.secret-check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: auto-review-briefs
          path: /tmp/briefs/
          retention-days: 1

      - name: Post failure-fallback check run (when brief-job crashed)
        # Without this step, a brief-job crash would post no check-run
        # and the merge button would NOT be gated by the pipeline-crash
        # → failure rule: aggregate's `needs.brief.result == 'success'`
        # gate skips it entirely on brief failure, so brief must surface
        # its own failure here.
        if: failure() && steps.secret-check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          jq -n \
            --arg name 'auto-review (multi-agent · 3 specialists)' \
            --arg head_sha "$HEAD_SHA" \
            --arg run_url "$RUN_URL" \
            '{name: $name, head_sha: $head_sha, status: "completed", conclusion: "failure", output: {title: "Review pipeline crashed in brief-compose — see workflow log", summary: ("auto-review.yml `brief` job failed before composing per-specialist prompts (slice-resolve, awk range, openssl, persona-file read, or artifact upload). Inspect the workflow log: " + $run_url + " — re-run the workflow to retry; if the cause was transient the next run will succeed and supersede this failure check.")}}' \
          | gh api "repos/${{ github.repository }}/check-runs" --method POST --input -

          MARKER='<!-- auto-review-comment:multi-agent -->'
          BODY=$(printf '%s\n\n## auto-review · multi-agent (3 specialists)\n\n**Verdict:** 💥 pipeline-crashed — review did not produce a verdict\n\nThe `brief` job failed before composing per-specialist prompts (slice-resolve, awk range, openssl, persona-file read, or artifact upload). Common causes: missing persona file, malformed `CLAUDE.md` range pattern, runner network issue.\n\nInspect the [workflow log](%s) on commit `%s` for the actual error.\n\n---\n_Auto-posted by `auto-review.yml` (brief-job fallback). Pipeline-crash promotes to `failure` (the merge button is gated until the workflow re-runs successfully). Re-running the workflow is the escape hatch._\n' "$MARKER" "$RUN_URL" "$HEAD_SHA")
          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
            | head -n 1 || true)
          if [ -n "${COMMENT_ID:-}" ]; then
            jq -n --arg body "$BODY" '{body: $body}' \
              | gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" --method PATCH --input -
          else
            jq -n --arg body "$BODY" '{body: $body}' \
              | gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --method POST --input -
          fi

  specialist:
    name: auto-review · ${{ matrix.dimension }}
    needs: brief
    # Explicit `needs.brief.result == 'success'` matches aggregate's
    # gate. An explicit `if:` replaces the implicit `success()` check;
    # without the result check, a brief-job crash AFTER secret-check sets
    # skip=false would still start 3 specialists wastefully.
    if: needs.brief.result == 'success' && needs.brief.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dimension: ${{ fromJSON(needs.brief.outputs.dimensions) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: scripts

      - name: Download briefs artifact
        uses: actions/download-artifact@v4
        with:
          name: auto-review-briefs
          path: /tmp/briefs

      - name: Invoke specialist (claude -p)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIM: ${{ matrix.dimension }}
        run: |
          set -euo pipefail
          npx -y @anthropic-ai/claude-code@2.1.126 -p --output-format=json \
            < "/tmp/briefs/${DIM}.txt" > "/tmp/raw-${DIM}.json"

          echo "::group::raw claude output (${DIM}; first 50 lines)"
          head -50 "/tmp/raw-${DIM}.json" || true
          echo "::endgroup::"

          mkdir -p /tmp/envelopes
          scripts/auto-review-parse.sh < "/tmp/raw-${DIM}.json" > "/tmp/envelopes/${DIM}.json"

          echo "::group::parsed envelope (${DIM})"
          cat "/tmp/envelopes/${DIM}.json"
          echo "::endgroup::"

      - name: Upload specialist envelope artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-review-envelope-${{ matrix.dimension }}
          path: /tmp/envelopes/${{ matrix.dimension }}.json
          retention-days: 1
          if-no-files-found: ignore

  aggregate:
    name: auto-review · aggregate + post
    needs: [brief, specialist]
    if: always() && needs.brief.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        if: needs.brief.outputs.skip == 'false'
        with:
          fetch-depth: 1
          sparse-checkout: scripts

      - name: Download all specialist envelopes
        if: needs.brief.outputs.skip == 'false'
        # continue-on-error so all-4-crash produces parse-failed via the
        # aggregator's all-missing path, not pipeline-crashed via the
        # job's failure-fallback (download-artifact@v4 fails by default
        # when zero artifacts match the pattern).
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: /tmp/envelope-artifacts
          pattern: auto-review-envelope-*
          merge-multiple: false

      - name: Aggregate envelopes + derive verdict
        id: aggregate
        if: needs.brief.outputs.skip == 'false'
        env:
          DIMENSIONS_JSON: ${{ needs.brief.outputs.dimensions }}
        run: |
          set -euo pipefail
          # Missing envelope files → aggregator marks that dimension
          # `inconclusive` and degrades gracefully; all-missing →
          # `parse-failed`.
          mkdir -p /tmp/envelopes
          for DIM in $(printf '%s' "$DIMENSIONS_JSON" | jq -r '.[]'); do
            SRC="/tmp/envelope-artifacts/auto-review-envelope-${DIM}/${DIM}.json"
            if [ -f "$SRC" ]; then
              mv "$SRC" "/tmp/envelopes/${DIM}.json"
            else
              echo "specialist envelope missing for dimension: ${DIM}"
            fi
          done

          DIMS_CSV=$(printf '%s' "$DIMENSIONS_JSON" | jq -r 'join(",")')
          AGGREGATE_JSON=$(scripts/spawn-multi-reviewer.sh aggregate --dimensions "$DIMS_CSV" /tmp/envelopes)

          echo "::group::aggregated envelope"
          printf '%s\n' "$AGGREGATE_JSON" | jq .
          echo "::endgroup::"

          printf '%s' "$AGGREGATE_JSON" > /tmp/persona-output.json

          VERDICT=$(printf '%s' "$AGGREGATE_JSON" | jq -r '.verdict')
          SHADOW_K1=$(printf '%s' "$AGGREGATE_JSON" | jq -r '.would_have_been_k1')
          SHADOW_K3=$(printf '%s' "$AGGREGATE_JSON" | jq -r '.would_have_been_k3')
          DEGRADED=$(printf '%s' "$AGGREGATE_JSON" | jq -r '.degraded // false')
          INCONCLUSIVE=$(printf '%s' "$AGGREGATE_JSON" | jq -r '(.inconclusive_dimensions // []) | join(",")')

          if [ "$VERDICT" = "parse-failed" ]; then
            FINDINGS_COUNT=0
            printf '[]' > /tmp/findings.json
          else
            FINDINGS_COUNT=$(printf '%s' "$AGGREGATE_JSON" | jq -r '(.findings // []) | length')
            printf '%s' "$AGGREGATE_JSON" | jq -c '.findings // []' | head -c 60000 > /tmp/findings.json
          fi

          {
            echo "verdict=$VERDICT"
            echo "shadow_k1=$SHADOW_K1"
            echo "shadow_k3=$SHADOW_K3"
            echo "degraded=$DEGRADED"
            echo "inconclusive=$INCONCLUSIVE"
            echo "findings_count=$FINDINGS_COUNT"
          } >> "$GITHUB_OUTPUT"

      - name: Post check run (verdict)
        if: needs.brief.outputs.skip == 'false' && steps.aggregate.outputs.verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERDICT: ${{ steps.aggregate.outputs.verdict }}
          SHADOW_K1: ${{ steps.aggregate.outputs.shadow_k1 }}
          SHADOW_K3: ${{ steps.aggregate.outputs.shadow_k3 }}
          DEGRADED: ${{ steps.aggregate.outputs.degraded }}
          INCONCLUSIVE: ${{ steps.aggregate.outputs.inconclusive }}
          FINDINGS_COUNT: ${{ steps.aggregate.outputs.findings_count }}
        run: |
          set -euo pipefail
          # Verdict → conclusion mapping per CLAUDE.md §"Verdict
          # vocabulary" §"Check-run conclusion mapping". parse-failed
          # promotes to failure (all 3 specialists unparseable means no
          # review actually happened); unknown-verdict default fails
          # closed.
          case "$VERDICT" in
            approve)                       CONCLUSION="success" ;;
            request-changes|nit-only)      CONCLUSION="neutral" ;;
            block)                         CONCLUSION="failure" ;;
            parse-failed)                  CONCLUSION="failure" ;;
            *)                             CONCLUSION="failure" ;;
          esac

          if [ "$VERDICT" = "parse-failed" ]; then
            TITLE="all 3 specialist outputs unparseable — see workflow log"
          elif [ "$DEGRADED" = "true" ]; then
            TITLE="$VERDICT — $FINDINGS_COUNT finding(s) · degraded ($INCONCLUSIVE inconclusive)"
          else
            TITLE="$VERDICT — $FINDINGS_COUNT finding(s) · k=2 (shadow k=1:$SHADOW_K1 k=3:$SHADOW_K3)"
          fi

          SUMMARY=$(cat /tmp/findings.json)
          jq -n \
            --arg name 'auto-review (multi-agent · 3 specialists)' \
            --arg head_sha "$HEAD_SHA" \
            --arg conclusion "$CONCLUSION" \
            --arg title "$TITLE" \
            --arg summary "$SUMMARY" \
            '{name: $name, head_sha: $head_sha, status: "completed", conclusion: $conclusion, output: {title: $title, summary: $summary}}' \
          | gh api "repos/${{ github.repository }}/check-runs" --method POST --input -

      - name: Post findings PR comment (verdict path)
        # New marker (`auto-review-comment:multi-agent`) so legacy single-
        # agent comments (`auto-review-comment:slice-reviewer`) aren't
        # patched in place — multi-agent comments thread independently
        # for visibility during the recursive-validation window.
        if: needs.brief.outputs.skip == 'false' && steps.aggregate.outputs.verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERDICT: ${{ steps.aggregate.outputs.verdict }}
          SHADOW_K1: ${{ steps.aggregate.outputs.shadow_k1 }}
          SHADOW_K3: ${{ steps.aggregate.outputs.shadow_k3 }}
          DEGRADED: ${{ steps.aggregate.outputs.degraded }}
          INCONCLUSIVE: ${{ steps.aggregate.outputs.inconclusive }}
          FINDINGS_COUNT: ${{ steps.aggregate.outputs.findings_count }}
        run: |
          set -euo pipefail
          MARKER='<!-- auto-review-comment:multi-agent -->'

          case "$VERDICT" in
            approve)         HEADLINE='**Verdict:** ✅ approve' ;;
            nit-only)        HEADLINE='**Verdict:** 💬 nit-only (informational at v3b ship)' ;;
            request-changes) HEADLINE='**Verdict:** 🟡 request-changes (informational at v3b ship)' ;;
            block)           HEADLINE='**Verdict:** 🛑 block' ;;
            parse-failed)    HEADLINE='**Verdict:** ⚠️ parse-failed — all 3 specialist outputs unparseable' ;;
            *)               HEADLINE="**Verdict:** \`$VERDICT\`" ;;
          esac

          if [ "$DEGRADED" = "true" ]; then
            DEGRADED_BLOCK=$(printf '\n\n> ⚠️ degraded mode — %s specialist(s) inconclusive (envelope missing or unparseable). Verdict computed from remaining specialists per spec 72c §3.' "$INCONCLUSIVE")
          else
            DEGRADED_BLOCK=""
          fi

          # Suppress shadow monitor on parse-failed path — sentinel
          # carries no signal.
          if [ "$VERDICT" = "parse-failed" ]; then
            SHADOW_BLOCK=""
          else
            SHADOW_BLOCK=$(printf '\n\n_Quorum at `k=2` (default per spec 72c §5). Shadow monitor: `k=1` would have been `%s`; `k=3` would have been `%s`._' "$SHADOW_K1" "$SHADOW_K3")
          fi

          SUMMARY=$(jq -r '.summary // ""' /tmp/persona-output.json)
          if [ -n "$SUMMARY" ]; then
            SUMMARY_BLOCK=$(printf '\n\n> %s' "$SUMMARY")
          else
            SUMMARY_BLOCK=""
          fi

          TABLE=$(jq -r '
            (.findings // []) as $f
            | if ($f | length) == 0 then ""
              else
                "\n\n| Label | Blocking | Category | Seen by | Evidence | Remediation |\n|---|:---:|---|---|---|---|\n"
                + ( $f | map(
                    "| `\(.label // "?")`"
                    + (if (.blocking // false) then " **(blocking)**" else "" end)
                    + " | \(.blocking // false)"
                    + " | `\(.category // "?")`"
                    + " | " + ((.seen_by // []) | map("`" + . + "`") | join(", "))
                    + " | " + ((.evidence // "") | gsub("\\|"; "\\|") | gsub("\n"; " "))
                    + " | " + ((.remediation // "") | gsub("\\|"; "\\|") | gsub("\n"; " "))
                    + " |"
                  ) | join("\n") )
              end
          ' /tmp/persona-output.json)

          FOOTER=$(printf '\n\n---\n_Auto-posted by [`auto-review.yml`](%s) on commit `%s`. 3 specialists fanned out under matrix strategy per spec 72c §3; verdict derived deterministically by `scripts/spawn-multi-reviewer.sh aggregate` per CLAUDE.md §"Verdict vocabulary"; labels follow [Conventional Comments](https://conventionalcomments.org/). `block` and `parse-failed` verdicts gate the merge button (per CLAUDE.md §"Hard controls" §"Check-run conclusion mapping"); `request-changes` and `nit-only` are advisory only at v3b ship._\n' \
            "$RUN_URL" "$HEAD_SHA")

          # Anchored BEGIN/END markers keep awk extraction robust against
          # `-->` substrings that may legitimately appear in finding
          # evidence content.
          if ! jq -e '.findings | type == "array"' /tmp/persona-output.json >/dev/null 2>&1; then
            echo "::warning::aggregator emitted /tmp/persona-output.json without .findings array; persisting empty list" >&2
          fi
          PRIOR_FINDINGS_JSON=$(jq -nc \
            --arg head_sha "$HEAD_SHA" \
            --slurpfile env /tmp/persona-output.json \
            '{head_sha: $head_sha, findings: ($env[0].findings // [])}')
          PRIOR_FINDINGS_BLOCK=$(printf '\n\n<!-- BEGIN-prior-findings-json -->\n%s\n<!-- END-prior-findings-json -->' "$PRIOR_FINDINGS_JSON")

          BODY=$(printf '%s\n\n## auto-review · multi-agent (3 specialists)\n\n%s — %s finding(s)%s%s%s%s%s%s' \
            "$MARKER" "$HEADLINE" "$FINDINGS_COUNT" "$DEGRADED_BLOCK" "$SUMMARY_BLOCK" "$TABLE" "$SHADOW_BLOCK" "$FOOTER" "$PRIOR_FINDINGS_BLOCK")

          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
            | head -n 1 || true)

          if [ -n "${COMMENT_ID:-}" ]; then
            jq -n --arg body "$BODY" '{body: $body}' \
              | gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" --method PATCH --input -
          else
            jq -n --arg body "$BODY" '{body: $body}' \
              | gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --method POST --input -
          fi

      - name: Post skip notice (when secret absent)
        if: needs.brief.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg name 'auto-review (multi-agent · 3 specialists)' \
            --arg head_sha "$HEAD_SHA" \
            '{name: $name, head_sha: $head_sha, status: "completed", conclusion: "neutral", output: {title: "Skipped — ANTHROPIC_API_KEY not configured", summary: "Set ANTHROPIC_API_KEY as a repo secret to enable auto-review per docs/slices/S-INFRA-persona-suite-v2-multi-agent/acceptance.md AC-1."}}' \
          | gh api "repos/${{ github.repository }}/check-runs" --method POST --input -

          MARKER='<!-- auto-review-comment:multi-agent -->'
          BODY=$(printf '%s\n\n## auto-review · multi-agent (3 specialists)\n\n**Verdict:** ⏭️ skipped — `ANTHROPIC_API_KEY` not configured\n\nSet `ANTHROPIC_API_KEY` as a repo secret to enable auto-review per `docs/slices/S-INFRA-persona-suite-v2-multi-agent/acceptance.md` AC-1.\n\n---\n_Auto-posted by `auto-review.yml`. Informational._\n' "$MARKER")
          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
            | head -n 1 || true)
          if [ -n "${COMMENT_ID:-}" ]; then
            jq -n --arg body "$BODY" '{body: $body}' \
              | gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" --method PATCH --input -
          else
            jq -n --arg body "$BODY" '{body: $body}' \
              | gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --method POST --input -
          fi

      - name: Post failure-fallback check run (when an earlier step crashed)
        # Pipeline-crash → failure. Re-running the workflow is the
        # escape hatch.
        if: failure() && needs.brief.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          jq -n \
            --arg name 'auto-review (multi-agent · 3 specialists)' \
            --arg head_sha "$HEAD_SHA" \
            --arg run_url "$RUN_URL" \
            '{name: $name, head_sha: $head_sha, status: "completed", conclusion: "failure", output: {title: "Review pipeline crashed — see workflow log", summary: ("auto-review.yml failed before posting a verdict (artifact upload/download, claude invocation, jq parse, or gh api). Inspect the workflow log: " + $run_url + " — common causes: API outage, malformed persona output, runner network issue, all 3 specialists timing out. Re-run the workflow to retry; if the cause was transient the next run will succeed and supersede this failure check.")}}' \
          | gh api "repos/${{ github.repository }}/check-runs" --method POST --input -

          MARKER='<!-- auto-review-comment:multi-agent -->'
          BODY=$(printf '%s\n\n## auto-review · multi-agent (3 specialists)\n\n**Verdict:** 💥 pipeline-crashed — review did not produce a verdict\n\nThe auto-review workflow failed before posting a verdict (artifact upload/download, `claude` invocation, jq parse, or `gh api`). Common causes: API outage, malformed persona output, runner network issue, all 3 specialists timing out.\n\nInspect the [workflow log](%s) on commit `%s` for the actual error.\n\n---\n_Auto-posted by `auto-review.yml`. Pipeline-crash promotes to `failure` (the merge button is gated until the workflow re-runs successfully). Re-running the workflow is the escape hatch._\n' "$MARKER" "$RUN_URL" "$HEAD_SHA")
          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
            | head -n 1 || true)
          if [ -n "${COMMENT_ID:-}" ]; then
            jq -n --arg body "$BODY" '{body: $body}' \
              | gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" --method PATCH --input -
          else
            jq -n --arg body "$BODY" '{body: $body}' \
              | gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --method POST --input -
          fi
