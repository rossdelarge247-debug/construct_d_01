  .uppercase { text-underline-offset: unset; text-transform: uppercase; }

  .text-\[16px\]   { font-size: 16px; }
  .text-\[18px\]   { font-size: 18px; }

  /* space-y (vertical rhythm between siblings) */
  .space-y-1\.5 > * + * { margin-top: 6px; }
  .space-y-2 > * + *    { margin-top: 8px; }
  .space-y-2\.5 > * + * { margin-top: 10px; }
  .space-y-3 > * + *    { margin-top: 12px; }
  .space-y-4 > * + *    { margin-top: 16px; }
  .space-y-5 > * + *    { margin-top: 20px; }

  /* font-weight */
  .font-medium   { font-weight: 500; }
  .font-semibold { font-weight: 600; }

  /* line-height */
  .leading-tight { line-height: 1.2; }

  /* ---------- project specifics ---------- */
  .o7-no-scrollbar::-webkit-scrollbar { height: 6px; }
  .o7-no-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .o7-no-scrollbar::-webkit-scrollbar-thumb {
    background: rgba(124,58,237,0.18); border-radius: 999px;
  }

  @keyframes o7-breath {
    0%, 100% { transform: scale(0.88); opacity: 0.78; }

  }

  @keyframes o7-fade-in-up {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
