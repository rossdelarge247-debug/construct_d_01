window.__DESKTOP_SRCDOC = {"Landing Page.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"/>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"/>\n<title>Decouple — the complete picture</title>\n<script src=\"https://cdn.tailwindcss.com\"><\/script>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"/>\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<script src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\" integrity=\"sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L\" crossorigin=\"anonymous\"><\/script>\n<script src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\" integrity=\"sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm\" crossorigin=\"anonymous\"><\/script>\n<script src=\"https://unpkg.com/@babel/standalone@7.29.0/babel.min.js\" integrity=\"sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y\" crossorigin=\"anonymous\"><\/script>\n<style>\n  html, body { margin: 0; padding: 0; }\n  body {\n    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;\n    background: #F5F5F4;\n    color: #1A1A1A;\n    -webkit-font-smoothing: antialiased;\n    font-feature-settings: \"ss01\",\"cv11\";\n  }\n  .serif { font-family: 'Source Serif Pro', Georgia, serif; }\n  .mono  { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }\n  .label-xs { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }\n  .tabular { font-variant-numeric: tabular-nums; }\n  .hairline { border: 1px solid #E5E3DC; }\n\n  *:focus-visible { outline: 2px solid #1A1A1A; outline-offset: 2px; border-radius: 4px; }\n\n  /* skip link */\n  .skip {\n    position: fixed; left: 12px; top: 12px; z-index: 100;\n    padding: 8px 14px; background: #1A1A1A; color: #FFF; border-radius: 6px;\n    font-size: 13px; font-weight: 500; text-decoration: none;\n    transform: translateY(-200%); transition: transform 200ms;\n  }\n  .skip:focus { transform: translateY(0); }\n\n  /* section-entry stagger */\n  @keyframes secIn {\n    from { opacity: 0; transform: translateY(8px); }\n    to   { opacity: 1; transform: translateY(0); }\n  }\n  .sec-in { animation: secIn 320ms cubic-bezier(.2,.7,.2,1) both; }\n  .sec-in-1 { animation-delay: 0ms; }\n  .sec-in-2 { animation-delay: 80ms; }\n  .sec-in-3 { animation-delay: 160ms; }\n  .sec-in-4 { animation-delay: 240ms; }\n\n  @media (prefers-reduced-motion: reduce) {\n    .sec-in { animation: none !important; opacity: 1; transform: none; }\n    * { transition: none !important; }\n  }\n\n  /* CTA */\n  .cta-primary {\n    transition: transform 160ms ease-out, box-shadow 160ms ease-out, background 160ms;\n  }\n  .cta-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(26,26,26,0.18); }\n\n  /* faq */\n  details > summary { list-style: none; cursor: pointer; }\n  details > summary::-webkit-details-marker { display: none; }\n  .faq-row[open] .faq-chev { transform: rotate(45deg); }\n  .faq-chev { transition: transform 240ms ease; }\n  .faq-body {\n    overflow: hidden;\n    max-height: 0;\n    opacity: 0;\n    transition: max-height 280ms ease-out, opacity 200ms ease-out, padding 280ms ease-out;\n  }\n  details[open] .faq-body { max-height: 400px; opacity: 1; }\n\n  /* header shrink */\n  .hdr-shrink { height: 56px !important; }\n  .hdr-shrink .hdr-cta-mini { opacity: 1 !important; transform: translateX(0) !important; pointer-events: auto !important; }\n\n  /* placeholder (editorial) */\n  .placeholder-stripe {\n    background-image: repeating-linear-gradient(135deg, transparent 0 11px, rgba(0,0,0,0.04) 11px 12px);\n  }\n\n  /* mobile frame */\n  .mobile-frame {\n    width: 375px; min-height: 667px; max-height: 720px;\n    border-radius: 36px; padding: 8px;\n    background: #1A1A1A;\n    box-shadow: 0 30px 60px rgba(0,0,0,0.18);\n  }\n  .mobile-frame .mobile-screen {\n    width: 100%; height: 100%; min-height: 651px;\n    background: #F5F5F4; border-radius: 28px; overflow-y: auto;\n    position: relative;\n  }\n\n  /* keyboard hint */\n  .kbd {\n    display: inline-flex; align-items: center; justify-content: center;\n    min-width: 20px; height: 20px; padding: 0 5px;\n    background: #FFFFFF; border: 1px solid #E5E3DC; border-bottom-width: 2px;\n    border-radius: 4px; font-size: 11px; font-weight: 600; color: #57534E;\n    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;\n  }\n\n  ::-webkit-scrollbar { width: 8px; height: 8px; }\n  ::-webkit-scrollbar-thumb { background: #D6D3CC; border-radius: 8px; }\n  ::-webkit-scrollbar-track { background: transparent; }\n</style>\n</head>\n<body>\n<div id=\"root\"></div>\n\n<script type=\"text/babel\" data-presets=\"react\" src=\"landing/01_tokens.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"landing/02_atoms.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"landing/03_header.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"landing/04_hero.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"landing/05_picture.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"landing/06_journey.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"landing/07_compare.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"landing/08_trust.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"landing/09_pricing_faq.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"landing/10_closing_footer.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"landing/11_mobile.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"landing/00_app.jsx\"><\/script>\n</body>\n</html>\n","Desktop · How it works.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"/>\n<meta name=\"viewport\" content=\"width=1440\"/>\n<title>Decouple — How it works</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"/>\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"marketing/marketing.css\"/>\n<style>\n\n/* ---- hero band ---- */\n.hw-hero {\n  padding: 96px 0 56px;\n}\n.hw-hero .meta {\n  display: flex; align-items: center; gap: 18px;\n  margin-top: 28px; color: var(--mute); font-size: 13px;\n}\n.hw-hero .meta .dot { width: 4px; height: 4px; border-radius: 999px; background: var(--soft); }\n\n/* ---- timeline rail ---- */\n.tl {\n  position: relative;\n  padding: 64px 0 88px;\n}\n.tl::before {\n  content: \"\"; position: absolute; left: 50%; top: 16px; bottom: 16px;\n  width: 1px; background: var(--line); transform: translateX(-0.5px);\n}\n\n.tl-row {\n  position: relative;\n  display: grid;\n  grid-template-columns: 1fr 56px 1fr;\n  align-items: start;\n  margin: 0 0 44px;\n}\n.tl-row:last-child { margin-bottom: 0; }\n\n.tl-marker {\n  grid-column: 2; align-self: start;\n  display: flex; flex-direction: column; align-items: center; gap: 8px;\n  padding-top: 16px;\n}\n.tl-marker .num {\n  width: 40px; height: 40px; border-radius: 999px;\n  background: var(--panel); border: 1px solid var(--line);\n  display: flex; align-items: center; justify-content: center;\n  font-family: 'Source Serif Pro', Georgia, serif;\n  font-size: 18px; font-weight: 600; color: var(--ink);\n  position: relative; z-index: 2;\n}\n.tl-marker .num.solid { background: var(--ink); color: #fff; border-color: var(--ink); }\n\n.tl-card {\n  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;\n  overflow: hidden;\n  display: flex; flex-direction: column;\n}\n.tl-row:nth-child(odd) .tl-card-text  { grid-column: 1; margin-right: 24px; }\n.tl-row:nth-child(odd) .tl-card-visual { grid-column: 3; margin-left: 24px; }\n.tl-row:nth-child(even) .tl-card-text  { grid-column: 3; margin-left: 24px; order: 2; }\n.tl-row:nth-child(even) .tl-card-visual { grid-column: 1; margin-right: 24px; }\n\n/* text card */\n.tl-card-text { padding: 22px 26px 24px; }\n.tl-card-text .head {\n  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;\n}\n.tl-card-text .phase-label {\n  font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700;\n}\n.tl-card-text h3 {\n  font-family: 'Source Serif Pro', Georgia, serif;\n  font-size: 28px; font-weight: 600; line-height: 1.15;\n  letter-spacing: -0.02em; margin: 0 0 6px;\n}\n.tl-card-text .doc {\n  font-family: 'Source Serif Pro', Georgia, serif;\n  font-style: italic; font-size: 15px; color: var(--sub); margin-bottom: 14px;\n}\n.tl-card-text p {\n  margin: 0; font-size: 14px; line-height: 1.6; color: var(--sub);\n  text-wrap: pretty;\n}\n.tl-card-text .meta {\n  display: flex; flex-wrap: wrap; gap: 8px;\n  margin-top: 18px;\n}\n\n/* visual card – different per phase */\n.tl-card-visual {\n  min-height: 260px;\n  position: relative; overflow: hidden;\n  display: flex; flex-direction: column;\n}\n.tl-card-visual .top {\n  display: flex; align-items: center; gap: 10px;\n  padding: 14px 18px;\n  border-bottom: 1px solid var(--line);\n}\n.tl-card-visual .top .traffic {\n  display: inline-flex; gap: 5px;\n}\n.tl-card-visual .top .traffic span {\n  width: 8px; height: 8px; border-radius: 999px; background: #D6D3CC;\n}\n.tl-card-visual .top .url {\n  font-size: 11px; color: var(--mute); font-family: 'JetBrains Mono', monospace;\n}\n\n/* phase tinting */\n.phase-1 .num.solid { background: var(--p-start); border-color: var(--p-start); }\n.phase-1 .phase-label { color: var(--p-start); }\n.phase-1 .tl-card-visual { background: var(--p-start-soft); }\n\n.phase-2 .num.solid { background: var(--p-build); border-color: var(--p-build); }\n.phase-2 .phase-label { color: var(--p-build); }\n.phase-2 .tl-card-visual { background: var(--p-build-soft); }\n\n.phase-3 .num.solid { background: var(--p-rec); border-color: var(--p-rec); }\n.phase-3 .phase-label { color: var(--p-rec); }\n.phase-3 .tl-card-visual { background: var(--p-rec-soft); }\n\n.phase-4 .num.solid { background: var(--p-set); border-color: var(--p-set); }\n.phase-4 .phase-label { color: var(--p-set); }\n.phase-4 .tl-card-visual { background: var(--p-set-soft); }\n\n.phase-5 .num.solid { background: var(--p-fin); border-color: var(--p-fin); }\n.phase-5 .phase-label { color: var(--p-fin); }\n.phase-5 .tl-card-visual { background: var(--p-fin-soft); }\n\n/* visuals */\n.viz {\n  flex: 1;\n  padding: 22px 22px 24px;\n  display: flex; flex-direction: column; gap: 10px;\n  font-size: 12.5px;\n}\n\n/* phase 1 — sparse questions list */\n.viz-q-row {\n  display: flex; align-items: center; gap: 10px;\n  padding: 9px 12px; background: rgba(255,255,255,0.66);\n  border-radius: 10px; border: 1px solid rgba(0,0,0,0.04);\n}\n.viz-q-row .qn { width: 22px; color: var(--mute); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 11px; }\n.viz-q-row .qx { flex: 1; color: var(--ink); }\n.viz-q-row .qa { color: var(--mute); font-size: 11.5px; }\n.viz-q-row.is-current { background: #fff; border-color: var(--ink); box-shadow: 0 1px 0 rgba(0,0,0,0.04); }\n.viz-q-row.is-current .qa { color: var(--ink); font-weight: 500; }\n\n/* phase 2 — picture: net-worth ledger lines */\n.viz-led {\n  display: grid; grid-template-columns: 1fr auto; gap: 6px 10px;\n  background: rgba(255,255,255,0.66); border-radius: 10px;\n  padding: 12px 14px; border: 1px solid rgba(0,0,0,0.04);\n}\n.viz-led .led-row { display: contents; }\n.viz-led .lab { font-size: 12px; color: var(--sub); padding: 4px 0; }\n.viz-led .val { font-size: 12.5px; color: var(--ink); font-variant-numeric: tabular-nums; padding: 4px 0; font-weight: 500; }\n.viz-led .total .lab { font-weight: 600; color: var(--ink); padding-top: 8px; border-top: 1px solid var(--line); margin-top: 4px; }\n.viz-led .total .val { font-weight: 700; padding-top: 8px; border-top: 1px solid var(--line); margin-top: 4px; }\n\n/* phase 3 — reconcile diff card */\n.viz-diff {\n  background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;\n}\n.viz-diff .diff-head {\n  padding: 10px 12px; border-bottom: 1px solid var(--line);\n  display: flex; align-items: center; justify-content: space-between;\n  font-size: 11px; color: var(--mute); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600;\n}\n.viz-diff .diff-body { display: grid; grid-template-columns: 1fr 1fr; }\n.viz-diff .side { padding: 12px 14px; }\n.viz-diff .side + .side { border-left: 1px solid var(--line); }\n.viz-diff .side .who { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); font-weight: 600; }\n.viz-diff .side .num { font-family: 'Source Serif Pro', serif; font-size: 22px; font-weight: 600; margin-top: 4px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }\n.viz-diff .side .src { font-size: 11.5px; color: var(--sub); margin-top: 2px; }\n.viz-diff .gap {\n  display: flex; justify-content: center; padding: 8px;\n  background: var(--p-rec-soft); border-top: 1px solid var(--line);\n  font-size: 11.5px; color: var(--p-rec); font-weight: 600;\n}\n\n/* phase 4 — settle redline */\n.viz-doc {\n  background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;\n  font-family: 'Source Serif Pro', serif; font-size: 13.5px; line-height: 1.6; color: var(--ink);\n}\n.viz-doc .stk { background: #FEE2E2; color: #7F1D1D; text-decoration: line-through; padding: 0 3px; border-radius: 3px; }\n.viz-doc .add { background: #DCFCE7; color: #065F46; padding: 0 3px; border-radius: 3px; }\n.viz-doc .ai-note {\n  margin-top: 12px; padding: 10px 12px;\n  background: #EEF2FF; border-radius: 8px;\n  font-family: Inter; font-size: 12px; color: #4338CA; line-height: 1.5;\n}\n.viz-doc .ai-note .ai-tag {\n  font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; margin-right: 6px;\n}\n\n/* phase 5 — finalise documents */\n.viz-pkg {\n  background: #fff; border: 1px solid var(--line); border-radius: 10px;\n  padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;\n}\n.viz-pkg .pkg-row {\n  display: flex; align-items: center; gap: 10px; font-size: 12.5px;\n}\n.viz-pkg .pkg-row .ic {\n  width: 28px; height: 36px; flex-shrink: 0; background: var(--p-fin-soft);\n  border: 1px solid var(--line); border-radius: 4px; position: relative;\n}\n.viz-pkg .pkg-row .ic::after {\n  content: \"\"; position: absolute; top: 6px; right: -1px; width: 8px; height: 8px;\n  border-left: 1px solid var(--line); border-bottom: 1px solid var(--line);\n  background: var(--p-fin-soft);\n  transform: skewY(-45deg); transform-origin: right top;\n}\n.viz-pkg .pkg-row .meta-block { display: flex; flex-direction: column; }\n.viz-pkg .pkg-row .name { font-weight: 500; color: var(--ink); }\n.viz-pkg .pkg-row .sub  { font-size: 11px; color: var(--mute); margin-top: 1px; }\n.viz-pkg .pkg-row .check {\n  margin-left: auto; width: 18px; height: 18px; border-radius: 999px;\n  background: var(--p-fin); color: #fff;\n  display: flex; align-items: center; justify-content: center;\n  font-size: 10.5px; font-weight: 700;\n}\n\n/* tour line */\n.tour {\n  margin: 80px 0 0;\n  padding: 36px 40px;\n  background: linear-gradient(180deg, #FAFAF7 0%, #F0EDE2 100%);\n  border: 1px solid var(--line);\n  border-radius: 18px;\n  display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: center;\n}\n.tour h3 {\n  font-family: 'Source Serif Pro', serif;\n  font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2;\n  margin: 0;\n}\n.tour p { margin: 8px 0 0; color: var(--sub); font-size: 14.5px; line-height: 1.5; max-width: 540px; }\n.tour-cta {\n  display: flex; gap: 10px;\n}\n\n</style>\n</head>\n<body>\n\n<a class=\"skip\" href=\"#main\">Skip to content</a>\n\n<header class=\"mk-header\">\n  <a class=\"mk-wordmark\" href=\"#\">\n    <span class=\"mk-glyph\"></span>\n    <span>decouple</span>\n  </a>\n  <nav class=\"mk-nav\" aria-label=\"Primary\">\n    <a href=\"#\">The picture</a>\n    <a href=\"#\" class=\"is-active\">How it works</a>\n    <a href=\"Desktop · Pricing.html\">Pricing</a>\n    <a href=\"Desktop · FAQ + Trust.html\">Trust &amp; FAQ</a>\n  </nav>\n  <div class=\"spacer\"></div>\n  <a class=\"mk-cta-secondary\" href=\"Desktop · Sign in.html\">Sign in</a>\n  <a class=\"mk-cta-primary\" href=\"#\"><span>Start free</span><span class=\"arr\">→</span></a>\n</header>\n\n<main id=\"main\" class=\"mk-page\">\n\n  <section class=\"hw-hero\">\n    <div class=\"mk-wrap\">\n      <span class=\"mk-eyebrow\">How Decouple works</span>\n      <h1 class=\"mk-h1\">\n        From a first question to a court-sealed agreement <span class=\"it\">in five clear phases.</span>\n      </h1>\n      <p class=\"mk-lede\">\n        One workspace, four documents, the whole separation handled together. Free up to your AI plan\n        in phase 1. You only pay if you choose to keep going — and even then, all-in for under £1,000.\n      </p>\n      <div class=\"meta\">\n        <span>~3 minutes to your first plan</span>\n        <span class=\"dot\"></span>\n        <span>Bank connection via TrueLayer · read-only</span>\n        <span class=\"dot\"></span>\n        <span>Cancel any time</span>\n      </div>\n    </div>\n  </section>\n\n  <div class=\"mk-wrap\">\n    <div class=\"tl\" aria-label=\"Five-phase journey\">\n\n      <\!-- 1. START -->\n      <div class=\"tl-row phase-1\">\n        <article class=\"tl-card tl-card-text\">\n          <div class=\"head\">\n            <span class=\"phase-label\">Phase 1 · Start</span>\n            <span class=\"chip\"><span class=\"dot\" style=\"background: var(--p-start);\"></span>Free</span>\n          </div>\n          <h3>A 3-minute orientation that gives you a real plan.</h3>\n          <div class=\"doc\">Document · Free orientation</div>\n          <p>\n            Eight questions. We ask about children, housing, work, and what you want to protect.\n            By the end you have an AI-drafted plan covering likely costs, who needs to do what,\n            and your two or three biggest risks — yours to keep, whether you continue with us or not.\n          </p>\n          <div class=\"meta\">\n            <span class=\"chip\">22 questions max</span>\n            <span class=\"chip\">No account needed</span>\n            <span class=\"chip\">Save &amp; resume anytime</span>\n          </div>\n        </article>\n        <div class=\"tl-marker\"><div class=\"num solid\">1</div></div>\n        <div class=\"tl-card tl-card-visual\">\n          <div class=\"top\">\n            <span class=\"traffic\"><span></span><span></span><span></span></span>\n            <span class=\"url\">decouple.uk/orientation</span>\n          </div>\n          <div class=\"viz\">\n            <div class=\"viz-q-row\"><span class=\"qn\">17</span><span class=\"qx\">Do you own your home?</span><span class=\"qa\">Joint mortgage</span></div>\n            <div class=\"viz-q-row\"><span class=\"qn\">18</span><span class=\"qx\">Children at home?</span><span class=\"qa\">2 · ages 8, 11</span></div>\n            <div class=\"viz-q-row is-current\"><span class=\"qn\">19</span><span class=\"qx\">Is this Aviva direct debit joint cover?</span><span class=\"qa\">Answering…</span></div>\n            <div class=\"viz-q-row\"><span class=\"qn\">20</span><span class=\"qx\">Pension provider</span><span class=\"qa\">— pending</span></div>\n            <div class=\"viz-q-row\"><span class=\"qn\">21</span><span class=\"qx\">Maintenance plans</span><span class=\"qa\">— pending</span></div>\n          </div>\n        </div>\n      </div>\n\n      <\!-- 2. BUILD -->\n      <div class=\"tl-row phase-2\">\n        <article class=\"tl-card tl-card-text\">\n          <div class=\"head\">\n            <span class=\"phase-label\">Phase 2 · Build</span>\n            <span class=\"chip\"><span class=\"dot\" style=\"background: var(--p-build);\"></span>Private</span>\n          </div>\n          <h3>Connect once. We surface the picture you'd otherwise build by hand.</h3>\n          <div class=\"doc\">Document · Sarah's Picture</div>\n          <p>\n            Connect bank accounts via TrueLayer (read-only — we can't move money) and we\n            categorise transactions, find recurring outgoings, and request CETVs from your pension\n            providers. You confirm what we found, fill 3–4 gaps, and end up with a complete\n            disclosure-ready picture. Mark sees nothing yet.\n          </p>\n          <div class=\"meta\">\n            <span class=\"chip\">FCA-regulated TrueLayer</span>\n            <span class=\"chip\">Read-only access</span>\n            <span class=\"chip\">2,400+ UK banks</span>\n          </div>\n        </article>\n        <div class=\"tl-marker\"><div class=\"num solid\">2</div></div>\n        <div class=\"tl-card tl-card-visual\">\n          <div class=\"top\">\n            <span class=\"traffic\"><span></span><span></span><span></span></span>\n            <span class=\"url\">your-picture · private to you</span>\n          </div>\n          <div class=\"viz\">\n            <div class=\"viz-led\">\n              <div class=\"led-row\"><span class=\"lab\">Family home (estimated)</span><span class=\"val\">£510,000</span></div>\n              <div class=\"led-row\"><span class=\"lab\">Pensions · NHS + Aviva</span><span class=\"val\">£148,200</span></div>\n              <div class=\"led-row\"><span class=\"lab\">Joint savings</span><span class=\"val\">£24,610</span></div>\n              <div class=\"led-row\"><span class=\"lab\">Personal savings</span><span class=\"val\">£18,400</span></div>\n              <div class=\"led-row\"><span class=\"lab\">Mortgage outstanding</span><span class=\"val\">−£312,440</span></div>\n              <div class=\"led-row total\"><span class=\"lab\">Net position · your view</span><span class=\"val\">£388,770</span></div>\n            </div>\n          </div>\n        </div>\n      </div>\n\n      <\!-- 3. RECONCILE -->\n      <div class=\"tl-row phase-3\">\n        <article class=\"tl-card tl-card-text\">\n          <div class=\"head\">\n            <span class=\"phase-label\">Phase 3 · Reconcile</span>\n            <span class=\"chip\"><span class=\"dot\" style=\"background: var(--p-rec);\"></span>Together</span>\n          </div>\n          <h3>Invite Mark. Compare side by side. Resolve one thing at a time.</h3>\n          <div class=\"doc\">Document · Our Household Picture</div>\n          <p>\n            Both of you see the same itemised picture, with disagreements flagged. Each contested\n            line gets its own card — request evidence, propose a midpoint, escalate to a joint\n            valuation. The AI coach explains what courts typically expect. Most couples resolve\n            agreed lines first, then chip away at the contested few.\n          </p>\n          <div class=\"meta\">\n            <span class=\"chip\">Bilateral disclosure</span>\n            <span class=\"chip\">Audit log of every change</span>\n            <span class=\"chip\">Mediator-friendly export</span>\n          </div>\n        </article>\n        <div class=\"tl-marker\"><div class=\"num solid\">3</div></div>\n        <div class=\"tl-card tl-card-visual\">\n          <div class=\"top\">\n            <span class=\"traffic\"><span></span><span></span><span></span></span>\n            <span class=\"url\">our-picture · contested · 1 of 5</span>\n          </div>\n          <div class=\"viz\">\n            <div class=\"viz-diff\">\n              <div class=\"diff-head\">\n                <span>Family home — Crouch End</span>\n                <span style=\"color: var(--p-rec);\">● Contested</span>\n              </div>\n              <div class=\"diff-body\">\n                <div class=\"side\">\n                  <div class=\"who\">Sarah said</div>\n                  <div class=\"num\">£510,000</div>\n                  <div class=\"src\">Foxtons + Winkworth avg</div>\n                </div>\n                <div class=\"side\">\n                  <div class=\"who\">Mark said</div>\n                  <div class=\"num\">£485,000</div>\n                  <div class=\"src\">Hamptons single quote</div>\n                </div>\n              </div>\n              <div class=\"gap\">£25,000 apart · midpoint £497,500</div>\n            </div>\n          </div>\n        </div>\n      </div>\n\n      <\!-- 4. SETTLE -->\n      <div class=\"tl-row phase-4\">\n        <article class=\"tl-card tl-card-text\">\n          <div class=\"head\">\n            <span class=\"phase-label\">Phase 4 · Settle</span>\n            <span class=\"chip\"><span class=\"dot\" style=\"background: var(--p-set);\"></span>Drafting</span>\n          </div>\n          <h3>Build the proposal in plain English. AI checks fairness, not just maths.</h3>\n          <div class=\"doc\">Document · The Settlement Proposal</div>\n          <p>\n            Five sections: home, pensions, savings, income, future-proofing. Draft together, redline\n            each other, accept clause-by-clause. The AI coach flags court-risky language, suggests\n            tested wording, and shows where past judges have queried similar proposals — all\n            grounded in CFR / Resolution guidance.\n          </p>\n          <div class=\"meta\">\n            <span class=\"chip\">Section-by-section signoff</span>\n            <span class=\"chip\">Mark explanations from MCA 1973 §25</span>\n            <span class=\"chip\">Counter-propose without restarting</span>\n          </div>\n        </article>\n        <div class=\"tl-marker\"><div class=\"num solid\">4</div></div>\n        <div class=\"tl-card tl-card-visual\">\n          <div class=\"top\">\n            <span class=\"traffic\"><span></span><span></span><span></span></span>\n            <span class=\"url\">settlement · §1 · the home</span>\n          </div>\n          <div class=\"viz\">\n            <div class=\"viz-doc\">\n              The property shall be sold within\n              <span class=\"stk\">6 months</span><span class=\"add\">9 months</span>\n              of the order, with proceeds split <strong>55 / 45</strong> in Sarah's favour.\n              <div class=\"ai-note\">\n                <span class=\"ai-tag\">◇ AI · strategy</span>\n                9 months is reasonable for school-age children. 55/45 split needs a sentence in D81 §10 — try referencing primary residence and earning capacity.\n              </div>\n            </div>\n          </div>\n        </div>\n      </div>\n\n      <\!-- 5. FINALISE -->\n      <div class=\"tl-row phase-5\">\n        <article class=\"tl-card tl-card-text\">\n          <div class=\"head\">\n            <span class=\"phase-label\">Phase 5 · Finalise</span>\n            <span class=\"chip\"><span class=\"dot\" style=\"background: var(--p-fin);\"></span>Court-ready</span>\n          </div>\n          <h3>Court-ready package. Submit yourself, or hand it to a solicitor.</h3>\n          <div class=\"doc\">Document · Consent order &amp; D81</div>\n          <p>\n            From your settlement we generate the consent order, Form D81, pension annex, and any\n            FPR-required statements. We pre-flight against common judicial queries and tell you\n            exactly which sections to strengthen. Submit direct via the portal or export the bundle\n            for your solicitor — your choice.\n          </p>\n          <div class=\"meta\">\n            <span class=\"chip\">Auto-generated D81 + Form A</span>\n            <span class=\"chip\">Submit via HMCTS portal</span>\n            <span class=\"chip\">Solicitor handover ready</span>\n          </div>\n        </article>\n        <div class=\"tl-marker\"><div class=\"num solid\">5</div></div>\n        <div class=\"tl-card tl-card-visual\">\n          <div class=\"top\">\n            <span class=\"traffic\"><span></span><span></span><span></span></span>\n            <span class=\"url\">finalise · package · 4 of 5 ready</span>\n          </div>\n          <div class=\"viz\">\n            <div class=\"viz-pkg\">\n              <div class=\"pkg-row\"><div class=\"ic\"></div>\n                <div class=\"meta-block\"><span class=\"name\">Consent order</span><span class=\"sub\">draft v3 · auto-filled from settlement</span></div>\n                <span class=\"check\">✓</span>\n              </div>\n              <div class=\"pkg-row\"><div class=\"ic\"></div>\n                <div class=\"meta-block\"><span class=\"name\">Form D81 — financial summary</span><span class=\"sub\">§10 reasoning · 1 advisory</span></div>\n                <span class=\"check\" style=\"background: #B45309;\">!</span>\n              </div>\n              <div class=\"pkg-row\"><div class=\"ic\"></div>\n                <div class=\"meta-block\"><span class=\"name\">Pension annex (NHS + Aviva)</span><span class=\"sub\">CETV figures · attached</span></div>\n                <span class=\"check\">✓</span>\n              </div>\n              <div class=\"pkg-row\"><div class=\"ic\"></div>\n                <div class=\"meta-block\"><span class=\"name\">Statement of information</span><span class=\"sub\">both parties signed · today</span></div>\n                <span class=\"check\">✓</span>\n              </div>\n            </div>\n          </div>\n        </div>\n      </div>\n\n    </div>\n\n    <\!-- Closing CTA -->\n    <div class=\"tour\">\n      <div>\n        <h3>You can walk the whole journey before paying anything.</h3>\n        <p>The first three minutes give you a plan you can keep. The rest is yours to use only when you've decided this is the path you want.</p>\n      </div>\n      <div class=\"tour-cta\">\n        <a class=\"btn-primary\" href=\"#\">Start your free plan <span>→</span></a>\n        <a class=\"btn-secondary\" href=\"Desktop · Pricing.html\">See pricing</a>\n      </div>\n    </div>\n  </div>\n\n  <footer class=\"mk-footer\">\n    <div class=\"mk-footer-inner\">\n      <div>\n        <a class=\"mk-wordmark\" href=\"#\"><span class=\"mk-glyph\"></span><span>decouple</span></a>\n        <p class=\"lede\" style=\"margin-top: 16px;\">\n          The complete settlement workspace for separating couples. Built with mediators,\n          family lawyers, and the people who've been through it.\n        </p>\n      </div>\n      <div>\n        <h4>Product</h4>\n        <ul>\n          <li><a href=\"Desktop · How it works.html\">How it works</a></li>\n          <li><a href=\"Desktop · Pricing.html\">Pricing</a></li>\n          <li><a href=\"Desktop · FAQ + Trust.html\">Trust &amp; safety</a></li>\n          <li><a href=\"#\">For solicitors</a></li>\n          <li><a href=\"#\">For mediators</a></li>\n        </ul>\n      </div>\n      <div>\n        <h4>Help</h4>\n        <ul>\n          <li><a href=\"Desktop · FAQ + Trust.html\">FAQ</a></li>\n          <li><a href=\"#\">Book a 15-minute call</a></li>\n          <li><a href=\"#\">Help centre</a></li>\n          <li><a href=\"#\">Contact</a></li>\n        </ul>\n      </div>\n      <div>\n        <h4>Company</h4>\n        <ul>\n          <li><a href=\"#\">About</a></li>\n          <li><a href=\"#\">Privacy</a></li>\n          <li><a href=\"#\">Terms</a></li>\n          <li><a href=\"#\">Security</a></li>\n        </ul>\n      </div>\n    </div>\n    <div class=\"mk-footer-inner\">\n      <div class=\"legal\" style=\"grid-column: 1 / -1;\">\n        <div>© 2026 Decouple Ltd. Registered in England and Wales · Company No. 14872019.</div>\n        <div>Decouple is not a law firm. We provide tools and document generation; we don't give legal advice.</div>\n      </div>\n    </div>\n  </footer>\n\n</main>\n\n</body>\n</html>\n","Desktop · Pricing.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"/>\n<meta name=\"viewport\" content=\"width=1440\"/>\n<title>Decouple — Pricing</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"/>\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"marketing/marketing.css\"/>\n<style>\n\n.pr-hero { padding: 80px 0 24px; }\n.pr-hero .ledger {\n  display: grid; grid-template-columns: 1fr auto; gap: 4px;\n  margin-top: 28px; max-width: 540px;\n  font-size: 15px;\n}\n.pr-hero .ledger .lab { padding: 10px 0; color: var(--sub); border-bottom: 1px dashed var(--line); }\n.pr-hero .ledger .val { padding: 10px 0; color: var(--ink); border-bottom: 1px dashed var(--line);\n  font-variant-numeric: tabular-nums; font-weight: 500; text-align: right;\n  font-family: 'Source Serif Pro', serif; font-size: 17px;\n}\n.pr-hero .ledger .total .lab { font-weight: 700; padding-top: 14px; border-bottom: none; }\n.pr-hero .ledger .total .val { font-weight: 700; padding-top: 14px; border-bottom: none; font-size: 22px; }\n.pr-hero .ledger .strike { text-decoration: line-through; color: var(--mute); font-style: italic; }\n.pr-hero .ledger .ann { font-size: 11.5px; color: var(--mute); }\n\n/* tier grid */\n.tiers { padding: 56px 0 32px; }\n.tier-grid {\n  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px;\n}\n.tier {\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: 18px;\n  padding: 28px 28px 26px;\n  display: flex; flex-direction: column;\n  position: relative;\n}\n.tier.is-featured {\n  border-color: var(--ink);\n  box-shadow: 0 12px 30px rgba(26,26,26,0.10), 0 2px 6px rgba(26,26,26,0.05);\n}\n.tier .ribbon {\n  position: absolute; top: -12px; left: 24px;\n  background: var(--ink); color: #fff;\n  font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700;\n  padding: 5px 12px; border-radius: 999px;\n}\n.tier .name {\n  font-family: 'Source Serif Pro', serif;\n  font-size: 22px; font-weight: 600; letter-spacing: -0.01em;\n}\n.tier .for { font-size: 13px; color: var(--mute); margin-top: 4px; }\n.tier .price-row {\n  display: flex; align-items: baseline; gap: 6px;\n  margin-top: 22px;\n}\n.tier .price {\n  font-family: 'Source Serif Pro', serif;\n  font-size: 48px; font-weight: 600; letter-spacing: -0.025em; color: var(--ink);\n  line-height: 1;\n}\n.tier .per { font-size: 13.5px; color: var(--sub); }\n.tier .cents { font-size: 18px; color: var(--mute); }\n.tier .desc {\n  margin-top: 14px; font-size: 13.5px; color: var(--sub); line-height: 1.5;\n  text-wrap: pretty;\n}\n.tier ul {\n  list-style: none; padding: 0; margin: 22px 0 24px;\n  display: flex; flex-direction: column; gap: 10px;\n}\n.tier li {\n  display: flex; align-items: flex-start; gap: 10px;\n  font-size: 13.5px; color: var(--ink); line-height: 1.4;\n}\n.tier li .tick {\n  width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px;\n  border-radius: 999px; background: var(--warm);\n  display: flex; align-items: center; justify-content: center;\n  color: var(--ink); font-size: 9.5px; font-weight: 700;\n}\n.tier.is-featured li .tick { background: var(--ink); color: #fff; }\n.tier li .lim { color: var(--mute); }\n\n.tier .cta { margin-top: auto; }\n.tier .cta a {\n  display: inline-flex; align-items: center; justify-content: center; gap: 8px;\n  width: 100%; padding: 13px 18px; border-radius: 12px;\n  font-size: 14px; font-weight: 500; text-decoration: none;\n  transition: transform 160ms, box-shadow 160ms, background 160ms;\n}\n.tier:not(.is-featured) .cta a {\n  background: var(--panel); color: var(--ink); border: 1px solid var(--line);\n}\n.tier:not(.is-featured) .cta a:hover { background: var(--warm); }\n.tier.is-featured .cta a {\n  background: var(--ink); color: #fff;\n}\n.tier.is-featured .cta a:hover {\n  transform: translateY(-1px); box-shadow: 0 10px 26px rgba(26,26,26,0.18);\n}\n\n/* compare table */\n.cmp-section { padding: 80px 0 40px; }\n.cmp-section .cmp-head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 24px; }\n\n.cmp-table {\n  width: 100%;\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: 14px;\n  border-collapse: separate;\n  border-spacing: 0;\n  overflow: hidden;\n}\n.cmp-table th, .cmp-table td {\n  padding: 16px 22px;\n  text-align: left;\n  border-bottom: 1px solid var(--line);\n  vertical-align: top;\n  font-size: 13.5px;\n}\n.cmp-table thead th {\n  background: var(--canvas);\n  font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;\n  color: var(--mute);\n}\n.cmp-table thead th.tier-h { color: var(--ink); font-size: 14px; letter-spacing: -0.01em; text-transform: none; font-family: 'Source Serif Pro', serif; }\n.cmp-table thead th.is-featured { background: #1A1A1A; color: #fff; }\n.cmp-table .row-head {\n  background: var(--canvas);\n}\n.cmp-table .row-head td {\n  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--mute);\n  padding-top: 22px; padding-bottom: 10px;\n}\n.cmp-table tbody tr:last-child td { border-bottom: none; }\n.cmp-table .feat { color: var(--ink); font-weight: 500; }\n.cmp-table .feat .sub { display: block; color: var(--mute); font-weight: 400; margin-top: 3px; font-size: 12px; line-height: 1.4; }\n.cmp-table .ck   { color: var(--ink); font-weight: 600; }\n.cmp-table .nck  { color: var(--soft); }\n.cmp-table .col-feat { background: #FAFAF7; color: var(--ink); font-weight: 600; }\n.cmp-table .feat-yes::before { content: \"●\"; color: var(--ink); margin-right: 8px; font-size: 9px; vertical-align: 2px; }\n.cmp-table .feat-no::before  { content: \"—\"; color: var(--soft); margin-right: 6px; }\n.cmp-table .feat-partial::before { content: \"◐\"; color: var(--p-build); margin-right: 8px; font-size: 11px; vertical-align: 1px; }\n\n/* honest band */\n.honest {\n  margin: 64px 0 0;\n  padding: 32px 36px;\n  background: var(--canvas);\n  border: 1px solid var(--line);\n  border-radius: 16px;\n  display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 36px;\n}\n.honest h4 {\n  font-family: 'Source Serif Pro', serif; font-size: 22px; font-weight: 600;\n  letter-spacing: -0.01em; margin: 0 0 8px;\n}\n.honest p { font-size: 13.5px; color: var(--sub); line-height: 1.55; margin: 0; }\n.honest .item {\n  border-left: 1px solid var(--line); padding-left: 24px;\n}\n\n/* benchmarks */\n.bench {\n  margin-top: 40px;\n  padding: 22px 28px;\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: 14px;\n  display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: center;\n}\n.bench .lab { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); font-weight: 700; }\n.bench-bars { display: flex; flex-direction: column; gap: 14px; }\n.bench-bar { display: grid; grid-template-columns: 200px 1fr 100px; align-items: center; gap: 16px; font-size: 13.5px; }\n.bench-bar .name { color: var(--ink); font-weight: 500; }\n.bench-bar .name span { color: var(--mute); font-weight: 400; font-size: 12px; }\n.bench-bar .track { height: 8px; background: var(--warm); border-radius: 999px; overflow: hidden; position: relative; }\n.bench-bar .fill { height: 100%; border-radius: 999px; }\n.bench-bar .num  { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); text-align: right; }\n.bench-bar.us .fill   { background: var(--ink);   }\n.bench-bar.med .f
