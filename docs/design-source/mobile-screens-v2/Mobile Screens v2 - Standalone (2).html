const DCCtx = React.createContext(null);

// ─────────────────────────────────────────────────────────────
// DesignCanvas — stateful wrapper around the pan/zoom viewport.
// Owns runtime state (per-section order, renamed titles/labels, focused
// artboard). Order/titles/labels persist to a .design-canvas.state.json
// sidecar next to the HTML. Reads go via plain fetch() so the saved
// arrangement is visible anywhere the HTML + sidecar are served together
// (omelette preview, direct link, downloaded zip). Writes go through the
// host's window.omelette bridge — editing requires the omelette runtime.
// Focus is ephemeral.
// ─────────────────────────────────────────────────────────────
const DC_STATE_FILE = '.design-canvas.state.json';

function DesignCanvas({ children, minScale, maxScale, style }) {
  const [state, setState] = React.useState({ sections: {}, focus: null });
  // Hold rendering until the sidecar read settles so the saved order/titles
  // appear on first paint (no source-order flash). didRead gates writes until
  // the read settles so the empty initial state can't clobber a slow read;
  // skipNextWrite suppresses the one echo-write that would otherwise follow
  // hydration.
  const [ready, setReady] = React.useState(false);
  const didRead = React.useRef(false);
  const skipNextWrite = React.useRef(false);

  React.useEffect(() => {
    let off = false;
    fetch('./' + DC_STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((saved) => {
        if (off || !saved || !saved.sections) return;
        skipNextWrite.current = true;
        setState((s) => ({ ...s, sections: saved.sections }));
      })
      .catch(() => {})
      .finally(() => { didRead.current = true; if (!off) setReady(true); });
    const t = setTimeout(() => { if (!off) setReady(true); }, 150);
    return () => { off = true; clearTimeout(t); };
  }, []);

  React.useEffect(() => {
    if (!didRead.current) return;
    if (skipNextWrite.current) { skipNextWrite.current = false; return; }
    const t = setTimeout(() => {
      window.omelette?.writeFile(DC_STATE_FILE, JSON.stringify({ sections: state.sections })).catch(() => {});
    }, 250);
    return () => clearTimeout(t);
  }, [state.sections]);

  // Build registries synchronously from children so FocusOverlay can read
  // them in the same render. Only direct DCSection > DCArtboard children are
  // walked — wrapping them in other elements opts out of focus/reorder.
  const registry = {};     // slotId -> { sectionId, artboard }
  const sectionMeta = {};  // sectionId -> { title, subtitle, slotIds[] }
  const sectionOrder = [];
  React.Children.forEach(children, (sec) => {
    if (!sec || sec.type !== DCSection) return;
    const sid = sec.props.id ?? sec.props.title;
    if (!sid) return;
    sectionOrder.push(sid);
    const persisted = state.sections[sid] || {};
    const srcIds = [];
    React.Children.forEach(sec.props.children, (ab) => {
      if (!ab || ab.type !== DCArtboard) return;
      const aid = ab.props.id ?? ab.props.label;
      if (!aid) return;
      registry[`${sid}/${aid}`] = { sectionId: sid, artboard: ab };
      srcIds.push(aid);
    });
    const kept = (persisted.order || []).filter((k) => srcIds.includes(k));
    sectionMeta[sid] = {
      title: persisted.title ?? sec.props.title,
      subtitle: sec.props.subtitle,
      slotIds: [...kept, ...srcIds.filter((k) => !kept.includes(k))],
    };
  });

  const api = React.useMemo(() => ({
    state,
    section: (id) => state.sections[id] || {},
    patchSection: (id, p) => setState((s) => ({
      ...s,
      sections: { ...s.sections, [id]: { ...s.sections[id], ...(typeof p === 'function' ? p(s.sections[id] || {}) : p) } },

      document.removeEventListener('keydown', onKey);
      document.removeEventListener('pointerdown', onPd, true);
    };
  }, [api]);

  return (
    <DCCtx.Provider value={api}>
      <DCViewport minScale={minScale} maxScale={maxScale} style={style}>{ready && children}</DCViewport>
      {state.focus && registry[state.focus] && (
        <DCFocusOverlay entry={registry[state.focus]} sectionMeta={sectionMeta} sectionOrder={sectionOrder} />
      )}
    </DCCtx.Provider>

// ─────────────────────────────────────────────────────────────
// DCViewport — transform-based pan/zoom (internal)
//
// Input mapping (Figma-style):
//   • trackpad pinch  → zoom   (ctrlKey wheel; Safari gesture* events)
//   • trackpad scroll → pan    (two-finger)
//   • mouse wheel     → zoom   (notched; distinguished from trackpad scroll)
//   • middle-drag / primary-drag-on-bg → pan
//
// Transform state lives in a ref and is written straight to the DOM
// (translate3d + will-change) so wheel ticks don't go through React —
// keeps pans at 60fps on dense canvases.
// ─────────────────────────────────────────────────────────────
function DCViewport({ children, minScale = 0.1, maxScale = 8, style = {} }) {
  const vpRef = React.useRef(null);
  const worldRef = React.useRef(null);
  const tf = React.useRef({ x: 0, y: 0, scale: 1 });

  const apply = React.useCallback(() => {
    const { x, y, scale } = tf.current;
    const el = worldRef.current;
    if (el) el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
  }, []);

  React.useEffect(() => {
    const vp = vpRef.current;
    if (!vp) return;

    const zoomAt = (cx, cy, factor) => {
      const r = vp.getBoundingClientRect();
      const px = cx - r.left, py = cy - r.top;
      const t = tf.current;
      const next = Math.min(maxScale, Math.max(minScale, t.scale * factor));
      const k = next / t.scale;
      // keep the world point under the cursor fixed
      t.x = px - (px - t.x) * k;
      t.y = py - (py - t.y) * k;
      t.scale = next;
      apply();
    };

    // Mouse-wheel vs trackpad-scroll heuristic. A physical wheel sends
    // line-mode deltas (Firefox) or large integer pixel deltas with no X
    // component (Chrome/Safari, typically multiples of 100/120). Trackpad
    // two-finger scroll sends small/fractional pixel deltas, often with
    // non-zero deltaX. ctrlKey is set by the browser for trackpad pinch.
    const isMouseWheel = (e) =>
      e.deltaMode !== 0 ||
      (e.deltaX === 0 && Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 40);

    const onWheel = (e) => {
      e.preventDefault();
      if (isGesturing) return; // Safari: gesture* owns the pinch — discard concurrent wheels
      if (e.ctrlKey) {
        // trackpad pinch (or explicit ctrl+wheel)
        zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
      } else if (isMouseWheel(e)) {
        // notched mouse wheel — fixed-ratio step per click
        zoomAt(e.clientX, e.clientY, Math.exp(-Math.sign(e.deltaY) * 0.18));
      } else {
        // trackpad two-finger scroll — pan
        tf.current.x -= e.deltaX;
        tf.current.y -= e.deltaY;
        apply();
      }
    };

    // Safari sends native gesture* events for trackpad pinch with a smooth
    // e.scale; preferring these over the ctrl+wheel fallback gives a much
    // better feel there. No-ops on other browsers. Safari also fires
    // ctrlKey wheel events during the same pinch — isGesturing makes
    // onWheel drop those entirely so they neither zoom nor pan.
    let gsBase = 1;
    let isGesturing = false;
    const onGestureStart = (e) => { e.preventDefault(); isGesturing = true; gsBase = tf.current.scale; };
    const onGestureChange = (e) => {
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, (gsBase * e.scale) / tf.current.scale);
    };
    const onGestureEnd = (e) => { e.preventDefault(); isGesturing = false; };

    // Drag-pan: middle button anywhere, or primary button on canvas
    // background (anything that isn't an artboard or an inline editor).
    let drag = null;
    const onPointerDown = (e) => {
      const onBg = !e.target.closest('[data-dc-slot], .dc-editable');
      if (!(e.button === 1 || (e.button === 0 && onBg))) return;
      e.preventDefault();
      vp.setPointerCapture(e.pointerId);
      drag = { id: e.pointerId, lx: e.clientX, ly: e.clientY };
      vp.style.cursor = 'grabbing';
    };
    const onPointerMove = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      tf.current.x += e.clientX - drag.lx;
      tf.current.y += e.clientY - drag.ly;
      drag.lx = e.clientX; drag.ly = e.clientY;
      apply();
    };
    const onPointerUp = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      vp.releasePointerCapture(e.pointerId);
      drag = null;
      vp.style.cursor = '';
    };

    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('gesturestart', onGestureStart, { passive: false });
    vp.addEventListener('gesturechange', onGestureChange, { passive: false });
    vp.addEventListener('gestureend', onGestureEnd, { passive: false });
    vp.addEventListener('pointerdown', onPointerDown);
    vp.addEventListener('pointermove', onPointerMove);
    vp.addEventListener('pointerup', onPointerUp);
    vp.addEventListener('pointercancel', onPointerUp);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('gesturestart', onGestureStart);
      vp.removeEventListener('gesturechange', onGestureChange);
      vp.removeEventListener('gestureend', onGestureEnd);
      vp.removeEventListener('pointerdown', onPointerDown);
      vp.removeEventListener('pointermove', onPointerMove);
      vp.removeEventListener('pointerup', onPointerUp);
      vp.removeEventListener('pointercancel', onPointerUp);
    };
  }, [apply, minScale, maxScale]);

  const gridSvg = `url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='${encodeURIComponent(DC.grid)}' stroke-width='1'/%3E%3C/svg%3E")`;
  return (
    <div
      ref={vpRef}
      className="design-canvas"
      style={{
        height: '100vh', width: '100vw',
        background: DC.bg,
        overflow: 'hidden',
        overscrollBehavior: 'none',
        touchAction: 'none',
        position: 'relative',
        fontFamily: DC.font,
        boxSizing: 'border-box',
        ...style,
      }}
    >
      <div
        ref={worldRef}
        style={{
          position: 'absolute', top: 0, left: 0,
          transformOrigin: '0 0',
          willChange: 'transform',
          width: 'max-content', minWidth: '100%',
          minHeight: '100%',
          padding: '60px 0 80px',
        }}
      >
        <div style={{ position: 'absolute', inset: -6000, backgroundImage: gridSvg, backgroundSize: '120px 120px', pointerEvents: 'none', zIndex: -1 }} />
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// DCSection — editable title + h-row of artboards in persisted order
// ─────────────────────────────────────────────────────────────
function DCSection({ id, title, subtitle, children, gap = 48 }) {
  const ctx = React.useContext(DCCtx);
  const sid = id ?? title;
  const all = React.Children.toArray(children);

  const rest = all.filter((c) => !(c && c.type === DCArtboard));

  const sec = (ctx && sid && ctx.section(sid)) || {};

  const order = React.useMemo(() => {
    const kept = (sec.order || []).filter((k) => srcOrder.includes(k));
    return [...kept, ...srcOrder.filter((k) => !kept.includes(k))];
  }, [sec.order, srcOrder.join('|')]);

  const byId = Object.fromEntries(artboards.map((a) => [a.props.id ?? a.props.label, a]));

  return (
    <div data-dc-section={sid} style={{ marginBottom: 80, position: 'relative' }}>
      <div style={{ padding: '0 60px 56px' }}>
        <DCEditable tag="div" value={sec.title ?? title}
          onChange={(v) => ctx && sid && ctx.patchSection(sid, { title: v })}
          style={{ fontSize: 28, fontWeight: 600, color: DC.title, letterSpacing: -0.4, marginBottom: 6, display: 'inline-block' }} />
        {subtitle && <div style={{ fontSize: 16, color: DC.subtitle }}>{subtitle}</div>}
      </div>
      <div style={{ display: 'flex', gap, padding: '0 60px', alignItems: 'flex-start', width: 'max-content' }}>
        {order.map((k) => (
          <DCArtboardFrame key={k} sectionId={sid} artboard={byId[k]} order={order}
            label={(sec.labels || {})[k] ?? byId[k].props.label}
            onRename={(v) => ctx && ctx.patchSection(sid, (x) => ({ labels: { ...x.labels, [k]: v } }))}
            onReorder={(next) => ctx && ctx.patchSection(sid, { order: next })}
            onFocus={() => ctx && ctx.setFocus(`${sid}/${k}`)} />
        ))}
      </div>
      {rest}
    </div>
  );
}

// DCArtboard — marker; rendered by DCArtboardFrame via DCSection.
function DCArtboard() { return null; }

function DCArtboardFrame({ sectionId, artboard, label, order, onRename, onReorder, onFocus }) {
  const { id: rawId, label: rawLabel, width = 260, height = 480, children, style = {} } = artboard.props;
  const id = rawId ?? rawLabel;
  const ref = React.useRef(null);

  // Live drag-reorder: dragged card sticks to cursor; siblings slide into
  // their would-be slots in real time via transforms. DOM order only
  // changes on drop.
  const onGripDown = (e) => {
    e.preventDefault(); e.stopPropagation();
    const me = ref.current;
    // translateX is applied in local (pre-scale) space but pointer deltas and
    // getBoundingClientRect().left are screen-space — divide by the viewport's
    // current scale so the dragged card tracks the cursor at any zoom level.
    const scale = me.getBoundingClientRect().width / me.offsetWidth || 1;
    const peers = Array.from(document.querySelectorAll(`[data-dc-section="${sectionId}"] [data-dc-slot]`));
    const homes = peers.map((el) => ({ el, id: el.dataset.dcSlot, x: el.getBoundingClientRect().left }));
    const slotXs = homes.map((h) => h.x);
    const startIdx = order.indexOf(id);
    const startX = e.clientX;
    let liveOrder = order.slice();
    me.classList.add('dc-dragging');

    const layout = () => {
      for (const h of homes) {
        if (h.id === id) continue;
        const slot = liveOrder.indexOf(h.id);
        h.el.style.transform = `translateX(${(slotXs[slot] - h.x) / scale}px)`;
      }
    };

    const move = (ev) => {
      const dx = ev.clientX - startX;
      me.style.transform = `translateX(${dx / scale}px)`;
      const cur = homes[startIdx].x + dx;
      let nearest = 0, best = Infinity;
      for (let i = 0; i < slotXs.length; i++) {
        const d = Math.abs(slotXs[i] - cur);
        if (d < best) { best = d; nearest = i; }
      }
      if (liveOrder.indexOf(id) !== nearest) {
        liveOrder = order.filter((k) => k !== id);
        liveOrder.splice(nearest, 0, id);
        layout();
      }
    };

    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      const finalSlot = liveOrder.indexOf(id);
      me.classList.remove('dc-dragging');
      me.style.transform = `translateX(${(slotXs[finalSlot] - homes[startIdx].x) / scale}px)`;
      // After the settle transition, kill transitions + clear transforms +
      // commit the reorder in the same frame so there's no visual snap-back.
      setTimeout(() => {
        for (const h of homes) { h.el.style.transition = 'none'; h.el.style.transform = ''; }
        if (liveOrder.join('|') !== order.join('|')) onReorder(liveOrder);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          for (const h of homes) h.el.style.transition = '';
        }));
      }, 180);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  };

  return (
    <div ref={ref} data-dc-slot={id} style={{ position: 'relative', flexShrink: 0 }}>
      <div className="dc-labelrow" style={{ position: 'absolute', bottom: '100%', left: -4, marginBottom: 4, color: DC.label }}>
        <div className="dc-grip" onPointerDown={onGripDown} title="Drag to reorder">
          <svg width="9" height="13" viewBox="0 0 9 13" fill="currentColor"><circle cx="2" cy="2" r="1.1"/><circle cx="7" cy="2" r="1.1"/><circle cx="2" cy="6.5" r="1.1"/><circle cx="7" cy="6.5" r="1.1"/><circle cx="2" cy="11" r="1.1"/><circle cx="7" cy="11" r="1.1"/></svg>
        </div>
        <div className="dc-labeltext" onClick={onFocus} title="Click to focus">
          <DCEditable value={label} onChange={onRename} onClick={(e) => e.stopPropagation()}
            style={{ fontSize: 15, fontWeight: 500, color: DC.label, lineHeight: 1 }} />
        </div>
      </div>
      <button className="dc-expand" onClick={onFocus} onPointerDown={(e) => e.stopPropagation()} title="Focus">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 1h4v4M5 11H1V7M11 1L7.5 4.5M1 11l3.5-3.5"/></svg>
      </button>
      <div className="dc-card"
        style={{ borderRadius: 2, boxShadow: '0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06)', overflow: 'hidden', width, height, background: '#fff', ...style }}>
        {children || <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#bbb', fontSize: 13, fontFamily: DC.font }}>{id}</div>}
      </div>
    </div>
  );
}

// Inline rename — commits on blur or Enter.
function DCEditable({ value, onChange, style, tag = 'span', onClick }) {
  const T = tag;
  return (
    <T className="dc-editable" contentEditable suppressContentEditableWarning
      onClick={onClick}
      onPointerDown={(e) => e.stopPropagation()}
      onBlur={(e) => onChange && onChange(e.currentTarget.textContent)}
      onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); } }}
      style={style}>{value}</T>
  );
}

// ─────────────────────────────────────────────────────────────
// Focus mode — overlay one artboard; ←/→ within section, ↑/↓ across
// sections, Esc or backdrop click to exit.
// ─────────────────────────────────────────────────────────────
function DCFocusOverlay({ entry, sectionMeta, sectionOrder }) {
  const ctx = React.useContext(DCCtx);
  const { sectionId, artboard } = entry;
  const sec = ctx.section(sectionId);
  const meta = sectionMeta[sectionId];
  const peers = meta.slotIds;
  const aid = artboard.props.id ?? artboard.props.label;
  const idx = peers.indexOf(aid);
  const secIdx = sectionOrder.indexOf(sectionId);

  const go = (d) => { const n = peers[(idx + d + peers.length) % peers.length]; if (n) ctx.setFocus(`${sectionId}/${n}`); };
  const goSection = (d) => {
    const ns = sectionOrder[(secIdx + d + sectionOrder.length) % sectionOrder.length];
    const first = sectionMeta[ns] && sectionMeta[ns].slotIds[0];
    if (first) ctx.setFocus(`${ns}/${first}`);
  };

  React.useEffect(() => {
    const k = (e) => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
      if (e.key === 'ArrowUp') { e.preventDefault(); goSection(-1); }
      if (e.key === 'ArrowDown') { e.preventDefault(); goSection(1); }
    };
    document.addEventListener('keydown', k);
    return () => document.removeEventListener('keydown', k);
  });

  const { width = 260, height = 480, children } = artboard.props;
  const [vp, setVp] = React.useState({ w: window.innerWidth, h: window.innerHeight });
  React.useEffect(() => { const r = () => setVp({ w: window.innerWidth, h: window.innerHeight }); window.addEventListener('resize', r); return () => window.removeEventListener('resize', r); }, []);
  const scale = Math.max(0.1, Math.min((vp.w - 200) / width, (vp.h - 260) / height, 2));

  const [ddOpen, setDd] = React.useState(false);
  const Arrow = ({ dir, onClick }) => (
    <button onClick={(e) => { e.stopPropagation(); onClick(); }}
      style={{ position: 'absolute', top: '50%', [dir]: 28, transform: 'translateY(-50%)',
        border: 'none', background: 'rgba(255,255,255,.08)', color: 'rgba(255,255,255,.9)',
        width: 44, height: 44, borderRadius: 22, fontSize: 18, cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background .15s' }}
      onMouseEnter={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.18)')}
      onMouseLeave={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.08)')}>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
        <path d={dir === 'left' ? 'M11 3L5 9l6 6' : 'M7 3l6 6-6 6'} /></svg>
    </button>
  );

  // Portal to body so position:fixed is the real viewport regardless of any
  // transform on DesignCanvas's ancestors (including the canvas zoom itself).
  return ReactDOM.createPortal(
    <div onClick={() => ctx.setFocus(null)}
      onWheel={(e) => e.preventDefault()}
      style={{ position: 'fixed', inset: 0, zIndex: 100, background: 'rgba(24,20,16,.6)', backdropFilter: 'blur(14px)',
        fontFamily: DC.font, color: '#fff' }}>

      {/* top bar: section dropdown (left) · close (right) */}
      <div onClick={(e) => e.stopPropagation()}
        style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 72, display: 'flex', alignItems: 'flex-start', padding: '16px 20px 0', gap: 16 }}>
        <div style={{ position: 'relative' }}>
          <button onClick={() => setDd((o) => !o)}
            style={{ border: 'none', background: 'transparent', color: '#fff', cursor: 'pointer', padding: '6px 8px',
              borderRadius: 6, textAlign: 'left', fontFamily: 'inherit' }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 18, fontWeight: 600, letterSpacing: -0.3 }}>{meta.title}</span>
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" style={{ opacity: .7 }}><path d="M2 4l3.5 3.5L9 4"/></svg>
            </span>
            {meta.subtitle && <span style={{ display: 'block', fontSize: 13, opacity: .6, fontWeight: 400, marginTop: 2 }}>{meta.subtitle}</span>}
          </button>
          {ddOpen && (
            <div style={{ position: 'absolute', top: '100%', left: 0, marginTop: 4, background: '#2a251f', borderRadius: 8,
              boxShadow: '0 8px 32px rgba(0,0,0,.4)', padding: 4, minWidth: 200, zIndex: 10 }}>
              {sectionOrder.map((sid) => (
                <button key={sid} onClick={() => { setDd(false); const f = sectionMeta[sid].slotIds[0]; if (f) ctx.setFocus(`${sid}/${f}`); }}
                  style={{ display: 'block', width: '100%', textAlign: 'left', border: 'none', cursor: 'pointer',
                    background: sid === sectionId ? 'rgba(255,255,255,.1)' : 'transparent', color: '#fff',
                    padding: '8px 12px', borderRadius: 5, fontSize: 14, fontWeight: sid === sectionId ? 600 : 400, fontFamily: 'inherit' }}>
                  {sectionMeta[sid].title}
                </button>
              ))}
            </div>
          )}
        </div>
        <div style={{ flex: 1 }} />
        <button onClick={() => ctx.setFocus(null)}
          onMouseEnter={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.12)')}
          onMouseLeave={(e) => (e.currentTarget.style.background = 'transparent')}
          style={{ border: 'none', background: 'transparent', color: 'rgba(255,255,255,.7)', width: 32, height: 32,
            borderRadius: 16, fontSize: 20, cursor: 'pointer', lineHeight: 1, transition: 'background .12s' }}>×</button>
      </div>

      {/* card centered, label + index below — only the card itself stops
          propagation so any backdrop click (including the margins around
          the card) exits focus */}
      <div
        style={{ position: 'absolute', top: 64, bottom: 56, left: 100, right: 100, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 16 }}>
        <div onClick={(e) => e.stopPropagation()} style={{ width: width * scale, height: height * scale, position: 'relative' }}>
          <div style={{ width, height, transform: `scale(${scale})`, transformOrigin: 'top left', background: '#fff', borderRadius: 2, overflow: 'hidden',
            boxShadow: '0 20px 80px rgba(0,0,0,.4)' }}>
            {children || <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#bbb' }}>{aid}</div>}
          </div>
        </div>
        <div onClick={(e) => e.stopPropagation()} style={{ fontSize: 14, fontWeight: 500, opacity: .85, textAlign: 'center' }}>
          {(sec.labels || {})[aid] ?? artboard.props.label}
          <span style={{ opacity: .5, marginLeft: 10, fontVariantNumeric: 'tabular-nums' }}>{idx + 1} / {peers.length}</span>
        </div>
      </div>

      <Arrow dir="left" onClick={() => go(-1)} />
      <Arrow dir="right" onClick={() => go(1)} />

      {/* dots */}
      <div onClick={(e) => e.stopPropagation()}
        style={{ position: 'absolute', bottom: 20, left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: 8 }}>
        {peers.map((p, i) => (
          <button key={p} onClick={() => ctx.setFocus(`${sectionId}/${p}`)}
            style={{ border: 'none', padding: 0, cursor: 'pointer', width: 6, height: 6, borderRadius: 3,
              background: i === idx ? '#fff' : 'rgba(255,255,255,.3)' }} />
        ))}
      </div>
    </div>,
    document.body,
  );
}

// ─────────────────────────────────────────────────────────────
// Post-it — absolute-positioned sticky note
// ─────────────────────────────────────────────────────────────
function DCPostIt({ children, top, left, right, bottom, rotate = -2, width = 180 }) {
  return (
    <div style={{
      position: 'absolute', top, left, right, bottom, width,
      background: DC.postitBg, padding: '14px 16px',
      fontFamily: '"Comic Sans MS", "Marker Felt", "Segoe Print", cursive',
      fontSize: 14, lineHeight: 1.4, color: DC.postitText,
      boxShadow: '0 2px 8px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08)',
      transform: `rotate(${rotate}deg)`,
      zIndex: 5,
    }}>{children}</div>
  );
}

Object.assign(window, { DesignCanvas, DCSection, DCArtboard, DCPostIt });


</script>

<script type="text/babel" data-presets="react" data-src="mobile/ai-desktop-style.jsx">
/* =========================================================================
   Decouple — Mobile AI in DESKTOP visual style
   Purple brand (#6D5BD0 / #F5F3FF), amber/red ONLY for severity dots.
   Combined A+B pattern:
     - Always-visible margin card under each item it relates to
     - Header: kind label + severity dot + connection chip
     - Expandable reasoning + citation
     - (optional) tappable fallback options
     - Footer: tap-to-open Comments / Activity inline (collapsible)
     - Comments support AI-on-comment analysis (purple sub-card)
   Loaded after screens-base, used by screens-v2.
   ========================================================================= */

/* shared tokens — match desktop ai_rail.jsx */
const D_INK = "#1A1A1A";
const D_SUB = "#5F6368";
const D_MUTE = "#9AA0A6";
const D_LINE = "#EAECEF";
const D_HAIR = "#EEEBE2";
const D_PAPER = "#FFFFFF";
const D_WARM = "#FAFAF7";
const D_BG = "#F5F5F4";
const D_ACCENT = "#2F6D5F";

/* AI brand — desktop palette */
const AI_PURPLE = "#6D5BD0";
const AI_PURPLE_DEEP = "#4C3FB8";
const AI_PURPLE_TINT = "#F5F3FF";
const AI_PURPLE_EDGE = "#E4DEFD";

/* severity */
const SEV_WARN = "#B91C1C";
const SEV_WARN_TINT = "#FFF5F5";
const SEV_WARN_EDGE = "#FCA5A5";
const SEV_NOTICE = "#B45309";
const SEV_NOTICE_TINT = "#FFFBEB";
const SEV_NOTICE_EDGE = "#F9D89D";
const SEV_INFO = "#059669";

const SARAH_C = "#2F6D5F";
const MARK_C = "#7C3AED";

/* ---- atoms ---- */
const LabelXS = ({ children, color = D_MUTE }) => (
  <span style={{ fontSize: 9.5, letterSpacing: "0.1em", textTransform: "uppercase", fontWeight: 700, color, whiteSpace: "nowrap" }}>{children}</span>
);

const SparkGlyph = ({ size = 11, color = "#fff" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6" />
  </svg>
);

const AIBadge = ({ size = 18 }) => (
  <span style={{
    width: size, height: size, borderRadius: 999, background: AI_PURPLE,
    display: "inline-flex", alignItems: "center", justifyContent: "center", flexShrink: 0
  }}>
    <SparkGlyph size={size * 0.55} color="#fff" />
  </span>
);

const SeverityDot = ({ severity = "info" }) => {
  const c = severity === "warn" ? SEV_WARN : severity === "notice" ? SEV_NOTICE : SEV_INFO;
  return <span style={{ width: 6, height: 6, borderRadius: 999, background: c, flexShrink: 0 }} />;
};

const KindMap = {
  court_risk: "Court reasonableness",
  fairness: "Fairness check",
  fallback: "Fallback position",
  comment_analysis: "On this comment",
  tip: "Coaching",
  disclosure: "Disclosure tip",
  strategy: "Strategy",
  chase: "Chase recommendation",
  d81: "D81 advisory"
};

/* ============================================================
   AIMarginCard — the canonical mobile AI card.
   Sits under the thing it relates to. Always-visible.
   Props:
     kind: one of KindMap keys
     severity: "info" | "notice" | "warn"
     title: short headline
     body: reasoning paragraph
     citation: e.g. "MCA 1973 §25"
     relatedTo: { label, onJump } — the connection chip
     fallbacks: [{label, sub, onApply}]
     comments: [{who:"S"|"M"|"AI", time, text, aiAnalysis?}]
     activity: [{time, who, title, sub?}]
     defaultOpenReasoning: bool
   ============================================================ */
const AIMarginCard = ({
  kind = "tip", severity = "info", title, body, citation,
  relatedTo, fallbacks = [], comments = [], activity = [],
  defaultOpenReasoning = false
}) => {
  const [openR, setOpenR] = React.useState(defaultOpenReasoning);
  const [openF, setOpenF] = React.useState(false);
  const [tab, setTab] = React.useState(null); // null | "comments" | "activity"

  const sevBorder = severity === "warn" ? SEV_WARN_EDGE : severity === "notice" ? SEV_NOTICE_EDGE : AI_PURPLE_EDGE;
  const sevTint = severity === "warn" ? SEV_WARN_TINT : severity === "notice" ? SEV_NOTICE_TINT : AI_PURPLE_TINT;

  return (
    <div style={{
      background: sevTint, border: `1px solid ${sevBorder}`, borderRadius: 11, overflow: "hidden",
      boxShadow: "0 1px 2px rgba(76,63,184,0.04)"
    }}>
      {/* header */}
      <div style={{ padding: "10px 12px 8px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 6 }}>
          <AIBadge size={18} />
          <LabelXS color={AI_PURPLE_DEEP}>Decouple AI</LabelXS>
          <span style={{ flex: 1 }} />
          <LabelXS color={D_MUTE}>{KindMap[kind] || kind}</LabelXS>
          <SeverityDot severity={severity} />
        </div>
        <div style={{ fontSize: 13, fontWeight: 600, color: D_INK, lineHeight: 1.4, letterSpacing: "-0.005em" }}>
          {title}
        </div>
        {/* connection chip */}
        {relatedTo && (
          <button onClick={relatedTo.onJump} style={{
            marginTop: 6, display: "inline-flex", alignItems: "center", gap: 4,
            padding: "3px 8px 3px 7px", background: "rgba(109,91,208,0.08)",
            border: `1px solid ${AI_PURPLE_EDGE}`, borderRadius: 999,
            fontSize: 10.5, color: AI_PURPLE_DEEP, fontWeight: 600, cursor: "pointer"
          }}>
            <span style={{ fontSize: 9 }}>↳</span> {relatedTo.label}
          </button>
        )}
      </div>

      {/* show reasoning */}
      {(body || citation) && (
        <>
          <button onClick={() => setOpenR(x => !x)} style={{
            width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between",
            padding: "7px 12px", background: "rgba(255,255,255,0.6)", border: "none",
            borderTop: `1px solid ${sevBorder}`, cursor: "pointer", color: D_SUB
          }}>
            <span style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase" }}>
              {openR ? "Hide reasoning" : "Show reasoning"}
            </span>
            <span style={{ fontSize: 9, transform: openR ? "rotate(180deg)" : "none", transition: "transform 180ms" }}>▾</span>
          </button>
          {openR && body && (
            <div style={{
              padding: "9px 12px 11px", background: D_PAPER, borderTop: `1px solid ${sevBorder}`,
              fontSize: 11.5, color: D_SUB, lineHeight: 1.55
            }}>
              {body}
              {citation && (
                <div style={{ marginTop: 8, fontSize: 10, color: D_MUTE, letterSpacing: "0.04em", textTransform: "uppercase", fontWeight: 700 }}>
                  ❡ {citation}
                </div>
              )}
            </div>
          )}
        </>
      )}

      {/* fallbacks */}
      {fallbacks.length > 0 && (
        <>
          <button onClick={() => setOpenF(x => !x)} style={{
            width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between",
            padding: "7px 12px", background: "rgba(255,255,255,0.6)", border: "none",
            borderTop: `1px solid ${sevBorder}`, cursor: "pointer", color: AI_PURPLE_DEEP
          }}>
            <span style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase" }}>
              {openF ? "Hide fallback options" : `Show ${fallbacks.length} fallback options`}
            </span>
            <span style={{ fontSize: 9, transform: openF ? "rotate(180deg)" : "none", transition: "transform 180ms" }}>▾</span>
          </button>
          {openF && (
            <div style={{ padding: "8px 12px 12px", background: D_PAPER, borderTop: `1px solid ${sevBorder}`, display: "flex", flexDirection: "column", gap: 6 }}>
              {fallbacks.map((f, i) => (
                <button key={i} onClick={f.onApply} style={{
                  textAlign: "left", padding: "9px 11px", background: D_WARM,
                  border: `1px solid ${D_HAIR}`, borderRadius: 8, cursor: "pointer",
                  display: "flex", alignItems: "center", gap: 8
                }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 12.5, fontWeight: 600, color: D_INK, letterSpacing: "-0.005em" }}>{f.label}</div>
                    {f.sub && <div style={{ fontSize: 11, color: D_SUB, marginTop: 2, lineHeight: 1.4 }}>{f.sub}</div>}
                  </div>
                  <span style={{ fontSize: 11, color: D_SUB }}>→</span>
                </button>
              ))}
            </div>
          )}
        </>
      )}

      {/* footer counts (Comments / Activity) */}
      {(comments.length > 0 || activity.length > 0) && (
        <div style={{ display: "flex", borderTop: `1px solid ${sevBorder}`, background: "rgba(255,255,255,0.4)" }}>
          <button onClick={() => setTab(tab === "comments" ? null : "comments")} style={{
            flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5,
            padding: "8px 0", background: tab === "comments" ? D_PAPER : "transparent",
            border: "none", cursor: "pointer", color: tab === "comments" ? AI_PURPLE_DEEP : D_SUB,
            fontSize: 11, fontWeight: 600
          }}>
            💬 {comments.length} {comments.length === 1 ? "comment" : "comments"}
          </button>
          <div style={{ width: 1, background: sevBorder }} />
          <button onClick={() => setTab(tab === "activity" ? null : "activity")} style={{
            flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5,
            padding: "8px 0", background: tab === "activity" ? D_PAPER : "transparent",
            border: "none", cursor: "pointer", color: tab === "activity" ? AI_PURPLE_DEEP : D_SUB,
            fontSize: 11, fontWeight: 600
          }}>
            ⏱ {activity.length} events
          </button>
        </div>
      )}

      {tab === "comments" && (
        <div style={{ padding: "10px 12px 12px", background: D_PAPER, borderTop: `1px solid ${sevBorder}`, display: "flex", flexDirection: "column", gap: 9 }}>
          {comments.map((c, i) => (
            <div key={i}>
              <div style={{ display: "flex", gap: 8 }}>
                {c.who === "AI" ? <AIBadge size={20} /> : (
                  <div style={{
                    width: 20, height: 20, borderRadius: 999, flexShrink: 0,
                    background: c.who === "S" ? SARAH_C : MARK_C,
                    color: "#fff", display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: 10, fontWeight: 700
                  }}>{c.who}</div>
                )}
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 11, color: D_MUTE, fontWeight: 500 }}>
                    <span style={{ fontWeight: 700, color: c.who === "AI" ? AI_PURPLE_DEEP : D_INK }}>
                      {c.who === "S" ? "Sarah" : c.who === "M" ? "Mark" : "Decouple AI"}
                    </span>
                    {" · "}{c.time}
                  </div>
                  <div style={{ fontSize: 12.5, color: D_INK, lineHeight: 1.45, marginTop: 2 }}>{c.text}</div>
                  {/* AI-on-comment analysis */}
                  {c.aiAnalysis && (
                    <div style={{

<script type="text/babel" data-presets="react" data-src="mobile/forms.jsx">
/* =========================================================================
   Decouple — Mobile bank-statement reconciliation FORMS
   Six form screens that surface during the "Prepare" phase, when the wizard
   needs the user to resolve something specific about a bank-feed transaction.
   - Categorise a transaction (joint life insurance? salary? household?)
   - Confirm a recurring payment as a fixed expense
   - Manual transaction entry (cash, transfers off-platform)
   - Resolve a duplicate / cross-account transfer
   - Split a transaction (some yours, some joint)
   - Confirm bank balance against statement

   Each one: tight, focused, single primary action, with an AIMarginCard.
   ========================================================================= */

/* shared header */
const FormTop = ({ title, step }) => (
  <TopBar
    left={<><BackArrow/><span style={{fontSize:14,fontWeight:600}}>{title}</span></>}
    right={step ? <span style={{fontSize:11,color:MUTE,letterSpacing:"0.06em",textTransform:"uppercase",fontWeight:600}}>{step}</span> : null}
  />
);

/* the row that anchors every form to a real transaction */
const TxnRow = ({ logo, logoBg, logoColor, merchant, sub, amount, neg=true }) => (
  <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0"}}>
    <div style={{width:32,height:32,borderRadius:8,background:logoBg,color:logoColor,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,flexShrink:0}}>{logo}</div>
    <div style={{flex:1,minWidth:0}}>
      <div style={{fontSize:13.5,fontWeight:600,color:INK,letterSpacing:"-0.005em"}}>{merchant}</div>
      <div style={{fontSize:11,color:MUTE,marginTop:1}}>{sub}</div>
    </div>
    <div style={{fontSize:14,fontWeight:600,color:neg?INK:"#059669",fontVariantNumeric:"tabular-nums",letterSpacing:"-0.01em"}}>
      {neg?"−":"+"}{amount}
    </div>
  </div>
);

const RadioRow = ({ checked, label, sub, recommended }) => (
  <button style={{
    width:"100%",textAlign:"left",padding:"11px 12px",borderRadius:10,
    background:checked?"rgba(109,91,208,0.06)":PAPER,
    border:`1.5px solid ${checked?window.AI_TOK.PURPLE:LINE}`,
    display:"flex",gap:10,alignItems:"flex-start",cursor:"pointer"
  }}>
    <div style={{
      width:18,height:18,borderRadius:999,border:`1.5px solid ${checked?window.AI_TOK.PURPLE:"#CBD5E1"}`,
      background:PAPER,flexShrink:0,marginTop:1,display:"flex",alignItems:"center",justifyContent:"center"
    }}>
      {checked && <span style={{width:9,height:9,borderRadius:999,background:window.AI_TOK.PURPLE}}/>}
    </div>
    <div style={{flex:1,minWidth:0}}>
      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
        <span style={{fontSize:13,fontWeight:600,color:INK}}>{label}</span>
        {recommended && (
          <span style={{
            display:"inline-flex",alignItems:"center",gap:3,padding:"1px 6px",borderRadius:999,
            background:window.AI_TOK.PURPLE_TINT,color:window.AI_TOK.PURPLE_DEEP,
            fontSize:9.5,fontWeight:700,letterSpacing:"0.04em",textTransform:"uppercase"
          }}>
            <window.SparkGlyph size={9} color={window.AI_TOK.PURPLE_DEEP}/> AI suggests
          </span>
        )}
      </div>
      {sub && <div style={{fontSize:11.5,color:SUB,marginTop:3,lineHeight:1.4}}>{sub}</div>}
    </div>
  </button>
);

/* ============================================================
   FORM 1 — Categorise a transaction
   ============================================================ */
window.M_Form_Categorise = function M_Form_Categorise() {
  const [v, setV] = React.useState("joint_life");
  return (
    <div style={{height:"100%",background:BG,display:"flex",flexDirection:"column",overflow:"hidden",fontFamily:"Inter, sans-serif"}}>
      <FormTop title="Categorise" step="Q20 of 22"/>
      <div style={{flex:1,overflow:"auto",padding:"14px 16px 14px",display:"flex",flexDirection:"column",gap:12}}>
        <div style={{background:PAPER,border:`1px solid ${LINE}`,borderRadius:12,padding:"6px 14px"}}>
          <div style={{fontSize:10,letterSpacing:"0.08em",textTransform:"uppercase",fontWeight:700,color:MUTE,marginTop:8}}>From your Halifax joint account</div>
          <TxnRow logo="A" logoBg="#FFE4D6" logoColor="#9A3412"
            merchant="Aviva Life Insurance" sub="DD · monthly · since 2019" amount="£1,250.00"/>
        </div>

        <div>
          <div style={{fontFamily:"'Source Serif Pro', Georgia, serif",fontSize:19,fontWeight:600,letterSpacing:"-0.015em",color:INK,lineHeight:1.25}}>

          </div>
          <div style={{fontSize:12.5,color:SUB,marginTop:4,lineHeight:1.45}}>

        </div>

          <RadioRow checked={v==="joint_life"} onClick={()=>setV("joint_life")}

          <RadioRow checked={v==="my_life"} label="Just my life cover" sub="Single policy in your name only. Stays with you."/>

        <window.AIMarginCard
          kind="tip" severity="info"
          title="Aviva typically bundles life + critical illness for couples with children."
          body="Your DD is £1,250/mo on a joint Halifax account, started 2019 — that's a year after your second child. Pattern fits a family-cover bundle. 'Joint life cover' is the safer answer; you can add a note if it's CI-only."
          citation={null}

          defaultOpenReasoning={true}
        />
      </div>

      <div style={{padding:"10px 16px 12px",background:BG,borderTop:`1px solid ${LINE}`,display:"flex",gap:8}}>
        <button style={{flex:"0 0 auto",padding:"0 14px",height:46,borderRadius:11,background:PAPER,color:INK,border:`1px solid ${LINE}`,fontSize:13,fontWeight:500,cursor:"pointer"}}>Skip</button>
        <button style={{flex:1,height:46,borderRadius:11,background:INK,color:"#fff",border:"none",fontSize:14,fontWeight:600,cursor:"pointer"}}>Save & continue →</button>
      </div>
    </div>
  );
};

/* ============================================================
   FORM 2 — Confirm a recurring payment as a fixed expense
   ============================================================ */

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
            <SectionLabel>Suggested entry</SectionLabel>
            <span style={{fontSize:11,color:window.AI_TOK.PURPLE_DEEP,fontWeight:600,display:"inline-flex",alignItems:"center",gap:4}}>

          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:10}}>
            <div>
              <div style={{fontSize:10,color:MUTE,letterSpacing:"0.06em",textTransform:"uppercase",fontWeight:700}}>Category</div>
              <div style={{fontSize:13,fontWeight:600,color:INK,marginTop:3}}>Utilities · Energy</div>

            <div>

<script type="text/babel" data-presets="react" data-src="mobile/ai-variants.jsx">
/* =========================================================================
   Decouple — Mobile AI integration variations
   3 ways to fold the desktop AI right-rail (AI coach / Comments / Activity)
   into the one-column mobile layout. All variations use the warm amber
   "flag" tone already on mobile — no purple. Fallbacks tucked behind a
   "Show options" tap. Each variation is exported as its own M_*_v[ABC]
   screen so the canvas can show them side-by-side.
   ========================================================================= */

/* shared tokens already declared in screens-base.jsx (loaded first) */
const AI_INK = "#1A1A1A";
const AI_SUB = "#5F6368";
const AI_MUTE = "#9AA0A6";
const AI_LINE = "#EAECEF";
const AI_BG = "#F5F5F4";
const AI_PAPER = "#FFFFFF";
const AI_WARM = "#FAFAF7";
const AI_AMBER = "#B45309";
const AI_AMBER_BG = "#FEF3C7";
const AI_AMBER_EDGE = "#FDE68A";
const AI_AMBER_TINT = "#FFFBEB";
const AI_ACCENT = "#2F6D5F";

/* ---------- shared atoms (re-declared to keep this file standalone-ish) ---------- */
const AIChip = ({children, bg="#F3F4F6", color="#4B5563"}) => (
  <span style={{
    display:"inline-flex",alignItems:"center",gap:5,
    padding:"2px 7px",borderRadius:999,background:bg,color,
    fontSize:9.5,letterSpacing:"0.06em",textTransform:"uppercase",fontWeight:700,whiteSpace:"nowrap"
  }}>{children}</span>
);
const AILabel = ({children, color=AI_MUTE}) => (
  <span style={{fontSize:9.5,letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:700,color}}>{children}</span>
);

/* The diamond glyph used for "AI" everywhere — same as existing amber flags. */
const AIGlyph = ({size=11, color=AI_AMBER}) => (
  <span style={{fontSize:size, color, lineHeight:1, fontWeight:700}}>◇</span>
);

/* =========================================================================
   ============== VARIATION A — "Whisper" (compact inline notes) ============
   - AI shows up as ultra-light italic marginalia attached to specific items.
   - Tap a whisper → expands into reasoning + citation strip in-place.
   - Counts (comments / activity) shown as tiny icons in section headers.
   ========================================================================= */

const Whisper = ({children, onClick, expanded}) => (
  <button onClick={onClick} style={{
    display:"flex", alignItems:"flex-start", gap:6, marginTop:6, padding:"4px 6px",
    background:"transparent", border:"none", textAlign:"left", width:"100%", cursor:"pointer",
    borderLeft:`2px solid ${AI_AMBER_EDGE}`,
    fontFamily:"'Source Serif Pro', Georgia, serif"
  }}>
    <span style={{fontSize:11, color:AI_AMBER, fontWeight:700, marginTop:1, fontFamily:"Inter, sans-serif"}}>AI</span>
    <span style={{flex:1, fontSize:12.5, color:"#78350F", lineHeight:1.45, fontStyle:"italic"}}>{children}</span>
    <span style={{fontSize:10, color:AI_AMBER, marginTop:3}}>{expanded?"▾":"▸"}</span>
  </button>
);

const WhisperReveal = ({body, citation}) => (
  <div style={{
    marginTop:4, padding:"8px 10px 8px 16px", background:AI_AMBER_TINT, borderRadius:6,
    fontSize:11.5, color:"#78350F", lineHeight:1.5
  }}>
    {body}
    {citation && (
      <div style={{marginTop:6, fontSize:10, color:AI_AMBER, letterSpacing:"0.04em", textTransform:"uppercase", fontWeight:700}}>
        ❡ {citation}
      </div>
    )}
  </div>
);

/* Small section header with comments + activity counts */
const SectionMeta = ({comments, activity, onOpenComments, onOpenActivity}) => (
  <div style={{display:"flex", alignItems:"center", gap:10, fontSize:11, color:AI_MUTE}}>
    {comments != null && (
      <button onClick={onOpenComments} style={{display:"inline-flex",gap:4,alignItems:"center",background:"none",border:"none",color:AI_MUTE,cursor:"pointer",padding:0}}>
        <span style={{fontSize:11}}>💬</span>
        <span style={{fontVariantNumeric:"tabular-nums",fontWeight:600}}>{comments}</span>
      </button>
    )}
    {activity != null && (
      <button onClick={onOpenActivity} style={{display:"inline-flex",gap:4,alignItems:"center",background:"none",border:"none",color:AI_MUTE,cursor:"pointer",padding:0}}>
        <span style={{fontSize:11}}>⏱</span>
        <span style={{fontVariantNumeric:"tabular-nums",fontWeight:600}}>{activity}</span>
      </button>
    )}
  </div>
);

/* =========================================================================
   ============= VARIATION B — "Margin card" (canonical card) ===============
   - One amber-edged card per AI moment, placed directly under the thing
     it's commenting on.
   - Header chip: "AI · KIND" + severity dot
   - Body: 1-line title + expandable "Show reasoning"
   - Optional "Show options" reveals fallback chips
   - Footer: micro counts for Comments + Activity, expand inline
   ========================================================================= */

const MarginCard = ({kind="Court risk", severity="notice", title, body, citation,
                     fallbacks, comments=[], activity=[]}) => {
  const [openR, setOpenR] = React.useState(false);
  const [openF, setOpenF] = React.useState(false);
  const [openC, setOpenC] = React.useState(false);
  const [openA, setOpenA] = React.useState(false);
  const sevColor = severity==="warn" ? "#B91C1C" : severity==="notice" ? AI_AMBER : "#059669";
  return (
    <div style={{
      background:AI_AMBER_TINT, border:`1px solid ${AI_AMBER_EDGE}`, borderRadius:11, overflow:"hidden"
    }}>
      <div style={{padding:"10px 12px"}}>
        <div style={{display:"flex", alignItems:"center", gap:6, marginBottom:6}}>
          <AIGlyph size={11}/>
          <AILabel color={AI_AMBER}>AI · {kind}</AILabel>
          <span style={{flex:1}}/>
          <span style={{width:6,height:6,borderRadius:999,background:sevColor}}/>
        </div>
        <div style={{fontSize:13, fontWeight:600, color:"#78350F", lineHeight:1.4, letterSpacing:"-0.01em"}}>{title}</div>
        {body && (
          <button onClick={()=>setOpenR(x=>!x)} style={{
            marginTop:6, background:"none", border:"none", padding:0, color:AI_AMBER,
            fontSize:11, fontWeight:600, letterSpacing:"0.04em", textTransform:"uppercase", cursor:"pointer",
            display:"inline-flex", gap:4, alignItems:"center"
          }}>
            {openR ? "Hide reasoning" : "Show reasoning"} <span style={{fontSize:9}}>{openR?"▾":"▸"}</span>
          </button>
        )}
      </div>
      {openR && body && (
        <div style={{padding:"8px 12px 10px", background:"#FFFEF5", borderTop:`1px solid ${AI_AMBER_EDGE}`,
                     fontSize:12, color:"#78350F", lineHeight:1.5}}>
          {body}
          {citation && (
            <div style={{marginTop:6, fontSize:10, color:AI_AMBER, letterSpacing:"0.04em", textTransform:"uppercase", fontWeight:700}}>
              ❡ {citation}
            </div>
          )}
        </div>
      )}
      {fallbacks && fallbacks.length>0 && (
        <>
          <button onClick={()=>setOpenF(x=>!x)} style={{
            display:"flex", alignItems:"center", justifyContent:"space-between", width:"100%",
            padding:"8px 12px", background:"#FFFEF5", border:"none", borderTop:`1px solid ${AI_AMBER_EDGE}`,
            cursor:"pointer", color:AI_AMBER
          }}>
            <span style={{fontSize:11, fontWeight:700, letterSpacing:"0.04em", textTransform:"uppercase"}}>
              {openF ? "Hide options" : `Show ${fallbacks.length} fallback options`}
            </span>
            <span style={{fontSize:10}}>{openF?"▾":"▸"}</span>
          </button>
          {openF && (
            <div style={{padding:"4px 12px 12px", background:"#FFFEF5", display:"flex", flexDirection:"column", gap:6}}>
              {fallbacks.map((f,i)=>(
                <button key={i} style={{
                  textAlign:"left", padding:"9px 10px", background:AI_PAPER, border:`1px solid ${AI_AMBER_EDGE}`,
                  borderRadius:9, cursor:"pointer"
                }}>
                  <div style={{fontSize:12.5, fontWeight:600, color:AI_INK, letterSpacing:"-0.01em"}}>{f.label}</div>
                  {f.sub && <div style={{fontSize:11, color:AI_SUB, marginTop:2, lineHeight:1.4}}>{f.sub}</div>}
                </button>
              ))}
            </div>
          )}
        </>
      )}
      {/* footer counts */}
      <div style={{
        display:"flex", borderTop:`1px solid ${AI_AMBER_EDGE}`, background:"#FFFDF0"
      }}>
        <button onClick={()=>{setOpenC(x=>!x); setOpenA(false);}} style={{
          flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:5,
          padding:"7px 0", background: openC ? "#FFF5DB" : "transparent", border:"none", cursor:"pointer",
          color: openC ? AI_AMBER : "#78350F", fontSize:11, fontWeight:600
        }}>
          💬 {comments.length} {comments.length===1?"comment":"comments"}
        </button>
        <div style={{width:1, background:AI_AMBER_EDGE}}/>
        <button onClick={()=>{setOpenA(x=>!x); setOpenC(false);}} style={{
          flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:5,
          padding:"7px 0", background: openA ? "#FFF5DB" : "transparent", border:"none", cursor:"pointer",
          color: openA ? AI_AMBER : "#78350F", fontSize:11, fontWeight:600
        }}>
          ⏱ {activity.length} events
        </button>
      </div>
      {openC && (
        <div style={{padding:"8px 12px 10px", background:"#FFFDF0", borderTop:`1px solid ${AI_AMBER_EDGE}`,
                     display:"flex", flexDirection:"column", gap:8}}>
          {comments.map((c,i)=>(
            <div key={i} style={{display:"flex", gap:8}}>
              <div style={{
                width:20, height:20, borderRadius:999, flexShrink:0,
                background: c.who==="S" ? AI_ACCENT : c.who==="M" ? "#7C3AED" : AI_AMBER,
                color:"#fff", display:"flex", alignItems:"center", justifyContent:"center",
                fontSize:10, fontWeight:700
              }}>{c.who}</div>
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize:11, color:AI_MUTE, fontWeight:500}}>
                  {c.who==="S"?"Sarah":c.who==="M"?"Mark":"AI"} · {c.time}
                </div>
                <div style={{fontSize:12, color:AI_INK, lineHeight:1.45, marginTop:1}}>{c.text}</div>
              </div>
            </div>
          ))}
          <div style={{display:"flex", gap:6, marginTop:2}}>
            <input placeholder="Reply…" style={{
              flex:1, padding:"7px 10px", borderRadius:8, border:`1px solid ${AI_LINE}`,
              fontSize:12, background:AI_PAPER, fontFamily:"inherit"
            }}/>
            <button style={{
              padding:"7px 12px", borderRadius:8, background:AI_INK, color:"#fff", border:"none",
              fontSize:11, fontWeight:600
            }}>Post</button>
          </div>
        </div>
      )}
      {openA && (
        <div style={{padding:"8px 12px 10px", background:"#FFFDF0", borderTop:`1px solid ${AI_AMBER_EDGE}`}}>
          <div style={{position:"relative", paddingLeft:14}}>
            <div style={{position:"absolute", left:4, top:4, bottom:4, width:1, background:AI_AMBER_EDGE}}/>
            {activity.map((a,i)=>(
              <div key={i} style={{position:"relative", marginBottom:i<activity.length-1?8:0}}>
                <div style={{position:"absolute", left:-13, top:5, width:7, height:7, borderRadius:999,
                             background:a.who==="S"?AI_ACCENT:a.who==="M"?"#7C3AED":AI_AMBER, border:"1.5px solid #FFFDF0"}}/>
                <div style={{fontSize:10, color:AI_MUTE, letterSpacing:"0.04em", textTransform:"uppercase", fontWeight:600}}>{a.time}</div>
                <div style={{fontSize:12, color:AI_INK, lineHeight:1.4, marginTop:1}}>{a.title}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
};

/* =========================================================================
   ============= VARIATION C — "Folded AI" (full thread accordion) ==========
   - At the bottom of each AI-relevant card, a single strip:
     "AI · 1 flag · 3 comments · 8 events"
   - Tapping it unfolds an in-line accordion holding the FULL three-tab
     experience (AI / Comments / Activity), inside the same column.
   - Pages get longer; nothing is hidden behind a sheet.
   ========================================================================= */

const FoldedAI = ({insights=[], comments=[], activity=[], defaultTab="ai"}) => {
  const [open, setOpen] = React.useState(false);
  const [tab, setTab] = React.useState(defaultTab);
  const flagCount = insights.filter(i=>i.severity!=="info").length;
  return (
    <div style={{borderTop:`1px solid ${AI_AMBER_EDGE}`, background:AI_AMBER_TINT, marginTop:0}}>
      <button onClick={()=>setOpen(o=>!o)} style={{
        width:"100%", padding:"9px 12px", display:"flex", alignItems:"center", gap:10,
        background:"transparent", border:"none", cursor:"pointer", color:"#78350F"
      }}>
        <AIGlyph size={11}/>
        <span style={{fontSize:11, fontWeight:700, letterSpacing:"0.04em", textTransform:"uppercase", color:AI_AMBER}}>AI</span>
        <span style={{fontSize:11.5, color:"#78350F"}}>
          {flagCount} {flagCount===1?"flag":"flags"} · {comments.length} {comments.length===1?"comment":"comments"} · {activity.length} events
        </span>
        <span style={{flex:1}}/>
        <span style={{fontSize:11, color:AI_AMBER}}>{open?"Close ▾":"Open ▸"}</span>
      </button>
      {open && (
        <div style={{borderTop:`1px solid ${AI_AMBER_EDGE}`, background:AI_PAPER}}>
          {/* tabs */}
          <div style={{display:"flex", borderBottom:`1px solid ${AI_LINE}`}}>
            {[
              {id:"ai", label:"AI coach", n: insights.length},
              {id:"comments", label:"Comments", n: comments.length},
              {id:"activity", label:"Activity", n: activity.length}
            ].map(t=>{
              const active = tab===t.id;
              return (
                <button key={t.id} onClick={()=>setTab(t.id)} style={{
                  flex:1, padding:"8px 0", background: active?"#FFF":AI_WARM,
                  color: active?AI_INK:AI_SUB, border:"none",
                  borderBottom: active?`2px solid ${AI_AMBER}`:"2px solid transparent",
                  fontSize:11.5, fontWeight: active?600:500, cursor:"pointer",
                  display:"flex", alignItems:"center", justifyContent:"center", gap:5
                }}>
                  {t.label}
                  <span style={{
                    background: active?AI_AMBER_BG:AI_LINE, color: active?AI_AMBER:AI_MUTE,
                    fontSize:10, padding:"1px 5px", borderRadius:999, fontWeight:700, fontVariantNumeric:"tabular-nums"
                  }}>{t.n}</span>
                </button>
              );
            })}
          </div>
          {tab==="ai" && (
            <div style={{padding:"10px 12px", display:"flex", flexDirection:"column", gap:8}}>
              {insights.map((ins,i)=>(
                <div key={i} style={{
                  background:AI_AMBER_TINT, border:`1px solid ${AI_AMBER_EDGE}`,
                  borderRadius:9, padding:"9px 11px"
                }}>
                  <div style={{display:"flex", alignItems:"center", gap:6, marginBottom:4}}>
                    <AILabel color={AI_AMBER}>{ins.kind}</AILabel>
                    <span style={{flex:1}}/>
                    <span style={{width:5,height:5,borderRadius:999,
                      background: ins.severity==="warn"?"#B91C1C":ins.severity==="notice"?AI_AMBER:"#059669"}}/>
                  </div>
                  <div style={{fontSize:12.5, fontWeight:600, color:"#78350F", lineHeight:1.35}}>{ins.title}</div>
                  <div style={{fontSize:11.5, color:"#78350F", marginTop:4, lineHeight:1.45}}>{ins.body}</div>
                  {ins.citation && (
                    <div style={{marginTop:5, fontSize:10, color:AI_AMBER, letterSpacing:"0.04em", textTransform:"uppercase", fontWeight:700}}>
                      ❡ {ins.citation}
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
          {tab==="comments" && (
            <div style={{padding:"10px 12px", display:"flex", flexDirection:"column", gap:8}}>
              {comments.map((c,i)=>(
                <div key={i} style={{display:"flex", gap:8}}>
                  <div style={{
                    width:22, height:22, borderRadius:999, flexShrink:0,
                    background: c.who==="S"?AI_ACCENT:c.who==="M"?"#7C3AED":AI_AMBER,
                    color:"#fff", display:"flex", alignItems:"center", justifyContent:"center",
                    fontSize:10, fontWeight:700
                  }}>{c.who}</div>
                  <div style={{flex:1, minWidth:0}}>
                    <div style={{fontSize:11, color:AI_MUTE, fontWeight:500}}>
                      {c.who==="S"?"Sarah":c.who==="M"?"Mark":"Decouple AI"} · {c.time}
                    </div>
                    <div style={{fontSize:12.5, color:AI_INK, lineHeight:1.45, marginTop:2}}>{c.text}</div>
                  </div>
                </div>
              ))}
              <div style={{display:"flex", gap:6, marginTop:4}}>
                <input placeholder="Add a comment…" style={{
                  flex:1, padding:"8px 10px", borderRadius:8, border:`1px solid ${AI_LINE}`,
                  fontSize:12, fontFamily:"inherit", background:AI_WARM
                }}/>
                <button style={{
                  padding:"8px 12px", borderRadius:8, background:AI_INK, color:"#fff", border:"none",
                  fontSize:11.5, fontWeight:600
                }}>Post</button>
              </div>
              <label style={{display:"flex", gap:6, fontSize:11, color:AI_SUB, alignItems:"center"}}>
                <input type="checkbox" style={{accentColor:AI_AMBER}}/> Ask AI to assess first
              </label>
            </div>
          )}
          {tab==="activity" && (
            <div style={{padding:"10px 12px"}}>
              <div style={{position:"relative", paddingLeft:16}}>
                <div style={{position:"absolute", left:5, top:4, bottom:4, width:1, background:AI_LINE}}/>
                {activity.map((a,i)=>(
                  <div key={i} style={{position:"relative", marginBottom:i<activity.length-1?10:0}}>
                    <div style={{position:"absolute", left:-15, top:4, width:9, height:9, borderRadius:999,
                                 background:a.who==="S"?AI_ACCENT:a.who==="M"?"#7C3AED":AI_AMBER,
                                 border:`2px solid ${AI_PAPER}`, boxShadow:`0 0 0 1px ${AI_LINE}`}}/>
                    <div style={{fontSize:10, color:AI_MUTE, letterSpacing:"0.04em", textTransform:"uppercase", fontWeight:600}}>{a.time}</div>
                    <div style={{fontSize:12, color:AI_INK, lineHeight:1.4, marginTop:1}}>{a.title}</div>
                    {a.sub && <div style={{fontSize:11, color:AI_SUB, marginTop:1.5, lineHeight:1.4}}>{a.sub}</div>}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
};

<script type="text/babel" data-presets="react">
const PhoneFrame = window.IOSDevice;
const Canvas = window.DesignCanvas;
const CanvasSection = window.DCSection;
const Artboard = window.DCArtboard;

/* ---------- phone artboard ---------- */
const FRAME_W = 402, FRAME_H = 874, STATUS_PAD = 56, PHONE_PAD = 28;
const PHONE_ART_W = FRAME_W + PHONE_PAD * 2;   // 458
const PHONE_ART_H = FRAME_H + PHONE_PAD * 2;   // 930

function Phone({ children }) {
  return (
    <PhoneFrame width={FRAME_W} height={FRAME_H}>
      <div style={{paddingTop: STATUS_PAD, height:"100%", boxSizing:"border-box"}}>
        <div style={{height: FRAME_H - STATUS_PAD, overflow:"hidden"}}>{children}</div>
      </div>
    </PhoneFrame>
  );
}
function PhoneStage({ children }) {
  return (
    <div style={{
      width: PHONE_ART_W, height: PHONE_ART_H,
      background: "linear-gradient(180deg, #FAFAF7 0%, #F0EEE7 100%)",
      display: "flex", alignItems: "center", justifyContent: "center"
    }}>
      <Phone>{children}</Phone>
    </div>
  );
}

/* ---------- desktop artboard via iframe ---------- */
/* Desktop full-fidelity is 1440x900. Scale to fit a comfortable reading width
   that pairs visually with the 458px phone (which is ~44% the desktop width).
   We use 0.62 scale → 893×558, plus padding for breathing room. */
const DESK_NATIVE_W = 1440, DESK_NATIVE_H = 900;
const DESK_SCALE = 0.62;
const DESK_PAD = 28;
const DESK_INNER_W = DESK_NATIVE_W * DESK_SCALE;   // 892.8
const DESK_INNER_H = DESK_NATIVE_H * DESK_SCALE;   // 558
const DESK_ART_W = Math.round(DESK_INNER_W) + DESK_PAD * 2;  // 949
const DESK_ART_H = Math.round(DESK_INNER_H) + DESK_PAD * 2;  // 614

function DesktopStage({ src, label }) {
  return (
    <div style={{
      width: DESK_ART_W, height: DESK_ART_H,
      background: "linear-gradient(180deg, #FAFAF7 0%, #F0EEE7 100%)",
      display: "flex", alignItems: "center", justifyContent: "center",
      position: "relative"
    }}>
      <div style={{
        width: Math.round(DESK_INNER_W), height: Math.round(DESK_INNER_H),
        borderRadius: 10, overflow: "hidden",
        boxShadow: "0 12px 30px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.06)",
        background: "#fff", border: "1px solid #EAECEF"
      }}>
        <iframe
          srcDoc={window.__DESKTOP_SRCDOC && window.__DESKTOP_SRCDOC[src] ? window.__DESKTOP_SRCDOC[src] : undefined}
          src={window.__DESKTOP_SRCDOC && window.__DESKTOP_SRCDOC[src] ? undefined : src}
          style={{
            width: DESK_NATIVE_W, height: DESK_NATIVE_H,
            border: "none",
            transform: `scale(${DESK_SCALE})`, transformOrigin: "top left",
            display: "block"
          }}
          loading="lazy"
        />
      </div>
      {label && (
        <div style={{
          position: "absolute", left: 12, top: 10,
          fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase",
          fontWeight: 700, color: "#9AA0A6"
        }}>{label}</div>
      )}
    </div>
  );
}

/* placeholder desktop card — for screens we don't have a desktop file yet */
function DesktopPlaceholder({ title, sub, lines = 6 }) {
  return (
    <div style={{
      width: DESK_ART_W, height: DESK_ART_H,
      background: "linear-gradient(180deg, #FAFAF7 0%, #F0EEE7 100%)",
      display: "flex", alignItems: "center", justifyContent: "center"
    }}>
      <div style={{
        width: Math.round(DESK_INNER_W), height: Math.round(DESK_INNER_H),
        borderRadius: 10, background: "#FFFFFF", border: "1px dashed #E4DEFD",
        padding: "32px 36px", boxSizing: "border-box",
        display: "flex", flexDirection: "column", gap: 14
      }}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:24,height:24,borderRadius:999,background:"#6D5BD0",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:12,fontWeight:700}}>D</div>
          <div style={{fontSize:11,letterSpacing:"0.08em",textTransform:"uppercase",fontWeight:700,color:"#9AA0A6"}}>Desktop · placeholder</div>
        </div>
        <div style={{fontFamily:"'Source Serif Pro', Georgia, serif",fontSize:24,fontWeight:600,letterSpacing:"-0.02em",color:"#1A1A1A"}}>{title}</div>
        {sub && <div style={{fontSize:13,color:"#5F6368",lineHeight:1.5}}>{sub}</div>}
        <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:6}}>
          {Array.from({length:lines}).map((_,i)=>(
            <div key={i} style={{height:8,borderRadius:4,background:"#F0EDE2",width:`${85-i*5}%`}}/>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ---------- pair artboard ---------- */
/* Each "row" is two artboards side-by-side at the same logical row.
   Design canvas already lays artboards left-to-right within a section; we just
   keep the order: desktop first (big), phone second (small). */

function App() {
  return (
    <Canvas
      title="Decouple — Mobile · paired with desktop"
      subtitle="Each row: live-rendered desktop on the left, the matched phone view on the right. AI integration uses the desktop's purple brand on both."
    >
      {/* ============ Public ============ */}
      <CanvasSection id="public" title="Public · marketing & onboarding">
        <Artboard id="d-landing" label="01 · Desktop · Marketing landing" width={DESK_ART_W} height={DESK_ART_H}>
          <DesktopStage src="Landing Page.html" label="Landing Page.html"/>
        </Artboard>
        <Artboard id="m-landing" label="01 · Mobile · Marketing landing" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_Landing/></PhoneStage>
        </Artboard>

        <Artboard id="d-how" label="02 · Desktop · How it works" width={DESK_ART_W} height={DESK_ART_H}>
          <DesktopStage src="Desktop · How it works.html" label="Desktop · How it works.html"/>
        </Artboard>
        <Artboard id="m-how" label="02 · Mobile · How it works" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_HowItWorks/></PhoneStage>
        </Artboard>

        <Artboard id="d-pricing" label="03 · Desktop · Pricing" width={DESK_ART_W} height={DESK_ART_H}>
          <DesktopStage src="Desktop · Pricing.html" label="Desktop · Pricing.html"/>
        </Artboard>
        <Artboard id="m-pricing" label="03 · Mobile · Pricing" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_Pricing/></PhoneStage>
        </Artboard>

        <Artboard id="d-faq" label="04 · Desktop · FAQ & Trust" width={DESK_ART_W} height={DESK_ART_H}>
          <DesktopStage src="Desktop · FAQ + Trust.html" label="Desktop · FAQ + Trust.html"/>
        </Artboard>
        <Artboard id="m-faq" label="04 · Mobile · FAQ & Trust" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_FAQ/></PhoneStage>
        </Artboard>

        <Artboard id="d-signin" label="05 · Desktop · Sign-in / Sign-up" width={DESK_ART_W} height={DESK_ART_H}>
          <DesktopStage src="Desktop · Sign in.html" label="Desktop · Sign in.html"/>
        </Artboard>
        <Artboard id="m-signin" label="05 · Mobile · Sign in" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_SignIn/></PhoneStage>
        </Artboard>
        <Artboard id="m-signup" label="05b · Mobile · Sign up" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_SignUp/></PhoneStage>
        </Artboard>
      </CanvasSection>

      {/* ============ Logged-in core ============ */}
      <CanvasSection id="loggedin" title="Logged in · paired flow">
        <Artboard id="d-dash" label="06 · Desktop · Dashboard (Day 7)" width={DESK_ART_W} height={DESK_ART_H}>
          <DesktopStage src="Post-connect Dashboard.html" label="Post-connect Dashboard.html"/>
        </Artboard>
        <Artboard id="m-dash" label="06 · Mobile · Dashboard (Day 7)" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_Dashboard_v2/></PhoneStage>
        </Artboard>

        <Artboard id="d-todos" label="07 · Desktop · To-do panel" width={DESK_ART_W} height={DESK_ART_H}>
          <DesktopStage src="Section To-do Panel.html" label="Section To-do Panel.html"/>
        </Artboard>
        <Artboard id="m-todos" label="07 · Mobile · To-do" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_Todos_v2/></PhoneStage>
        </Artboard>

        <Artboard id="d-picture" label="08 · Desktop · Your Picture" width={DESK_ART_W} height={DESK_ART_H}>
          <DesktopStage src="Your Picture v2.html" label="Your Picture v2.html"/>
        </Artboard>
        <Artboard id="m-picture" label="08 · Mobile · Your Picture · Private" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_YourPicture_v2/></PhoneStage>
        </Artboard>

        <Artboard id="d-reconcile" label="09 · Desktop · Reconciliation" width={DESK_ART_W} height={DESK_ART_H}>
          <DesktopStage src="Reconciliation.html" label="Reconciliation.html"/>
        </Artboard>
        <Artboard id="m-reconcile" label="09 · Mobile · Reconcile · contested" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_Reconcile_v2/></PhoneStage>
        </Artboard>

        <Artboard id="d-redline" label="10 · Desktop · Settlement redline" width={DESK_ART_W} height={DESK_ART_H}>
          <DesktopStage src="Settlement - Redline.html" label="Settlement - Redline.html"/>
        </Artboard>
        <Artboard id="m-redline" label="10 · Mobile · Mark's redline" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_Redline_v2/></PhoneStage>
        </Artboard>

        <Artboard id="d-preflight" label="11 · Desktop · Settlement pre-flight" width={DESK_ART_W} height={DESK_ART_H}>
          <DesktopStage src="Settlement - Pre-flight.html" label="Settlement - Pre-flight.html"/>
        </Artboard>
        <Artboard id="m-preflight" label="11 · Mobile · Pre-flight advisory" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_Preflight_v2/></PhoneStage>
        </Artboard>
      </CanvasSection>

      {/* ============ Bank-statement reconciliation forms ============ */}
      <CanvasSection id="forms" title="Prepare phase · transaction forms (mobile)">
        <Artboard id="m-form-cat" label="12 · Categorise (joint life insurance?)" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_Form_Categorise/></PhoneStage>
        </Artboard>
        <Artboard id="m-form-rec" label="13 · Confirm recurring (Octopus DD)" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_Form_ConfirmRecurring/></PhoneStage>
        </Artboard>
        <Artboard id="m-form-man" label="14 · Manual entry (cash to Mark)" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_Form_ManualEntry/></PhoneStage>
        </Artboard>
        <Artboard id="m-form-dup" label="15 · Resolve duplicate (transfer)" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_Form_Duplicate/></PhoneStage>
        </Artboard>
        <Artboard id="m-form-split" label="16 · Split (John Lewis: gift + coat)" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_Form_Split/></PhoneStage>
        </Artboard>
        <Artboard id="m-form-bal" label="17 · Balance check (vs statement PDF)" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_Form_BalanceCheck/></PhoneStage>
        </Artboard>
      </CanvasSection>

      {/* ============ Reference: kept Variation B ============ */}
      <CanvasSection id="ref-b" title="Reference · old variation B (amber margin card · archived)">
        <Artboard id="m-dash-b" label="ref · Dashboard · variation B" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_Dashboard_vB/></PhoneStage>
        </Artboard>
        <Artboard id="m-reconcile-b" label="ref · Reconcile · variation B" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_Reconcile_vB/></PhoneStage>
        </Artboard>
        <Artboard id="m-redline-b" label="ref · Redline · variation B" width={PHONE_ART_W} height={PHONE_ART_H}>
          <PhoneStage><window.M_Redline_vB/></PhoneStage>
        </Artboard>
      </CanvasSection>
    </Canvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
