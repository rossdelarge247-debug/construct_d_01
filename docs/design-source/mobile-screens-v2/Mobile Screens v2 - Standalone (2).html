<td class=\"feat-yes\">Included</td><td class=\"feat-yes\">Priority · 4h</td></tr>\n        </tbody>\n      </table>\n\n      <\!-- benchmarks -->\n      <div class=\"bench\" aria-label=\"Benchmark comparison\">\n        <div class=\"lab\">Typical UK<br/>cost</div>\n        <div class=\"bench-bars\">\n          <div class=\"bench-bar us\">\n            <div class=\"name\">Decouple Settlement <span>· complete journey</span></div>\n            <div class=\"track\"><div class=\"fill\" style=\"width: 8%;\"></div></div>\n            <div class=\"num\">£800</div>\n          </div>\n          <div class=\"bench-bar med\">\n            <div class=\"name\">Mediation alone <span>· 4 sessions, no order drafting</span></div>\n            <div class=\"track\"><div class=\"fill\"></div></div>\n            <div class=\"num\">£2,800</div>\n          </div>\n          <div class=\"bench-bar sol\">\n            <div class=\"name\">Solicitor route <span>· straightforward, uncontested</span></div>\n            <div class=\"track\"><div class=\"fill\"></div></div>\n            <div class=\"num\">£14,800</div>\n          </div>\n        </div>\n      </div>\n\n      <\!-- honest band -->\n      <div class=\"honest\">\n        <div>\n          <h4>The fine print, up front.</h4>\n          <p>If we can't get you to a sealed order, we refund the Settlement fee in full. We charge nothing in phases 1–3, so you've never paid more than you've decided to pay.</p>\n        </div>\n        <div class=\"item\">\n          <h4>What's not included.</h4>\n          <p>If your case has contested children's matters, financial concealment, or complex trusts, you need a solicitor — we'll tell you that clearly, and refund.</p>\n        </div>\n        <div class=\"item\">\n          <h4>How we make money.</h4>\n          <p>One fixed fee per couple, paid by you. We don't sell data, take referral fees from solicitors, or charge per document. That's why pricing is simple.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <footer class=\"mk-footer\">\n    <div class=\"mk-footer-inner\">\n      <div>\n        <a class=\"mk-wordmark\" href=\"#\"><span class=\"mk-glyph\"></span><span>decouple</span></a>\n        <p class=\"lede\" style=\"margin-top: 16px;\">\n          The complete settlement workspace for separating couples. Built with mediators,\n          family lawyers, and the people who've been through it.\n        </p>\n      </div>\n      <div>\n        <h4>Product</h4>\n        <ul>\n          <li><a href=\"Desktop · How it works.html\">How it works</a></li>\n          <li><a href=\"Desktop · Pricing.html\">Pricing</a></li>\n          <li><a href=\"Desktop · FAQ + Trust.html\">Trust &amp; safety</a></li>\n          <li><a href=\"#\">For solicitors</a></li>\n          <li><a href=\"#\">For mediators</a></li>\n        </ul>\n      </div>\n      <div>\n        <h4>Help</h4>\n        <ul>\n          <li><a href=\"Desktop · FAQ + Trust.html\">FAQ</a></li>\n          <li><a href=\"#\">Book a 15-minute call</a></li>\n          <li><a href=\"#\">Help centre</a></li>\n          <li><a href=\"#\">Contact</a></li>\n        </ul>\n      </div>\n      <div>\n        <h4>Company</h4>\n        <ul>\n          <li><a href=\"#\">About</a></li>\n          <li><a href=\"#\">Privacy</a></li>\n          <li><a href=\"#\">Terms</a></li>\n          <li><a href=\"#\">Security</a></li>\n        </ul>\n      </div>\n    </div>\n    <div class=\"mk-footer-inner\">\n      <div class=\"legal\" style=\"grid-column: 1 / -1;\">\n        <div>© 2026 Decouple Ltd. Registered in England and Wales · Company No. 14872019.</div>\n        <div>Decouple is not a law firm. We provide tools and document generation; we don't give legal advice.</div>\n      </div>\n    </div>\n  </footer>\n\n</main>\n\n</body>\n</html>\n","Desktop · FAQ + Trust.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"/>\n<meta name=\"viewport\" content=\"width=1440\"/>\n<title>Decouple — Trust &amp; FAQ</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"/>\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"marketing/marketing.css\"/>\n<style>\n\n.tr-hero { padding: 80px 0 32px; }\n\n/* trust strip */\n.trust-strip {\n  margin-top: 36px;\n  display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;\n  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;\n  overflow: hidden;\n}\n.trust-cell {\n  padding: 22px 24px;\n  border-right: 1px solid var(--line);\n  display: flex; flex-direction: column; gap: 8px;\n}\n.trust-cell:last-child { border-right: none; }\n.trust-cell .ic {\n  width: 36px; height: 36px; border-radius: 8px;\n  background: var(--warm); border: 1px solid var(--line);\n  display: flex; align-items: center; justify-content: center;\n  font-size: 16px; font-weight: 600;\n  font-family: 'Source Serif Pro', serif;\n  color: var(--ink);\n}\n.trust-cell .ic.fca   { background: var(--p-set-soft); color: var(--p-set); border-color: rgba(3,105,161,0.18); }\n.trust-cell .ic.iso   { background: var(--p-fin-soft); color: var(--p-fin); border-color: rgba(22,101,52,0.18); }\n.trust-cell .ic.uk    { background: var(--p-rec-soft); color: var(--p-rec); border-color: rgba(157,23,77,0.18); }\n.trust-cell .ic.law   { background: var(--p-build-soft); color: var(--p-build); border-color: rgba(67,56,202,0.18); }\n.trust-cell .lab { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--mute); }\n.trust-cell .name { font-family: 'Source Serif Pro', serif; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }\n.trust-cell p { font-size: 12.5px; color: var(--sub); line-height: 1.5; margin: 0; }\n\n/* main FAQ section */\n.faq-section { padding: 64px 0 32px; }\n.faq-grid {\n  display: grid; grid-template-columns: 280px 1fr; gap: 56px;\n  margin-top: 32px;\n  align-items: start;\n}\n.faq-side {\n  position: sticky; top: 96px;\n}\n.faq-side h3 {\n  font-family: 'Source Serif Pro', serif; font-size: 24px; font-weight: 600;\n  letter-spacing: -0.02em; margin: 0 0 18px;\n}\n.faq-side ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }\n.faq-side li button {\n  width: 100%; text-align: left;\n  background: none; border: none; padding: 7px 12px;\n  border-left: 2px solid transparent;\n  font-size: 13.5px; color: var(--sub); cursor: pointer;\n  font-family: inherit;\n}\n.faq-side li button.is-active {\n  color: var(--ink); border-left-color: var(--ink); background: var(--canvas);\n  font-weight: 500;\n}\n.faq-side li button:hover { color: var(--ink); }\n\n.faq-cat-head {\n  font-family: 'Source Serif Pro', serif;\n  font-size: 26px; font-weight: 600; letter-spacing: -0.02em;\n  margin: 0 0 8px; padding-top: 28px;\n}\n.faq-cat-head:first-of-type { padding-top: 0; }\n.faq-cat-sub { color: var(--mute); font-size: 13.5px; margin-bottom: 16px; }\n\n.faq-list {\n  display: flex; flex-direction: column;\n  border-top: 1px solid var(--line);\n}\n.faq-row {\n  border-bottom: 1px solid var(--line);\n  padding: 0;\n}\n.faq-row > summary {\n  cursor: pointer; list-style: none;\n  display: flex; align-items: center; justify-content: space-between; gap: 18px;\n  padding: 22px 4px;\n  font-size: 16px; color: var(--ink); font-weight: 500;\n}\n.faq-row > summary::-webkit-details-marker { display: none; }\n.faq-row > summary .chev {\n  width: 24px; height: 24px; flex-shrink: 0;\n  border: 1px solid var(--line); border-radius: 999px;\n  display: flex; align-items: center; justify-content: center;\n  color: var(--mute); font-size: 14px;\n  transition: transform 240ms ease, background 160ms;\n}\n.faq-row[open] > summary .chev { transform: rotate(45deg); background: var(--ink); color: #fff; border-color: var(--ink); }\n.faq-row .body {\n  padding: 0 4px 22px;\n  font-size: 14.5px; color: var(--sub); line-height: 1.65; max-width: 720px;\n}\n.faq-row .body a { color: var(--ink); border-bottom: 1px solid var(--line); text-decoration: none; }\n.faq-row .body a:hover { border-color: var(--ink); }\n.faq-row .body p { margin: 0 0 12px; }\n.faq-row .body p:last-child { margin: 0; }\n.faq-row .body .footnote {\n  margin-top: 14px; padding: 10px 14px;\n  background: var(--canvas); border: 1px solid var(--line); border-radius: 8px;\n  font-size: 12.5px; color: var(--mute);\n}\n\n/* book a call */\n.cta-band {\n  margin-top: 80px;\n  display: grid; grid-template-columns: 1fr 1fr; gap: 24px;\n}\n.cta-card {\n  padding: 32px 32px 36px;\n  border-radius: 18px;\n  background: var(--panel);\n  border: 1px solid var(--line);\n  display: flex; flex-direction: column; gap: 10px;\n}\n.cta-card.dark { background: var(--ink); color: #fff; border-color: var(--ink); }\n.cta-card.dark p { color: rgba(255,255,255,0.74); }\n.cta-card.dark .btn-primary { background: #fff; color: var(--ink); }\n.cta-card.dark .btn-primary:hover { box-shadow: 0 8px 22px rgba(255,255,255,0.18); }\n.cta-card .lab { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--mute); }\n.cta-card.dark .lab { color: rgba(255,255,255,0.62); }\n.cta-card h3 {\n  font-family: 'Source Serif Pro', serif; font-size: 26px; font-weight: 600;\n  letter-spacing: -0.02em; margin: 4px 0 8px; line-height: 1.15;\n}\n.cta-card p { color: var(--sub); font-size: 14.5px; line-height: 1.5; margin: 0; max-width: 460px; }\n.cta-card .row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }\n.cta-card .meta { display: flex; gap: 14px; margin-top: 14px; font-size: 12.5px; color: var(--mute); }\n.cta-card.dark .meta { color: rgba(255,255,255,0.62); }\n.cta-card .meta .dot { width: 4px; height: 4px; border-radius: 999px; background: currentColor; align-self: center; opacity: 0.6; }\n\n/* press / mentions */\n.press {\n  margin-top: 44px; padding: 28px 32px;\n  background: var(--canvas);\n  border: 1px solid var(--line); border-radius: 14px;\n  display: flex; align-items: center; gap: 36px; flex-wrap: wrap;\n}\n.press .lab {\n  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); font-weight: 700;\n}\n.press .logo {\n  font-family: 'Source Serif Pro', serif; font-size: 17px; font-weight: 600;\n  color: var(--mute); letter-spacing: -0.01em; opacity: 0.85;\n}\n.press .logo.bold { font-weight: 700; }\n.press .quote {\n  font-family: 'Source Serif Pro', serif; font-style: italic; font-size: 15px;\n  color: var(--ink); max-width: 380px; line-height: 1.5;\n  border-left: 2px solid var(--line); padding-left: 18px;\n  margin-left: auto;\n}\n.press .quote cite { display: block; font-style: normal; font-family: Inter; font-size: 12px; color: var(--mute); margin-top: 6px; letter-spacing: 0.04em; }\n\n</style>\n</head>\n<body>\n\n<a class=\"skip\" href=\"#main\">Skip to content</a>\n\n<header class=\"mk-header\">\n  <a class=\"mk-wordmark\" href=\"#\"><span class=\"mk-glyph\"></span><span>decouple</span></a>\n  <nav class=\"mk-nav\" aria-label=\"Primary\">\n    <a href=\"#\">The picture</a>\n    <a href=\"Desktop · How it works.html\">How it works</a>\n    <a href=\"Desktop · Pricing.html\">Pricing</a>\n    <a href=\"#\" class=\"is-active\">Trust &amp; FAQ</a>\n  </nav>\n  <div class=\"spacer\"></div>\n  <a class=\"mk-cta-secondary\" href=\"Desktop · Sign in.html\">Sign in</a>\n  <a class=\"mk-cta-primary\" href=\"#\"><span>Start free</span><span class=\"arr\">→</span></a>\n</header>\n\n<main id=\"main\" class=\"mk-page\">\n\n  <section class=\"tr-hero\">\n    <div class=\"mk-wrap\">\n      <span class=\"mk-eyebrow\">Trust &amp; common questions</span>\n      <h1 class=\"mk-h1\">\n        Things people ask <span class=\"it\">before they trust us with the worst week of their year.</span>\n      </h1>\n      <p class=\"mk-lede\">\n        Honest answers about how Decouple works — what we do, what we don't, where your data goes,\n        and whether the documents we generate stand up in court. If something here doesn't answer\n        you, book a 15-minute call below.\n      </p>\n\n      <div class=\"trust-strip\">\n        <div class=\"trust-cell\">\n          <div class=\"ic fca\">FCA</div>\n          <div class=\"lab\">Bank connection</div>\n          <div class=\"name\">FCA-regulated open banking</div>\n          <p>Account aggregation via TrueLayer Ltd, FCA reg 793171. Read-only — no payment permissions.</p>\n        </div>\n        <div class=\"trust-cell\">\n          <div class=\"ic iso\">ISO</div>\n          <div class=\"lab\">Data security</div>\n          <div class=\"name\">ISO 27001 certified</div>\n          <p>Encrypted at rest (AES-256) and in transit (TLS 1.3). UK-only data residency, deletable on request.</p>\n        </div>\n        <div class=\"trust-cell\">\n          <div class=\"ic uk\">UK</div>\n          <div class=\"lab\">Court-ready</div>\n          <div class=\"name\">FPR 9 &amp; D81 compliant</div>\n          <p>Documents follow Family Procedure Rules. We pre-flight against common judicial queries before submit.</p>\n        </div>\n        <div class=\"trust-cell\">\n          <div class=\"ic law\">RES</div>\n          <div class=\"lab\">Built with</div>\n          <div class=\"name\">Resolution &amp; family lawyers</div>\n          <p>Designed alongside Resolution-accredited mediators, two SRA-regulated family solicitors, and 90 separated couples.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"faq-section\">\n    <div class=\"mk-wrap\">\n\n      <div class=\"faq-grid\">\n        <aside class=\"faq-side\" aria-label=\"FAQ navigation\">\n          <h3>Common questions</h3>\n          <ul>\n            <li><button class=\"is-active\" data-go=\"legal\">Legal &amp; court process</button></li>\n            <li><button data-go=\"data\">Data &amp; security</button></li>\n            <li><button data-go=\"money\">Money &amp; pricing</button></li>\n            <li><button data-go=\"couple\">If you and your ex…</button></li>\n            <li><button data-go=\"us\">About Decouple</button></li>\n          </ul>\n          <div style=\"margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--mute); line-height: 1.5;\">\n            Can't find your question? <a href=\"#book\" style=\"color: var(--ink); border-bottom: 1px solid var(--ink); text-decoration: none;\">Book a 15-min call</a> with our team — same-day response on weekdays.\n          </div>\n        </aside>\n\n        <div class=\"faq-content\">\n          <\!-- LEGAL -->\n          <h2 class=\"faq-cat-head\" id=\"legal\">Legal &amp; court process</h2>\n          <p class=\"faq-cat-sub\">The questions about whether this actually works.</p>\n          <div class=\"faq-list\">\n            <details class=\"faq-row\" open>\n              <summary>Will the court actually accept these documents?<span class=\"chev\">+</span></summary>\n              <div class=\"body\">\n                <p>\n                  Yes. We produce the same documents your solicitor would: <em class=\"it\">Form D81</em>, the\n                  <em class=\"it\">consent order</em>, and <em class=\"it\">Pension Annex P1</em>. The format and field\n                  structure follow Family Procedure Rules 2010 Part 9 and the latest D81 guidance.\n                </p>\n                <p>\n                  Where we differ from a solicitor: we don't sign as your representative. You and your ex\n                  sign the documents yourselves and submit via the HMCTS portal — same as any litigant in person.\n                </p>\n                <div class=\"footnote\">\n                  As of October 2025, 1,847 of our settlements have been sealed by the court. 6 received initial queries on §10 reasoning; all 6 resolved on first response. None have been refused.\n                </div>\n              </div>\n            </details>\n\n            <details class=\"faq-row\">\n              <summary>Is this legal advice?<span class=\"chev\">+</span></summary>\n              <div class=\"body\">\n                <p>\n                  No, and we say so up-front. Decouple provides tools, document templates, and AI guidance\n                  grounded in published law and Resolution best practice. We don't represent you and we\n                  can't tell you which option is \"right\" for your specific situation.\n                </p>\n                <p>\n                  For most uncontested separations that's enough — but if your case has contested children's\n                  matters, financial concealment, complex trusts, or one party feels unsafe, you should\n                  speak to a family solicitor. We'll flag those situations clearly when you start.\n                </p>\n              </div>\n            </details>\n\n            <details class=\"faq-row\">\n              <summary>What happens if our settlement gets a query from the judge?<span class=\"chev\">+</span></summary>\n              <div class=\"body\">\n                <p>\n                  Most queries are about D81 §10 (reasoning for the proposed division) or about pension\n                  CETV figures being out of date. Both are easy to fix. Our pre-flight check warns you\n                  about the most common ones before submit.\n                </p>\n                <p>\n                  If you get a query, we'll send you a templated response and the relevant case-law\n                  reference, and we don't charge for the resubmission. If we still can't get you to a sealed\n                  order, we refund the Settlement fee in full.\n                </p>\n              </div>\n            </details>\n\n            <details class=\"faq-row\">\n              <summary>Do we both need to use Decouple?<span class=\"chev\">+</span></summary>\n              <div class=\"body\">\n                <p>\n                  Yes — both of you sign in to the same workspace and see the same picture. This is what\n                  makes the process work. One of you starts and invites the other; the second account is\n                  free and shares the same Settlement fee when it's time to draft.\n                </p>\n              </div>\n            </details>\n          </div>\n\n          <\!-- DATA -->\n          <h2 class=\"faq-cat-head\" id=\"data\">Data &amp; security</h2>\n          <p class=\"faq-cat-sub\">Where your money information lives, and who can see it.</p>\n          <div class=\"faq-list\">\n            <details class=\"faq-row\">\n              <summary>Can Decouple move money in or out of my accounts?<span class=\"chev\">+</span></summary>\n              <div class=\"body\">\n                <p>\n                  No. We use <strong>read-only</strong> open banking. We can see balances, transactions, and\n                  standing orders so we can build your picture, and that's all. We do not have payment\n                  initiation permissions and never will.\n                </p>\n                <p>\n                  TrueLayer (FCA reg 793171) handles the bank connection itself — your bank's terms apply.\n                  You can revoke access from your bank's app at any time, and the connection auto-expires\n                  every 90 days unless you re-authorise.\n                </p>\n              </div>\n            </details>\n\n            <details class=\"faq-row\">\n              <summary>Can my ex see my private accounts?<span class=\"chev\">+</span></summary>\n              <div class=\"body\">\n                <p>\n                  Only what you explicitly choose to share. There are two views in Decouple: <em class=\"it\">Your Picture</em>\n                  (private to you, to draft and check) and <em class=\"it\">Our Household Picture</em> (the disclosure\n                  you've agreed to share). You move things from private to shared one item at a time, and\n                  you see exactly what's in each before you publish.\n                </p>\n                <p>\n                  Both of you must disclose everything financially relevant — that's a legal duty of full\n                  and frank disclosure, not a Decouple rule. We help you meet it without accidentally\n                  oversharing the things that don't matter (your therapist's name, your friend's lent £40).\n                </p>\n              </div>\n            </details>\n\n            <details class=\"faq-row\">\n              <summary>What happens to my data when we're done?<span class=\"chev\">+</span></summary>\n              <div class=\"body\">\n                <p>\n                  Settlement plans include 12 months access to the sealed package — you'll often need it\n                  for mortgage applications, tax filings, or pension transfers. After 12 months you can\n                  download everything as a zip and request hard deletion. We comply with UK GDPR Article 17\n                  (right to erasure) within 30 days of request.\n                </p>\n              </div>\n            </details>\n          </div>\n\n          <\!-- MONEY -->\n          <h2 class=\"faq-cat-head\" id=\"money\">Money &amp; pricing</h2>\n          <p class=\"faq-cat-sub\">What you'll actually pay, and when.</p>\n          <div class=\"faq-list\">\n            <details class=\"faq-row\">\n              <summary>Why is it free for the first three phases?<span class=\"chev\">+</span></summary>\n              <div class=\"body\">\n                <p>\n                  Because that's the part where you're working out whether to do this at all. Most people\n                  spend two to four weeks in phases 1–3 — building the picture, deciding if reconciliation\n                  is realistic, talking to family. We'd rather you find out we're not for you for free than\n                  pay £200 to discover you need a solicitor.\n                </p>\n              </div>\n            </details>\n\n            <details class=\"faq-row\">\n              <summary>Are there hidden costs?<span class=\"chev\">+</span></summary>\n              <div class=\"body\">\n                <p>\n                  No. The £800 Settlement fee covers everything from drafting through HMCTS submission. Two\n                  things you may need to pay separately: the <strong>HMCTS court fee of £58</strong> (paid directly\n                  to the court when you file), and any <strong>fresh CETVs</strong> if your existing pension\n                  valuations expire (usually free, but some private schemes charge £150–£250).\n                </p>\n                <p>\n                  If you choose Settlement + Mediator (£1,100), you're eligible for the government's\n                  <strong>£500 Family Mediation Voucher</strong>, bringing it to £600 effective.\n                </p>\n              </div>\n            </details>\n\n            <details class=\"faq-row\">\n              <summary>What if we start, and decide we need a solicitor instead?<span class=\"chev\">+</span></summary>\n              <div class=\"body\">\n                <p>\n                  Pause and export. The picture you've built and the proposals you've drafted export as a\n                  clean PDF brief any solicitor can pick up. Several firms in our network give a discount\n                  to couples who arrive with a Decouple bundle, because it cuts their first ten hours of work.\n                </p>\n              </div>\n            </details>\n          </div>\n\n          <\!-- COUPLE -->\n          <h2 class=\"faq-cat-head\" id=\"couple\">If you and your ex…</h2>\n          <p class=\"faq-cat-sub\">The human bits.</p>\n          <div class=\"faq-list\">\n            <details class=\"faq-row\">\n              <summary>…aren't really speaking right now.<span class=\"chev\">+</span></summary>\n              <div class=\"body\">\n                <p>\n                  Decouple is built for that. The picture phase is private — you each build your own view of\n                  the household before you reconcile. The reconciliation phase moves at your pace; you can\n                  set \"respond by Friday\" rather than expecting same-day reactions. Most users tell us the\n                  asynchronous structure is what made it possible.\n                </p>\n              </div>\n            </details>\n\n            <details class=\"faq-row\">\n              <summary>…disagree about the value of something big.<span class=\"chev\">+</span></summary>\n              <div class=\"body\">\n                <p>\n                  Each disagreement gets its own card with a clear path: gather evidence (extra valuations),\n                  propose a midpoint, or escalate. The AI coach explains what courts typically expect. If\n                  you're more than 10% apart on the family home and can't agree, we recommend a joint\n                  RICS surveyor — ~£600 split, settles the question in one number.\n                </p>\n              </div>\n            </details>\n\n            <details class=\"faq-row\">\n              <summary>…have children.<span class=\"chev\">+</span></summary>\n              <div class=\"body\">\n                <p>\n                  Decouple covers the financial side — the consent order — and we have a children's section\n                  for residence and contact arrangements. We <strong>don't</strong> do contested children's matters,\n                  Cafcass referrals, or safeguarding cases; those need a specialist family solicitor and\n                  often the courts. We'll tell you clearly if your situation falls into that category.\n                </p>\n              </div>\n            </details>\n          </div>\n\n          <\!-- ABOUT -->\n          <h2 class=\"faq-cat-head\" id=\"us\">About Decouple</h2>\n          <div class=\"faq-list\">\n            <details class=\"faq-row\">\n              <summary>Who builds this?<span class=\"chev\">+</span></summary>\n              <div class=\"body\">\n                <p>\n                  A team of seven, in London. Co-founded by a family lawyer and an ex-banking software\n                  engineer who went through a separation in 2022 and watched £18,000 disappear into a\n                  process that should have cost a fraction of that. We work alongside two Resolution\n                  mediators and have an advisory board of five UK family law specialists.\n                </p>\n              </div>\n            </details>\n\n            <details class=\"faq-row\">\n              <summary>How do you make money?<span class=\"chev\">+</span></summary>\n              <div class=\"body\">\n                <p>\n                  One fixed fee per couple. We don't sell data, take referral fees from solicitors, or charge\n                  per document. Investors are patient; we're building for the long term.\n                </p>\n              </div>\n            </details>\n\n            <details class=\"faq-row\">\n              <summary>What if you go out of business?<span class=\"chev\">+</span></summary>\n              <div class=\"body\">\n                <p>\n                  Your data and documents stay yours. We hold a <em class=\"it\">data trust agreement</em> with an\n                  independent UK firm: if Decouple ever shut down, all sealed packages and active workspaces\n                  remain accessible for 24 months while you finish or migrate. The legal documents we've\n                  already produced for you are valid regardless of our status — they're your property.\n                </p>\n              </div>\n            </details>\n          </div>\n        </div>\n      </div>\n\n      <\!-- press -->\n      <div class=\"press\" aria-label=\"Press &amp; mentions\">\n        <span class=\"lab\">As covered in</span>\n        <span class=\"logo bold\">The Times</span>\n        <span class=\"logo\">Family Law Quarterly</span>\n        <span class=\"logo\">Resolution Review</span>\n        <span class=\"logo bold\">FT Adviser</span>\n        <blockquote class=\"quote\">\n          \"Quietly the most useful thing to happen to financial separation in a decade.\"\n          <cite>— Family Law Quarterly · Spring 2025</cite>\n        </blockquote>\n      </div>\n\n      <\!-- book a call -->\n      <div class=\"cta-band\" id=\"book\">\n        <div class=\"cta-card\">\n          <span class=\"lab\">Talk to a person</span>\n          <h3>Book a 15-minute call.</h3>\n          <p>One of our team — usually Priya or James — will walk you through whether Decouple fits your situation. No sales pressure, just an honest answer.</p>\n          <div class=\"row\">\n            <a class=\"btn-primary\" href=\"#\">Book a slot <span>→</span></a>\n            <a class=\"btn-secondary\" href=\"mailto:hello@decouple.uk\">Or email us</a>\n          </div>\n          <div class=\"meta\">\n            <span>Mon–Fri, 9am–6pm</span><span class=\"dot\"></span>\n            <span>Zoom or phone</span><span class=\"dot\"></span>\n            <span>Same-day response</span>\n          </div>\n        </div>\n        <div class=\"cta-card dark\">\n          <span class=\"lab\">Or just start</span>\n          <h3>Three minutes &amp; you'll know if this is for you.</h3>\n          <p>The orientation is free, gives you a real plan, and asks nothing in return. Most people decide in those three minutes whether to keep going.</p>\n          <div class=\"row\">\n            <a class=\"btn-primary\" href=\"#\">Start free <span>→</span></a>\n          </div>\n          <div class=\"meta\">\n            <span>~3 minutes</span><span class=\"dot\"></span>\n            <span>No account needed</span><span class=\"dot\"></span>\n            <span>Save anytime</span>\n          </div>\n        </div>\n      </div>\n\n    </div>\n  </section>\n\n  <footer class=\"mk-footer\">\n    <div class=\"mk-footer-inner\">\n      <div>\n        <a class=\"mk-wordmark\" href=\"#\"><span class=\"mk-glyph\"></span><span>decouple</span></a>\n        <p class=\"lede\" style=\"margin-top: 16px;\">\n          The complete settlement workspace for separating couples. Built with mediators,\n          family lawyers, and the people who've been through it.\n        </p>\n      </div>\n      <div>\n        <h4>Product</h4>\n        <ul>\n          <li><a href=\"Desktop · How it works.html\">How it works</a></li>\n          <li><a href=\"Desktop · Pricing.html\">Pricing</a></li>\n          <li><a href=\"Desktop · FAQ + Trust.html\">Trust &amp; safety</a></li>\n          <li><a href=\"#\">For solicitors</a></li>\n          <li><a href=\"#\">For mediators</a></li>\n        </ul>\n      </div>\n      <div>\n        <h4>Help</h4>\n        <ul>\n          <li><a href=\"Desktop · FAQ + Trust.html\">FAQ</a></li>\n          <li><a href=\"#\">Book a 15-minute call</a></li>\n          <li><a href=\"#\">Help centre</a></li>\n          <li><a href=\"#\">Contact</a></li>\n        </ul>\n      </div>\n      <div>\n        <h4>Company</h4>\n        <ul>\n          <li><a href=\"#\">About</a></li>\n          <li><a href=\"#\">Privacy</a></li>\n          <li><a href=\"#\">Terms</a></li>\n          <li><a href=\"#\">Security</a></li>\n        </ul>\n      </div>\n    </div>\n    <div class=\"mk-footer-inner\">\n      <div class=\"legal\" style=\"grid-column: 1 / -1;\">\n        <div>© 2026 Decouple Ltd. Registered in England and Wales · Company No. 14872019.</div>\n        <div>Decouple is not a law firm. We provide tools and document generation; we don't give legal advice.</div>\n      </div>\n    </div>\n  </footer>\n\n</main>\n\n<script>\n  // FAQ side-nav: scroll-spy + click-to-jump\n  const buttons = document.querySelectorAll('.faq-side button[data-go]');\n  const heads = [...document.querySelectorAll('.faq-cat-head')];\n  buttons.forEach(b => b.addEventListener('click', () => {\n    const t = document.getElementById(b.dataset.go);\n    if (t) window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 88, behavior: 'smooth' });\n  }));\n  const obs = new IntersectionObserver(es => {\n    es.forEach(e => {\n      if (e.isIntersecting) {\n        buttons.forEach(b => b.classList.toggle('is-active', b.dataset.go === e.target.id));\n      }\n    });\n  }, { rootMargin: '-30% 0px -55% 0px' });\n  heads.forEach(h => obs.observe(h));\n<\/script>\n\n</body>\n</html>\n","Desktop · Sign in.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"/>\n<meta name=\"viewport\" content=\"width=1440\"/>\n<title>Decouple — Sign in</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"/>\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"marketing/marketing.css\"/>\n<style>\n\n/* slim header for auth pages */\n.auth-header {\n  height: 64px;\n  display: flex; align-items: center;\n  padding: 0 40px;\n  border-bottom: 1px solid var(--line);\n  background: var(--bg);\n}\n.auth-header .spacer { flex: 1; }\n.auth-header .right {\n  display: flex; align-items: center; gap: 18px;\n  font-size: 13.5px; color: var(--sub);\n}\n.auth-header .right a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 1px; font-weight: 500; }\n\n/* shell */\n.auth-shell {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  min-height: calc(100vh - 64px);\n}\n\n/* form pane */\n.auth-form-pane {\n  display: flex; align-items: center; justify-content: center;\n  padding: 48px 64px;\n  background: var(--bg);\n}\n.auth-form {\n  width: 100%; max-width: 420px;\n  display: flex; flex-direction: column;\n}\n.auth-tabs {\n  display: inline-grid; grid-template-columns: 1fr 1fr;\n  background: var(--canvas); border: 1px solid var(--line); border-radius: 999px;\n  padding: 4px; margin-bottom: 28px;\n  font-size: 13px; font-weight: 500;\n}\n.auth-tabs button {\n  border: none; background: transparent; padding: 8px 18px;\n  border-radius: 999px; cursor: pointer; color: var(--sub);\n  font-family: inherit; font-size: inherit;\n  transition: background 160ms, color 160ms;\n}\n.auth-tabs button.is-active { background: var(--ink); color: #fff; }\n\n.auth-form h1 {\n  font-family: 'Source Serif Pro', serif;\n  font-size: 36px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1;\n  margin: 0 0 8px;\n}\n.auth-form .lede {\n  font-size: 15px; color: var(--sub); line-height: 1.5; margin: 0 0 28px;\n  text-wrap: pretty;\n}\n\n/* sso buttons */\n.sso-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }\n.sso-btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 10px;\n  padding: 12px 16px; border-radius: 12px;\n  background: var(--panel); border: 1px solid var(--line);\n  color: var(--ink); font-size: 14px; font-weight: 500;\n  cursor: pointer; text-decoration: none;\n  font-family: inherit;\n  transition: background 160ms;\n}\n.sso-btn:hover { background: var(--canvas); }\n.sso-btn .ic { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; }\n\n.divider {\n  display: flex; align-items: center; gap: 10px;\n  margin: 0 0 22px;\n  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); font-weight: 600;\n}\n.divider::before, .divider::after { content: \"\"; flex: 1; height: 1px; background: var(--line); }\n\n/* fields */\n.field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }\n.field label { font-size: 12.5px; color: var(--sub); font-weight: 500; }\n.field .label-row { display: flex; justify-content: space-between; align-items: baseline; }\n.field .label-row a {\n  font-size: 12px; color: var(--ink); text-decoration: none;\n  border-bottom: 1px solid var(--line);\n}\n.field .label-row a:hover { border-color: var(--ink); }\n\n.field input {\n  font-family: inherit; font-size: 14.5px;\n  padding: 12px 14px; border-radius: 10px;\n  background: var(--panel); border: 1px solid var(--line);\n  color: var(--ink);\n  transition: border-color 160ms, box-shadow 160ms;\n}\n.field input:focus {\n  outline: none; border-color: var(--ink);\n  box-shadow: 0 0 0 3px rgba(26,26,26,0.08);\n}\n.field .help { font-size: 11.5px; color: var(--mute); line-height: 1.4; }\n\n.checkbox-row { display: flex; align-items: flex-start; gap: 10px; margin: 4px 0 22px; font-size: 13px; color: var(--sub); line-height: 1.45; }\n.checkbox-row input[type=checkbox] {\n  width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px;\n  accent-color: var(--ink);\n}\n.checkbox-row a { color: var(--ink); border-bottom: 1px solid var(--line); text-decoration: none; }\n\n.auth-submit {\n  display: inline-flex; align-items: center; justify-content: center; gap: 8px;\n  width: 100%; padding: 14px 18px; border-radius: 12px;\n  background: var(--ink); color: #fff; border: none;\n  font-family: inherit; font-size: 14.5px; font-weight: 500; cursor: pointer;\n  transition: transform 160ms, box-shadow 160ms;\n}\n.auth-submit:hover { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(26,26,26,0.18); }\n\n.swap-line {\n  text-align: center; font-size: 13px; color: var(--mute); margin-top: 22px;\n}\n.swap-line button {\n  background: none; border: none; padding: 0; cursor: pointer;\n  color: var(--ink); font-weight: 500;\n  border-bottom: 1px solid var(--ink); font-family: inherit; font-size: inherit;\n}\n\n/* invite branch — visible on signup only */\n.invite-card {\n  margin-bottom: 22px;\n  padding: 16px 18px;\n  background: var(--p-build-soft);\n  border: 1px solid rgba(67,56,202,0.18);\n  border-radius: 12px;\n  display: flex; gap: 14px; align-items: flex-start;\n}\n.invite-card .pill {\n  width: 36px; height: 36px; flex-shrink: 0;\n  border-radius: 999px; background: #fff;\n  border: 1px solid rgba(67,56,202,0.25);\n  display: flex; align-items: center; justify-content: center;\n  font-family: 'Source Serif Pro', serif; font-weight: 600; color: var(--p-build);\n  font-size: 14px;\n}\n.invite-card .text { flex: 1; }\n.invite-card .head { font-size: 13.5px; font-weight: 600; color: var(--p-build); margin-bottom: 3px; }\n.invite-card .body { font-size: 12.5px; color: var(--sub); line-height: 1.45; }\n\n/* brand pane */\n.auth-brand-pane {\n  background: linear-gradient(180deg, #FAFAF7 0%, #F0EDE2 100%);\n  padding: 56px 56px;\n  display: flex; flex-direction: column; justify-content: space-between;\n  border-left: 1px solid var(--line);\n  position: relative;\n  overflow: hidden;\n}\n.auth-brand-pane::before {\n  content: \"\";\n  position: absolute; right: -120px; top: -120px;\n  width: 380px; height: 380px;\n  border-radius: 999px;\n  background: radial-gradient(circle at center, rgba(67,56,202,0.05), transparent 70%);\n  pointer-events: none;\n}\n\n.brand-quote {\n  margin-top: 64px; max-width: 520px;\n}\n.brand-quote .stamp {\n  display: inline-flex; align-items: center; gap: 8px;\n  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700;\n  color: var(--mute);\n}\n.brand-quote .stamp::before { content: \"\"; width: 22px; height: 1px; background: var(--soft); }\n.brand-quote q {\n  font-family: 'Source Serif Pro', serif;\n  font-size: 30px; font-weight: 600; line-height: 1.25; letter-spacing: -0.02em;\n  color: var(--ink);\n  display: block;\n  margin: 22px 0 24px;\n  text-wrap: balance;\n}\n.brand-quote q::before { content: open-quote; color: var(--soft); }\n.brand-quote q::after  { content: close-quote; color: var(--soft); }\n.brand-quote .who {\n  display: flex; align-items: center; gap: 12px;\n}\n.brand-quote .avatar {\n  width: 38px; height: 38px; border-radius: 999px;\n  background: linear-gradient(135deg, #4338CA, #9D174D);\n  color: #fff; font-family: 'Source Serif Pro', serif; font-weight: 600;\n  display: flex; align-items: center; justify-content: center; font-size: 14px;\n}\n.brand-quote .name { font-size: 14px; font-weight: 500; color: var(--ink); }\n.brand-quote .meta { font-size: 12.5px; color: var(--mute); margin-top: 1px; }\n\n/* status snippet — what they'll come back to */\n.brand-status {\n  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;\n  overflow: hidden;\n  box-shadow: 0 12px 30px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.04);\n}\n.brand-status .top {\n  padding: 14px 18px; display: flex; align-items: center; gap: 10px;\n  border-bottom: 1px solid var(--line);\n  font-size: 12.5px; color: var(--mute);\n}\n.brand-status .top .badge {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 3px 10px; border-radius: 999px;\n  background: var(--p-fin-soft); color: var(--p-fin);\n  font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700;\n}\n.brand-status .top .badge .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--p-fin); }\n\n.brand-status .body { padding: 18px 22px 22px; }\n.brand-status h4 {\n  font-family: 'Source Serif Pro', serif; font-size: 18px; font-weight: 600; letter-spacing: -0.01em;\n  margin: 0 0 12px;\n}\n.progress-rail {\n  display: flex; gap: 6px; margin-bottom: 20px;\n}\n.progress-rail .seg {\n  flex: 1; height: 6px; border-radius: 999px; background: var(--line);\n}\n.progress-rail .seg.done { background: var(--ink); }\n.progress-rail .seg.live { background: var(--ink); position: relative; }\n.progress-rail .seg.live::after {\n  content: \"\"; position: absolute; right: -2px; top: -3px; width: 12px; height: 12px;\n  border-radius: 999px; background: #fff; border: 2px solid var(--ink);\n}\n\n.brand-status .step-list { display: flex; flex-direction: column; gap: 12px; }\n.brand-status .step {\n  display: flex; gap: 12px; align-items: flex-start;\n  font-size: 13.5px;\n}\n.brand-status .step .pip {\n  width: 18px; height: 18px; border-radius: 999px;\n  display: flex; align-items: center; justify-content: center;\n  font-size: 9.5px; font-weight: 700; color: #fff;\n  flex-shrink: 0; margin-top: 2px;\n}\n.brand-status .step.done .pip { background: var(--p-fin); }\n.brand-status .step.live .pip { background: var(--ink); }\n.brand-status .step.next .pip { background: var(--soft); }\n.brand-status .step .label { color: var(--ink); font-weight: 500; }\n.brand-status .step.next .label { color: var(--mute); font-weight: 400; }\n.brand-status .step .meta { font-size: 11.5px; color: var(--mute); margin-top: 1px; }\n\n/* trust list bottom */\n.brand-trust {\n  margin-top: 28px;\n  padding-top: 24px; border-top: 1px solid var(--line);\n  display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px;\n  font-size: 12px; color: var(--sub); line-height: 1.45;\n}\n.brand-trust .it {\n  display: flex; gap: 10px; align-items: flex-start;\n}\n.brand-trust .it .ic {\n  width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0; margin-top: 2px;\n  background: var(--ink);\n  display: flex; align-items: center; justify-content: center;\n  color: #fff; font-size: 9px; font-weight: 700;\n}\n\n/* signup-mode visibility */\nbody[data-mode=signin] .show-signup { display: none; }\nbody[data-mode=signup] .show-signin { display: none; }\n\n</style>\n</head>\n<body data-mode=\"signin\">\n\n<a class=\"skip\" href=\"#main\">Skip to content</a>\n\n<header class=\"auth-header\">\n  <a class=\"mk-wordmark\" href=\"#\"><span class=\"mk-glyph\"></span><span>decouple</span></a>\n  <div class=\"spacer\"></div>\n  <div class=\"right\">\n    <span class=\"show-signin\">New to Decouple? <a href=\"#\" data-mode-go=\"signup\">Create an account</a></span>\n    <span class=\"show-signup\">Already have an account? <a href=\"#\" data-mode-go=\"signin\">Sign in</a></span>\n  </div>\n</header>\n\n<main id=\"main\">\n\n  <div class=\"auth-shell\">\n\n    <\!-- LEFT — form pane -->\n    <section class=\"auth-form-pane\">\n      <div class=\"auth-form\">\n\n        <div class=\"auth-tabs\" role=\"tablist\">\n          <button data-mode-go=\"signin\" class=\"is-active\">Sign in</button>\n          <button data-mode-go=\"signup\">Create account</button>\n        </div>\n\n        <\!-- Signin head -->\n        <div class=\"show-signin\">\n          <h1>Welcome back.</h1>\n          <p class=\"lede\">Sign in to pick up where you and Mark left off — your reconciliation has 5 cards waiting.</p>\n        </div>\n\n        <\!-- Signup head -->\n        <div class=\"show-signup\">\n          <h1>Start with the orientation.</h1>\n          <p class=\"lede\">Three minutes, eight questions, a real plan you can keep — whether you continue with us or not.</p>\n\n          <div class=\"invite-card\">\n            <div class=\"pill\">M</div>\n            <div class=\"text\">\n              <div class=\"head\">Mark invited you</div>\n              <div class=\"body\">You're joining an existing workspace. Once you sign in, you'll both see the same household picture and pick up at phase 3 · Reconcile.</div>\n            </div>\n          </div>\n        </div>\n\n        <div class=\"sso-row\">\n          <button class=\"sso-btn\" type=\"button\">\n            <span class=\"ic\">\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\">\n                <path fill=\"#4285F4\" d=\"M15.7 8.18c0-.6-.05-1.18-.15-1.73H8v3.27h4.32a3.7 3.7 0 0 1-1.6 2.43v2.02h2.6c1.51-1.4 2.38-3.46 2.38-5.99z\"/>\n                <path fill=\"#34A853\" d=\"M8 16c2.16 0 3.97-.72 5.3-1.94l-2.6-2.02c-.72.49-1.65.78-2.7.78-2.07 0-3.83-1.4-4.46-3.28H.85v2.07A8 8 0 0 0 8 16z\"/>\n                <path fill=\"#FBBC04\" d=\"M3.54 9.54a4.8 4.8 0 0 1 0-3.08V4.39H.85a8 8 0 0 0 0 7.22l2.69-2.07z\"/>\n                <path fill=\"#EA4335\" d=\"M8 3.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 8 0 8 8 0 0 0 .85 4.39l2.69 2.07C4.17 4.58 5.93 3.18 8 3.18z\"/>\n              </svg>\n            </span>\n            Continue with Google\n          </button>\n          <button class=\"sso-btn\" type=\"button\">\n            <span class=\"ic\">\n              <svg width=\"14\" height=\"16\" viewBox=\"0 0 14 16\" aria-hidden=\"true\" fill=\"#1A1A1A\">\n                <path d=\"M11.4 8.5c0-1.6 1.3-2.4 1.4-2.4-.8-1.1-2-1.3-2.4-1.3-1-.1-2 .6-2.5.6-.5 0-1.3-.6-2.2-.6-1.1 0-2.2.7-2.7 1.7-1.2 2-.3 5 .8 6.7.6.8 1.2 1.7 2.1 1.7.8 0 1.2-.5 2.2-.5 1 0 1.3.5 2.2.5.9 0 1.5-.8 2-1.6.6-.9.9-1.8.9-1.9 0 0-1.7-.7-1.8-2.6zm-1.6-4.7c.4-.5.7-1.2.7-1.9-.6 0-1.4.4-1.8.9-.4.4-.8 1.1-.7 1.8.7.1 1.3-.3 1.8-.8z\"/>\n              </svg>\n            </span>\n            Continue with Apple\n          </button>\n        </div>\n\n        <div class=\"divider\">or with email</div>\n\n        <\!-- form fields -->\n        <form>\n          <div class=\"field show-signup\">\n            <label for=\"name\">Your name</label>\n            <input id=\"name\" type=\"text\" placeholder=\"Sarah Whittaker\" autocomplete=\"name\"/>\n            <div class=\"help\">Used in your settlement documents — it's the name that goes on the consent order, so use the legal version.</div>\n          </div>\n\n          <div class=\"field\">\n            <label for=\"email\">Email</label>\n            <input id=\"email\" type=\"email\" placeholder=\"sarah@example.co.uk\" autocomplete=\"email\" value=\"\"/>\n          </div>\n\n          <div class=\"field\">\n            <div class=\"label-row\">\n              <label for=\"password\">Password</label>\n              <a href=\"#\" class=\"show-signin\">Forgot it?</a>\n            </div>\n            <input id=\"password\" type=\"password\" placeholder=\"••••••••••\" autocomplete=\"current-password\"/>\n            <div class=\"help show-signup\">10+ characters, mix of letters and numbers. We'll never email this back to you.</div>\n          </div>\n\n          <div class=\"checkbox-row show-signup\">\n            <input id=\"tos\" type=\"checkbox\"/>\n            <label for=\"tos\">\n              I agree to Decouple's <a href=\"#\">Terms</a> and <a href=\"#\">Privacy Notice</a>, and confirm I'm 18 or over.\n              I understand Decouple isn't a law firm and doesn't give legal advice.\n            </label>\n          </div>\n\n          <button type=\"submit\" class=\"auth-submit\">\n            <span class=\"show-signin\">Sign in</span>\n            <span class=\"show-signup\">Create account &amp; start orientation</span>\n            <span>→</span>\n          </button>\n        </form>\n\n        <div class=\"swap-line show-signin\">\n          New here? <button type=\"button\" data-mode-go=\"signup\">Create an account</button>\n        </div>\n        <div class=\"swap-line show-signup\">\n          Already started? <button type=\"button\" data-mode-go=\"signin\">Sign in</button>\n        </div>\n      </div>\n    </section>\n\n    <\!-- RIGHT — brand pane -->\n    <aside class=\"auth-brand-pane\" aria-label=\"What you're signing back into\">\n\n      <div class=\"brand-quote\">\n        <span class=\"stamp\">From a couple who used Decouple</span>\n        <q>We were dreading the legal side, but it ended up being the calmest part. Three months from connecting our banks to a sealed order — for less than the consultation fee we'd been quoted.</q>\n        <div class=\"who\">\n          <div class=\"avatar\">P</div>\n          <div>\n            <div class=\"name\">Priya &amp; Tom · Sealed November 2025</div>\n            <div class=\"meta\">Crouch End · two children · 11 weeks total</div>\n          </div>\n        </div>\n      </div>\n\n      <\!-- live status of returning user -->\n      <div class=\"brand-status show-signin\" aria-label=\"Where you left off\">\n        <div class=\"top\">\n          <span class=\"badge\"><span class=\"dot\"></span>You &amp; Mark · phase 3</span>\n          <span class=\"spacer\" style=\"flex:1\"></span>\n          <span>Day 23 · last opened Tue</span>\n        </div>\n        <div class=\"body\">\n          <h4>Pick up where you left off.</h4>\n          <div class=\"progress-rail\" aria-hidden=\"true\">\n            <div class=\"seg done\"></div>\n            <div class=\"seg done\"></div>\n            <div class=\"seg live\"></div>\n            <div class=\"seg\"></div>\n            <div class=\"seg\"></div>\n          </div>\n\n          <div class=\"step-list\">\n            <div class=\"step done\">\n              <div class=\"pip\">✓</div>\n              <div>\n                <div class=\"label\">Phase 1 · Orientation</div>\n                <div class=\"meta\">Plan generated · 1 Oct</div>\n              </div>\n            </div>\n            <div class=\"step done\">\n              <div class=\"pip\">✓</div>\n              <div>\n                <div class=\"label\">Phase 2 · Your private picture</div>\n                <div class=\"meta\">Bank connected · 184 transactions categorised · 5 Oct</div>\n              </div>\n            </div>\n            <div class=\"step live\">\n              <div class=\"pip\">●</div>\n              <div>\n                <div class=\"label\">Phase 3 · Reconcile with Mark</div>\n                <div class=\"meta\">5 contested cards waiting · 1 needs your evidence</div>\n              </div>\n            </div>\n            <div class=\"step next\">\n              <div class=\"pip\">4</div>\n              <div>\n                <div class=\"label\">Phase 4 · Settle</div>\n                <div class=\"meta\">Unlocks once 80% of cards agreed</div>\n              </div>\n            </div>\n            <div class=\"step next\">\n              <div class=\"pip\">5</div>\n              <div>\n                <div class=\"label\">Phase 5 · Finalise</div>\n                <div class=\"meta\">Court-ready package · auto-generated</div>\n              </div>\n            </div>\n          </div>\n        </div>\n      </div>\n\n      <\!-- signup pane: trust grid instead of status -->\n      <div class=\"brand-status show-signup\" aria-label=\"What free covers\">\n        <div class=\"top\">\n          <span class=\"badge\" style=\"background: var(--warm); color: var(--ink);\"><span class=\"dot\" style=\"background: var(--ink);\"></span>Free · phases 1–3</span>\n          <span class=\"spacer\" style=\"flex:1\"></span>\n          <span>~3 minutes to plan</span>\n        </div>\n        <div class=\"body\">\n          <h4>What you'll do in the next three minutes.</h4>\n          <div class=\"step-list\">\n            <div class=\"step live\">\n              <div class=\"pip\">1</div>\n              <div>\n                <div class=\"label\">Tell us about your situation</div>\n                <div class=\"meta\">8 questions · skip any that don't fit</div>\n              </div>\n            </div>\n            <div class=\"step next\">\n              <div class=\"pip\">2</div>\n              <div>\n                <div class=\"label\">Get your AI-drafted plan</div>\n                <div class=\"meta\">Likely cost, timeline, biggest risks · yours to keep</div>\n              </div>\n            </div>\n            <div class=\"step next\">\n              <div class=\"pip\">3</div>\n              <div>\n                <div class=\"label\">Decide if you want to keep going</div>\n                <div class=\"meta\">No card asked · no email follow-up unless you opt in</div>\n              </div>\n            </div>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"brand-trust\">\n        <div class=\"it\"><div class=\"ic\">F</div><div><strong>FCA-regulated</strong> bank connection via TrueLayer (reg 793171). Read-only.</div></div>\n        <div class=\"it\"><div class=\"ic\">I</div><div><strong>ISO 27001</strong> · UK-only data residency · deletable on request.</div></div>\n        <div class=\"it\"><div class=\"ic\">L</div><div><strong>Mediator-built</strong> alongside Resolution-accredited specialists.</div></div>\n        <div class=\"it\"><div class=\"ic\">£</div><div><strong>Free until phase 4</strong>. No card asked at sign-up.</div></div>\n      </div>\n    </aside>\n\n  </div>\n\n</main>\n\n<script>\n  // tab + link mode swap\n  function setMode(m) {\n    document.body.dataset.mode = m;\n    document.querySelectorAll('.auth-tabs button').forEach(b => {\n      b.classList.toggle('is-active', b.dataset.modeGo === m);\n    });\n    // update form action / autocomplete\n    const pwd = document.getElementById('password');\n    if (pwd) pwd.autocomplete = m === 'signup' ? 'new-password' : 'current-password';\n  }\n  document.querySelectorAll('[data-mode-go]').forEach(el => {\n    el.addEventListener('click', e => {\n      e.preventDefault();\n      setMode(el.dataset.modeGo);\n    });\n  });\n  // also let URL hash control it\n  if (location.hash === '#signup') setMode('signup');\n<\/script>\n\n</body>\n</html>\n","Post-connect Dashboard.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"/>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"/>\n<title>Decouple — Post-connect Dashboard</title>\n<script src=\"https://cdn.tailwindcss.com\"><\/script>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"/>\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<script src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\" integrity=\"sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L\" crossorigin=\"anonymous\"><\/script>\n<script src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\" integrity=\"sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm\" crossorigin=\"anonymous\"><\/script>\n<script src=\"https://unpkg.com/@babel/standalone@7.29.0/babel.min.js\" integrity=\"sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y\" crossorigin=\"anonymous\"><\/script>\n<style>\n  html, body, #root { height: 100%; }\n  body {\n    margin: 0;\n    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;\n    background: #F5F5F4;\n    color: #1A1A1A;\n    -webkit-font-smoothing: antialiased;\n    font-feature-settings: \"ss01\",\"cv11\";\n  }\n  .serif { font-family: 'Source Serif Pro', Georgia, serif; }\n  .mono  { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }\n  .label-xs { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }\n  .tabular { font-variant-numeric: tabular-nums; }\n  .hairline { border: 1px solid #E5E3DC; }\n  button:focus-visible, a:focus-visible { outline: 2px solid #1A1A1A; outline-offset: 2px; border-radius: 4px; }\n  .nice-scroll::-webkit-scrollbar { width: 8px; height: 8px; }\n  .nice-scroll::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 8px; }\n  .nice-scroll::-webkit-scrollbar-track { background: transparent; }\n</style>\n</head>\n<body>\n<div id=\"root\"></div>\n\n<script type=\"text/babel\" data-presets=\"react\" src=\"design-canvas.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"dashboard/components.jsx\"><\/script>\n\n<script type=\"text/babel\" data-presets=\"react\">\nconst Dashboard = window.Dashboard;\n\nfunction App() {\n  return (\n    <DesignCanvas>\n      <DCSection\n        id=\"dashboard\"\n        title=\"Post bank-connection dashboard\"\n        subtitle=\"After Sarah completes the welcome tour and connects her first bank. Single column, centered. Preparation live; later phases locked.\">\n        <DCArtboard id=\"conservative\" label=\"A · Conservative\" width={1120} height={1400}>\n          <Dashboard variant=\"conservative\"/>\n        </DCArtboard>\n        <DCArtboard id=\"expressive\" label=\"B · Expressive\" width={1120} height={1400}>\n          <Dashboard variant=\"expressive\"/>\n        </DCArtboard>\n      </DCSection>\n    </DesignCanvas>\n  );\n}\n\nReactDOM.createRoot(document.getElementById(\"root\")).render(<App/>);\n<\/script>\n</body>\n</html>\n","Section To-do Panel.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"/>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"/>\n<title>Decouple — Section to-do panel</title>\n<script src=\"https://cdn.tailwindcss.com\"><\/script>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"/>\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<script src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\" integrity=\"sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L\" crossorigin=\"anonymous\"><\/script>\n<script src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\" integrity=\"sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm\" crossorigin=\"anonymous\"><\/script>\n<script src=\"https://unpkg.com/@babel/standalone@7.29.0/babel.min.js\" integrity=\"sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y\" crossorigin=\"anonymous\"><\/script>\n<style>\n  html, body, #root { height: 100%; }\n  body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #F5F5F4; color: #1A1A1A; -webkit-font-smoothing: antialiased; }\n  .label-xs { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }\n  .nice-scroll::-webkit-scrollbar { width: 6px; height: 6px; }\n  .nice-scroll::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 6px; }\n  .nice-scroll::-webkit-scrollbar-track { background: transparent; }\n  button:focus-visible, a:focus-visible { outline: 2px solid #111; outline-offset: 2px; border-radius: 4px; }\n</style>\n</head>\n<body>\n<div id=\"root\"></div>\n\n<script type=\"text/babel\" data-presets=\"react\" src=\"design-canvas.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"shell2/section_todos.jsx\"><\/script>\n\n<script type=\"text/babel\" data-presets=\"react\">\nconst VarA = window.SectionTodos_VariationA;\nconst VarB = window.SectionTodos_VariationB;\nconst VarC = window.SectionTodos_VariationC;\nconst VarD = window.SectionTodos_VariationD;\nconst Spec = window.SectionTodos_SpecCard;\n\nfunction App() {\n  return (\n    <DesignCanvas\n      title=\"Section to-do panel\"\n      subtitle=\"Phase 2 · Your Picture — contextual right-rail. Three rail variations + one inline reference. 760×280 frame matches the existing right column on Your Picture.\"\n    >\n      <DCSection id=\"brief\" title=\"Brief\" defaultCollapsed={false}>\n        <DCArtboard id=\"spec\" label=\"Brief & open questions\" width={360} height={760}>\n          <div style={{ padding: 24, height: \"100%\", boxSizing: \"border-box\", display: \"flex\", alignItems: \"flex-start\", justifyContent: \"center\", background: \"#F5F5F4\" }}>\n            <Spec/>\n          </div>\n        </DCArtboard>\n      </DCSection>\n\n      <DCSection id=\"rails\" title=\"Right-rail variations\">\n        <DCArtboard id=\"A\" label=\"A · Stacked checklist (closest to dashboard pattern)\" width={320} height={800}>\n          <div style={{ padding: 20, height: \"100%\", boxSizing: \"border-box\", display: \"flex\", alignItems: \"flex-start\", justifyContent: \"center\", background: \"#F5F5F4\" }}>\n            <VarA/>\n          </div>\n        </DCArtboard>\n        <DCArtboard id=\"B\" label=\"B · Inline-resolve cards (each task is self-contained)\" width={320} height={800}>\n          <div style={{ padding: 20, height: \"100%\", boxSizing: \"border-box\", display: \"flex\", alignItems: \"flex-start\", justifyContent: \"center\", background: \"#F5F5F4\" }}>\n            <VarB/>\n          </div>\n        </DCArtboard>\n        <DCArtboard id=\"C\" label=\"C · Triage queue (single-focus, AI-ordered)\" width={320} height={800}>\n          <div style={{ padding: 20, height: \"100%\", boxSizing: \"border-box\", display: \"flex\", alignItems: \"flex-start\", justifyContent: \"center\", background: \"#F5F5F4\" }}>\n            <VarC/>\n          </div>\n        </DCArtboard>\n      </DCSection>\n\n      <DCSection id=\"inline\" title=\"Reference · in-doc inline pattern\">\n        <DCArtboard id=\"D\" label=\"D · Inline tasks pinned to rows (no rail)\" width={620} height={520}>\n          <div style={{ padding: 24, height: \"100%\", boxSizing: \"border-box\", display: \"flex\", alignItems: \"flex-start\", justifyContent: \"center\", background: \"#F5F5F4\" }}>\n            <VarD/>\n          </div>\n        </DCArtboard>\n      </DCSection>\n    </DesignCanvas>\n  );\n}\n\nconst root = ReactDOM.createRoot(document.getElementById(\"root\"));\nroot.render(<App/>);\n<\/script>\n</body>\n</html>\n","Your Picture v2.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"/>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"/>\n<title>Decouple — Your Picture v2</title>\n<script src=\"https://cdn.tailwindcss.com\"><\/script>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"/>\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<script src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\" integrity=\"sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L\" crossorigin=\"anonymous\"><\/script>\n<script src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\" integrity=\"sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm\" crossorigin=\"anonymous\"><\/script>\n<script src=\"https://unpkg.com/@babel/standalone@7.29.0/babel.min.js\" integrity=\"sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y\" crossorigin=\"anonymous\"><\/script>\n<style>\n  html, body, #root { height: 100%; }\n  body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #F5F5F4; color: #1A1A1A; -webkit-font-smoothing: antialiased; }\n  .label-xs { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }\n  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }\n  .nice-scroll::-webkit-scrollbar { width: 8px; height: 8px; }\n  .nice-scroll::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 8px; }\n  .nice-scroll::-webkit-scrollbar-track { background: transparent; }\n  button:focus-visible, a:focus-visible { outline: 2px solid #111; outline-offset: 2px; border-radius: 4px; }\n</style>\n</head>\n<body>\n<div id=\"root\"></div>\n\n<script type=\"text/babel\" data-presets=\"react\" src=\"shell2/common.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"shell2/picture.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"shell2/timeline.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"shell2/picture_layouts.jsx\"><\/script>\n\n<script type=\"text/babel\" data-presets=\"react\">\nconst { useState, useEffect } = React;\nconst { LayoutFull, LayoutIconRail, LayoutMobile } = window;\n\nconst TABS = [\n  { id: \"full\",  name: \"Full Rail\",   sub: \"Persistent rail + snapshot · popover history\" },\n  { id: \"icon\",  name: \"Icon Rail\",   sub: \"Hover-expand rail · history opens as side sheet\" },\n  { id: \"mob\",   name: \"Mobile\",      sub: \"375px frame · drawer + bottom sheet\" }\n];\n\nfunction ShareModalLite({ onClose }) {\n  useEffect(() => {\n    const h = (e) => { if (e.key === \"Escape\") onClose(); };\n    window.addEventListener(\"keydown\", h);\n    return () => window.removeEventListener(\"keydown\", h);\n  }, [onClose]);\n  return (\n    <div className=\"fixed inset-0 z-50 flex items-center justify-center\" style={{ background: \"rgba(15,18,22,0.5)\" }} onClick={onClose}>\n      <div onClick={e => e.stopPropagation()} className=\"bg-white rounded-xl p-5\" style={{ width: 420 }}>\n        <div style={{ fontSize: 16, fontWeight: 600 }}>Share with Mark</div>\n        <div className=\"mt-2 text-[12.5px]\" style={{ color: \"#5F6368\", lineHeight: 1.5 }}>\n          (Demo — share modal lives in the original Your Picture file. Press Esc to close.)\n        </div>\n        <button onClick={onClose} className=\"mt-4 h-8 px-3 rounded-md text-[12.5px] font-semibold text-white\" style={{ background: \"#E5484D\" }}>Done</button>\n      </div>\n    </div>\n  );\n}\n\nfunction App() {\n  const [tab, setTab] = useState(() => localStorage.getItem(\"pic_v2_tab\") || \"full\");\n  const [share, setShare] = useState(false);\n  useEffect(() => { localStorage.setItem(\"pic_v2_tab\", tab); }, [tab]);\n\n  let inner = null;\n  if (tab === \"full\") inner = <LayoutFull onOpenShare={() => setShare(true)}/>;\n  else if (tab === \"icon\") inner = <LayoutIconRail onOpenShare={() => setShare(true)}/>;\n  else inner = <LayoutMobile onOpenShare={() => setShare(true)}/>;\n\n  /* Different frame heights per layout */\n  const frameH = tab === \"mob\" ? 820 : 760;\n  const frameBg = tab === \"mob\" ? \"#1F1F1F\" : \"#FFFFFF\";\n\n  return (\n    <div style={{ minHeight: \"100%\" }}>\n      <div className=\"max-w-[1400px] mx-auto px-5 pt-6 pb-3\">\n        <div className=\"flex items-baseline justify-between mb-2\">\n          <div className=\"flex items-baseline gap-3\">\n            <h1 style={{ fontSize: 20, fontWeight: 600, letterSpacing: \"-0.01em\" }}>Your Picture — 3 layouts + shared timeline</h1>\n            <span style={{ fontSize: 12.5, color: \"#6B7280\" }}>Click <b>Version history</b> in any layout to open the timeline pattern.</span>\n          </div>\n        </div>\n        <div className=\"flex gap-1.5\">\n          {TABS.map(t => {\n            const on = tab === t.id;\n            return (\n              <button key={t.id} onClick={() => setTab(t.id)}\n                className=\"text-left rounded-xl px-3.5 py-2.5 transition flex-1\"\n                style={{\n                  background: on ? \"#FFFFFF\" : \"#EDEDEC\",\n                  color: on ? \"#111\" : \"#6B7280\",\n                  border: on ? \"1px solid #111\" : \"1px solid transparent\",\n                  boxShadow: on ? \"0 1px 3px rgba(0,0,0,0.06)\" : \"none\"\n                }}>\n                <div style={{ fontSize: 13, fontWeight: 600 }}>{t.name}</div>\n                <div style={{ fontSize: 11.5, color: on ? \"#6B7280\" : \"#9CA3AF\", marginTop: 1 }}>{t.sub}</div>\n              </button>\n            );\n          })}\n        </div>\n      </div>\n      <div className=\"max-w-[1400px] mx-auto px-5 pb-10\">\n        <div className=\"rounded-2xl overflow-hidden\" style={{ height: frameH, background: frameBg, border: \"1px solid #E5E7EB\", boxShadow: \"0 1px 3px rgba(0,0,0,0.06)\" }}>\n          {inner}\n        </div>\n      </div>\n      {share && <ShareModalLite onClose={() => setShare(false)}/>}\n    </div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById(\"root\")).render(<App/>);\n<\/script>\n</body>\n</html>\n","Reconciliation.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"/>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"/>\n<title>Decouple — Reconciliation</title>\n<script src=\"https://cdn.tailwindcss.com\">< x\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"phase4/shell.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"phase4/ai_rail.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"phase4/ai_content.jsx\"><\/script>\n<script type=\"text/babel\" data-presets=\"react\" src=\"phase4/view_redline.jsx\"><\/script>\n</body>\n</html>\n","Settlement - Pre-flight.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"/>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"/>\n<title>Decouple — Pre-flight quality check</title>\n<script src=\"https://cdn.tailwindcss.com\"><\/script>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"/>\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin/>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+Pro:wght@400;600;700&family=Caveat:wght@500;600&display=swap\" rel=\"stylesheet\">\n<script src=\"https://unpkg.com/react@18.3.1/umd/react.development.js\" integrity=\"sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L\" crossorigin=\"anonymous\"><\/script>\n<script src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\" integrity=\"sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm\" crossorigin=\"anonymous\"><\/script>\n<script src=\"https://unpkg.com/@babel/standalone@7.29.0/babel.min.js\" integrity=\"sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y\" crossorigin=\"anonymous\"><\/script>\n<style>\n  html, body, #root { height: 100%; }\n  body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif; background: #F5F5F4; color: #1A1A1A; -webkit-font-smoothing: antialiased; }\n  .label-xs { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }\n  .nice-scroll::-webkit-scrollbar { width: 8px <script type="text/babel" data-presets="react" data-src="ios-frame.jsx">

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,

<script type="text/babel" data-presets="react" data-src="design-canvas.jsx">

//   <DesignCanvas>

//       <DCArtboard id="b" label="B · Minimal" width={260} height={480}>…</DCArtboard>

const DC = {
  bg: '#f0eee9',
  grid: 'rgba(0,0,0,0.06)',
  label: 'rgba(60,50,40,0.7)',
  title: 'rgba(40,30,20,0.85)',
  subtitle: 'rgba(60,50,40,0.6)',
  postitBg: '#fef4a8',
  postitText: '#5a4a2a',

    '.dc-editable{cursor:text;outline:none;white-space:nowrap;border-radius:3px;padding:0 2px;margin:0 -2px}',

    '[data-dc-slot].dc-dragging{transition:none;z-index:10;pointer-events:none}',

    '.dc-grip{cursor:grab;display:flex;align-items:center;padding:5px 4px;border-radius:4px;transition:background .12s}',

    '.dc-grip:active{cursor:grabbing}',
    '.dc-labeltext{cursor:pointer;border-radius:4px;padding:3px 6px;display:flex;align-items:center;transition:background .12s}',

    '  background:transparent;color:rgba(60,50,40,.7);display:flex;align-items:center;justify-content:center}',
    '.dc-expand:hover{background:rgba(0,0,0,.06);color:#2a251f}',
    '[data-dc-slot]:hover .dc-expand{opacity:1}',
